<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>白色小屋｜入殿黑幕＋乾淨呼吸＋卓爾金</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Noto+Serif+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;}
    body{
      overflow:hidden;
      font-family:'Noto Serif TC', serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      background: linear-gradient(180deg,#FEFEFE 0%,#F8F7F5 30%,#F0EEE9 70%,#E8E5DF 100%);
      color:#2b2b2b;
    }

    .state{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      padding:28px 18px;
    }
    .state.active{ display:flex; }

    /* ==========================================================
       階段1：黑底入殿（把逐行文字放在同一頁，不再另外跳頁）
       ========================================================== */
    #state-entrance{
      background: linear-gradient(180deg, #000 0%, #151515 100%);
      color: rgba(255,255,255,0.92);
      gap:14px;
    }
    .entrance-flower-svg{
      width:380px;height:380px;
      filter: drop-shadow(0 0 46px rgba(212,175,55,0.72));
      animation: entranceGlow 3s ease-in-out;
      user-select:none;
      touch-action: manipulation;
    }
    @keyframes entranceGlow{
      0%{ opacity:0; transform: scale(0.82); }
      60%{ opacity:1; transform: scale(1.05); }
      100%{ opacity:1; transform: scale(1); }
    }
    .entrance-title{
      font-family:'Cinzel', serif;
      letter-spacing:10px;
      font-size:24px;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 0 22px rgba(212,175,55,0.18);
      user-select:none;
      margin-top:2px;
    }
    .entrance-guide{
      margin-top:10px;
      text-align:center;
      max-width:560px;
      padding: 0 16px;
    }
    .entrance-line{
      opacity:0;
      font-size:17px;
      letter-spacing:2px;
      line-height:1.9;
      color: rgba(245,245,245,0.86);
      text-shadow: 0 1px 0 rgba(0,0,0,0.35);
      transform: translateY(10px);
      animation: fadeInLine 1s ease-in-out forwards;
    }
    .entrance-line:nth-child(1){ animation-delay: 0.6s; }
    .entrance-line:nth-child(2){ animation-delay: 1.6s; }
    .entrance-line:nth-child(3){ animation-delay: 2.6s; }
    .entrance-line:nth-child(4){ animation-delay: 3.6s; }
    @keyframes fadeInLine{
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .enter-hint{
      position: fixed;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 6px;
      color: rgba(212,175,55,0.78);
      text-shadow:
        0 1px 0 rgba(0,0,0,0.55),
        0 10px 26px rgba(0,0,0,0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .9s ease;
      white-space: nowrap;
      user-select:none;
    }
    .enter-hint.show{
      opacity: 1;
      animation: hintBreath 4.2s ease-in-out infinite;
    }
    @keyframes hintBreath{
      0%,100%{ opacity:0.62; transform: translateX(-50%) translateY(0); }
      50%{ opacity:0.92; transform: translateX(-50%) translateY(-2px); }
    }
    .entrance-flower-svg.ready{
      cursor:pointer;
      filter: drop-shadow(0 0 60px rgba(199,163,107,0.60));
      animation: readyGlow 2.8s ease-in-out infinite;
    }
    @keyframes readyGlow{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.02); }
    }

    /* ==========================================================
       階段2：呼吸（更乾淨：不把字壓在花上；光暈當主角）
       ========================================================== */
    #state-breath{
      background: linear-gradient(180deg,#FEFEFE 0%,#F8F7F5 40%,#EFEDE8 100%);
      gap:22px;
    }

    .breath-caption{
      font-weight:800;
      letter-spacing:10px;
      font-size:16px;
      color: rgba(110,90,66,0.78);
      user-select:none;
      transform: translateY(4px);
      opacity:0;
      transition: opacity .35s ease;
    }
    .breath-caption.show{ opacity:1; }

    .breath-stage{
      position: relative;
      width: 100%;
      height: 64vh;
      display:flex;
      align-items:center;
      justify-content:center;
      transform: translateY(6vh);
    }

    .heart-flower{
      position: relative;
      width: 120px;
      height: 120px;
      z-index: 3;
      opacity: 0.42;
      user-select:none;
      pointer-events:none;
      filter: drop-shadow(0 0 18px rgba(199,163,107,0.10));
    }
    .heart-flower svg{ width:100%; height:100%; }

    .aura{
      position:absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      z-index: 2;
      background: radial-gradient(circle,
        rgba(212,175,55,0.20) 0%,
        rgba(199,163,107,0.12) 32%,
        rgba(199,163,107,0.06) 52%,
        transparent 72%);
      filter: blur(34px);
      opacity: 0.95;
      transform: scale(1);
    }

    #state-breath.inhale .aura{ animation: auraIn 4s ease-in-out forwards; }
    #state-breath.exhale .aura{ animation: auraOut 6s ease-in-out forwards; }
    @keyframes auraIn{
      0%{ transform: scale(1.00); opacity:0.58; }
      100%{ transform: scale(1.85); opacity:1; }
    }
    @keyframes auraOut{
      0%{ transform: scale(1.85); opacity:1; }
      100%{ transform: scale(1.05); opacity:0.62; }
    }

    .breath-progress{
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display:flex;
      gap: 18px;
      z-index: 10;
      user-select:none;
      pointer-events:none;
    }
    .progress-dot{
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(199,163,107,0.26);
      background: transparent;
      opacity: .45;
      transition: all .45s ease;
    }
    .progress-dot.active{
      opacity: 1;
      border-color: rgba(212,175,55,0.55);
      background: radial-gradient(circle,
        rgba(212,175,55,0.22) 0%,
        rgba(199,163,107,0.12) 60%,
        transparent 100%);
      box-shadow: 0 0 18px rgba(199,163,107,0.26);
      transform: scale(1.08);
    }

    .fade-out{ animation: fadeOut 1.2s ease-out forwards; }
    @keyframes fadeOut{ to{ opacity:0; } }

    /* ==========================================================
       階段3：卓爾金（確保不會空白）
       ========================================================== */
    #state-tzolkin{ padding:10px; }
    .tzolkin-wrap{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px 12px;
      position:relative;
    }
    #tzBoard{
      position:relative;
      width:min(92vw, 720px);
      height:min(88vh, 820px);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #tzBoard.breathing::before{
      content:"";
      position:absolute;
      inset:-28px;
      border-radius:999px;
      background: radial-gradient(circle,
        rgba(212,175,55,.14) 0%,
        rgba(199,163,107,.08) 35%,
        rgba(199,163,107,.04) 55%,
        transparent 72%);
      animation: fieldBreath 2.8s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
    }
    @keyframes fieldBreath{
      0%,100%{ opacity:.20; transform: scale(.985); }
      50%{ opacity:.52; transform: scale(1.02); }
    }

    .tzolkin-grid{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:repeat(13,1fr);
      grid-template-rows:repeat(20,1fr);
      gap:4px;
      cursor:pointer;
      position:relative;
      z-index:2;
    }

    .kin-cell{
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:4px;
      border:1px solid transparent;
      font-size:11px;
      font-weight:600;
      color:#666;
      transition: all 0.2s ease;
      user-select:none;
      background:#fff;
    }
    .kin-cell.red{    background:#FFF5F5; border-color: rgba(255,200,200,0.30); }
    .kin-cell.white{  background:#FFFFFF; border-color: rgba(200,200,200,0.20); }
    .kin-cell.blue{   background:#F0F5FF; border-color: rgba(200,220,255,0.30); }
    .kin-cell.yellow{ background:#FFFBF0; border-color: rgba(255,240,200,0.30); }

    .kin-cell.gap{
      background:#F0FFF0;
      border:2px solid rgba(136,204,136,0.50);
      box-shadow: inset 0 0 6px rgba(136,204,136,0.20);
    }

    .kin-cell.highlight{
      transform: scale(1.35);
      background:#FFF !important;
      border-color:#888 !important;
      box-shadow: 0 0 20px rgba(0,0,0,0.30);
      color:#333;
      font-weight:700;
      z-index:10;
    }

    .lock-indicator{
      position:absolute; left:50%; bottom:-32px; transform:translateX(-50%);
      font-size:18px; color: rgba(120,120,120,0.58);
      transition: all 0.4s ease; user-select:none; pointer-events:none; z-index:6;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    }
    .lock-indicator.locked{
      color: rgba(180,150,90,0.90);
      text-shadow: 0 0 12px rgba(212,175,55,0.70), 0 1px 0 rgba(255,255,255,0.45);
    }

    /* 快速檢查（保留） */
    .debug-btn{
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.85);
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      cursor: pointer;
      z-index: 2000;
      font-size: 18px;
      color: rgba(60,60,60,0.75);
    }
    .debug-panel{
      position: fixed;
      top: 68px;
      right: 16px;
      width: 260px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.10);
      box-shadow: 0 16px 36px rgba(0,0,0,0.14);
      z-index: 2000;
      display: none;
    }
    .debug-panel.show{ display:block; }
    .dbg-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0; }
    .dbg-row label{ font-size:13px; color: rgba(0,0,0,0.60); }
    .dbg-row input{
      width: 110px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.12);
      background:#fff;
      font-size: 14px;
    }
    .dbg-actions{ display:flex; gap:8px; margin-top:8px; }
    .dbg-actions button{
      flex:1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(250,250,250,1);
      cursor:pointer;
      font-size: 13px;
    }
    .dbg-actions button:hover{ background: rgba(245,245,245,1); }

    @media (max-width: 520px){
      .entrance-flower-svg{ width:280px; height:280px; }
      .entrance-title{ font-size:21px; letter-spacing:8px; }
      .entrance-line{ font-size:15px; }

      .breath-stage{ height: 62vh; transform: translateY(4vh); }
      .heart-flower{ width: 96px; height: 96px; opacity:0.40; }
      .aura{ width: 280px; height: 280px; filter: blur(30px); }
      .breath-caption{ font-size:14px; letter-spacing:9px; }

      #tzBoard{ width:94vw; height:92vh; }
      .kin-cell{ font-size:9px; }
      .kin-cell.highlight{ transform: scale(1.25); }
      .lock-indicator{ font-size:16px; bottom:-26px; }
      .debug-panel{ width: 240px; right: 10px; }
    }
    @media (min-width: 521px) and (max-width: 1024px){
      .entrance-flower-svg{ width:320px; height:320px; }
    }
  </style>
</head>

<body>
  <!-- 生命之花 SVG：沿用你的版本（不改形狀） -->
  <svg width="0" height="0" style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#C7A36B;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#B8956A;stop-opacity:1" />
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <symbol id="flower-of-life" viewBox="0 0 350 350">
      <g transform="translate(175, 175)" filter="url(#glow)">
        <circle r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.9"/>

        <circle cx="0" cy="-28" r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.85"/>
        <circle cx="24.25" cy="-14" r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.85"/>
        <circle cx="24.25" cy="14" r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.85"/>
        <circle cx="0" cy="28" r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.85"/>
        <circle cx="-24.25" cy="14" r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.85"/>
        <circle cx="-24.25" cy="-14" r="28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.85"/>

        <g opacity="0.75">
          <circle cx="0" cy="-56" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="48.5" cy="-28" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="48.5" cy="28" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="0" cy="56" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="-48.5" cy="28" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="-48.5" cy="-28" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>

          <circle cx="0" cy="-84" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="72.75" cy="-42" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="72.75" cy="42" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="0" cy="84" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="-72.75" cy="42" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
          <circle cx="-72.75" cy="-42" r="28" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
        </g>
      </g>
    </symbol>
  </svg>

  <div id="state-entrance" class="state active">
    <svg class="entrance-flower-svg" id="entranceFlower" viewBox="0 0 350 350" aria-label="生命之花">
      <use href="#flower-of-life" xlink:href="#flower-of-life"></use>
    </svg>

    <div class="entrance-title">白光聖所</div>

    <div class="entrance-guide" aria-live="polite">
      <div class="entrance-line">在進入之前</div>
      <div class="entrance-line">請先讓心靜下來</div>
      <div class="entrance-line">找一個舒適的姿勢</div>
      <div class="entrance-line">準備好後，點擊生命之花</div>
    </div>

    <div class="enter-hint" id="enterHint">點 擊 · 生 命 · 之 花</div>
  </div>

  <div id="state-breath" class="state">
    <div class="breath-caption" id="breathCaption">吸</div>

    <div class="breath-stage">
      <div class="aura" id="aura" aria-hidden="true"></div>

      <div class="heart-flower" aria-hidden="true">
        <svg viewBox="0 0 350 350">
          <use href="#flower-of-life" xlink:href="#flower-of-life"></use>
        </svg>
      </div>
    </div>

    <div class="breath-progress" aria-hidden="true">
      <div class="progress-dot" id="dot0"></div>
      <div class="progress-dot" id="dot1"></div>
      <div class="progress-dot" id="dot2"></div>
    </div>
  </div>

  <div id="state-tzolkin" class="state">
    <div class="tzolkin-wrap">
      <div id="tzBoard" class="breathing">
        <div class="tzolkin-grid" id="tzGrid"></div>
        <div class="lock-indicator" id="lockSeal">○</div>
      </div>
    </div>
  </div>

  <button class="debug-btn" id="dbgBtn" title="快速檢查">⚙︎</button>
  <div class="debug-panel" id="dbgPanel">
    <div class="dbg-row">
      <label>KIN</label>
      <input id="dbgKin" type="number" min="1" max="260" value="34">
    </div>
    <div class="dbg-actions">
      <button id="dbgShow">顯示卡牌</button>
      <button id="dbgHide">關閉卡牌</button>
    </div>
    <div class="dbg-actions" style="margin-top:6px;">
      <button id="dbgGoto">跳到卓爾金</button>
      <button id="dbgClose">收起面板</button>
    </div>
  </div>

  <script src="../core/kin-card-core.js"></script>

  <script>
    const solarSeals = [
      {name:'紅龍', color:'red'},{name:'白風', color:'white'},{name:'藍夜', color:'blue'},{name:'黃種子', color:'yellow'},
      {name:'紅蛇', color:'red'},{name:'白世界橋', color:'white'},{name:'藍手', color:'blue'},{name:'黃星星', color:'yellow'},
      {name:'紅月', color:'red'},{name:'白狗', color:'white'},{name:'藍猴', color:'blue'},{name:'黃人', color:'yellow'},
      {name:'紅天行者', color:'red'},{name:'白巫師', color:'white'},{name:'藍鷹', color:'blue'},{name:'黃戰士', color:'yellow'},
      {name:'紅地球', color:'red'},{name:'白鏡', color:'white'},{name:'藍風暴', color:'blue'},{name:'黃太陽', color:'yellow'}
    ];
    const galacticTones = ['磁性','月亮','電力','自我存在','超頻','韻律','共振','銀河','太陽','行星','光譜','水晶','宇宙'];
    const gapDays = [1, 20, 22, 39, 43, 50, 51, 58, 64, 69, 72, 77, 85, 88, 93, 96, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 165, 168, 173, 176, 184, 189, 192, 197, 203, 210, 211, 218, 222, 239, 241, 260];

    let kinCard = { showFromKin: ()=>{}, hide: ()=>{} };
    try{
      if (window.KIN_CARD_CORE && typeof window.KIN_CARD_CORE.mount === 'function'){
        kinCard = window.KIN_CARD_CORE.mount({
          hostEl: document.getElementById('tzBoard'),
          imageBasePath: '../images',
          solarSeals,
          galacticTones
        });
      }
    }catch(e){
      console.warn('[white-room] kin-card-core mount failed:', e);
    }

    function switchState(id){
      document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    const entranceFlower = document.getElementById('entranceFlower');
    const enterHint = document.getElementById('enterHint');
    let entranceReady = false;

    window.addEventListener('load', ()=>{
      setTimeout(()=>{
        entranceReady = true;
        enterHint.classList.add('show');
        entranceFlower.classList.add('ready');
      }, 4600);
    });

    entranceFlower.addEventListener('click', ()=>{
      if(!entranceReady) return;
      switchState('state-breath');
      startBreath();
    }, {passive:true});

    const breathState = document.getElementById('state-breath');
    const caption = document.getElementById('breathCaption');
    const dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2')];

    let round = 0;
    let t = null;

    function clearT(){
      if(t) clearTimeout(t);
      t = null;
    }

    function setPhase(phase){
      breathState.classList.remove('inhale','exhale');
      breathState.classList.add(phase);
      caption.textContent = (phase === 'inhale') ? '吸' : '吐';
      caption.classList.add('show');
    }

    function cycle(){
      if(round >= 3){
        finishBreath();
        return;
      }
      dots[round].classList.add('active');

      setPhase('inhale');
      t = setTimeout(()=>{
        setPhase('exhale');
        t = setTimeout(()=>{
          round++;
          cycle();
        }, 6000);
      }, 4000);
    }

    function startBreath(){
      clearT();
      round = 0;
      dots.forEach(d=>d.classList.remove('active'));
      caption.classList.remove('show');
      setTimeout(cycle, 380);
    }

    function finishBreath(){
      clearT();
      breathState.classList.add('fade-out');
      setTimeout(()=>{
        breathState.classList.remove('fade-out','inhale','exhale');
        caption.classList.remove('show');
        switchState('state-tzolkin');
        initTzolkin();
      }, 1200);
    }

    const grid = document.getElementById('tzGrid');
    const board = document.getElementById('tzBoard');
    const lockSeal = document.getElementById('lockSeal');

    let interval = null;
    let current = null;

    function initTzolkin(){
      board.classList.add('breathing');
      lockSeal.textContent = '○';
      lockSeal.classList.remove('locked');

      try{ kinCard.hide(); }catch(e){}
      grid.innerHTML = '';

      for(let row=0; row<20; row++){
        const sealRow = row + 1;
        for(let col=0; col<13; col++){
          const kin = sealRow + 20*col;

          const cell = document.createElement('div');
          cell.className = 'kin-cell ' + solarSeals[sealRow-1].color;

          if (gapDays.includes(kin)) cell.classList.add('gap');

          cell.textContent = kin;
          cell.dataset.kin = String(kin);
          grid.appendChild(cell);
        }
      }
      startShuffle();
    }

    function startShuffle(){
      const cells = document.querySelectorAll('.kin-cell');
      if(interval) clearInterval(interval);

      interval = setInterval(()=>{
        if(current) current.classList.remove('highlight');
        current = cells[Math.floor(Math.random()*cells.length)];
        current.classList.add('highlight');
      }, 120);
    }

    function lockKin(){
      if(!interval) return;
      clearInterval(interval);
      interval = null;

      board.classList.remove('breathing');
      lockSeal.textContent = '◉';
      lockSeal.classList.add('locked');

      const kin = Number(current?.dataset?.kin || 1);
      try{ kinCard.showFromKin(kin); }catch(e){}
    }
    grid.addEventListener('click', lockKin);

    const dbgBtn = document.getElementById('dbgBtn');
    const dbgPanel = document.getElementById('dbgPanel');
    const dbgKin = document.getElementById('dbgKin');
    const dbgShow = document.getElementById('dbgShow');
    const dbgHide = document.getElementById('dbgHide');
    const dbgGoto = document.getElementById('dbgGoto');
    const dbgClose = document.getElementById('dbgClose');

    function clampKin(v){
      let k = parseInt(v || '1', 10);
      if (isNaN(k)) k = 1;
      if (k < 1) k = 1;
      if (k > 260) k = 260;
      return k;
    }

    dbgBtn.addEventListener('click', ()=> dbgPanel.classList.toggle('show'));
    dbgClose.addEventListener('click', ()=> dbgPanel.classList.remove('show'));

    dbgShow.addEventListener('click', ()=>{
      const k = clampKin(dbgKin.value);
      dbgKin.value = String(k);

      if (!document.getElementById('state-tzolkin').classList.contains('active')){
        switchState('state-tzolkin');
        initTzolkin();
      }
      try{ kinCard.showFromKin(k); }catch(e){}
    });

    dbgHide.addEventListener('click', ()=>{ try{ kinCard.hide(); }catch(e){} });

    dbgGoto.addEventListener('click', ()=>{
      if (!document.getElementById('state-tzolkin').classList.contains('active')){
        switchState('state-tzolkin');
      }
      initTzolkin();
    });
  </script>
</body>
</html>
