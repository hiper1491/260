<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>白色靜化境 - 校準對頻</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@300;600;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --white-light: #FDFDFD;
      --gold-aura: #C7A36B;
      --silver-glow: #E0E0E0;
      --kin-red: rgba(255, 185, 185, 0.18);
      --kin-white: rgba(255, 255, 255, 0.9);
      --kin-blue: rgba(185, 210, 255, 0.18);
      --kin-yellow: rgba(255, 245, 185, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      font-family: 'Noto Serif TC', serif;
      background: #FFFFFF;
      display: grid; place-items: center; /* 強制所有內容絕對置中 */
    }

    .state {
      position: absolute; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .state.active { opacity: 1; pointer-events: auto; }

    /* ====== 封面美學 ====== */
    .flower-icon {
      width: min(70vw, 320px); height: min(70vw, 320px);
      filter: drop-shadow(0 0 25px rgba(199, 163, 107, 0.25));
      margin-bottom: 20px;
    }

    .title-group { text-align: center; }
    .title-main {
      font-family: 'Cinzel', serif; font-size: 34px; letter-spacing: 12px;
      color: #333; font-weight: 900; margin-bottom: 10px;
    }
    .title-sub { font-size: 15px; color: #999; letter-spacing: 6px; font-weight: 300; }

    .align-btn {
      margin-top: 50px; padding: 15px 60px;
      background: none; border: 1.5px solid #333;
      font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 18px;
      letter-spacing: 10px; cursor: pointer; border-radius: 40px;
      transition: all 0.5s ease;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }
    .align-btn:hover { background: #333; color: #fff; transform: scale(1.05); }

    /* ====== 呼吸引導：靈能波紋 ====== */
    .pulse-seed {
      position: relative; width: 12px; height: 12px;
      background: var(--gold-aura); border-radius: 50%;
    }
    .pulse-ripple {
      position: absolute; inset: 0; border: 1px solid var(--gold-aura);
      border-radius: 50%; opacity: 0;
    }
    .breathing .pulse-ripple {
      animation: rippleEffect 4s ease-out infinite;
    }
    @keyframes rippleEffect {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(25); opacity: 0; }
    }

    .breath-hint {
      position: absolute; top: 22%; font-size: 20px; letter-spacing: 10px;
      color: #555; font-weight: 900;
    }

    /* ====== 植入靈魂之光動畫 (版本一核心力量) ====== */
    .light-bloom {
      position: absolute; inset: 0; display: grid; place-items: center;
      z-index: 100; pointer-events: none; opacity: 0;
    }
    .bloom-svg {
      width: 350px; height: 350px;
      filter: drop-shadow(0 0 50px #fff) brightness(1.5);
    }
    body.blooming .light-bloom { opacity: 1; }
    body.blooming .bloom-svg {
      animation: finalBloom 1.5s ease-out forwards;
    }
    @keyframes finalBloom {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(2) rotate(15deg); filter: blur(5px) brightness(2); }
      100% { transform: scale(20) rotate(45deg); opacity: 0; filter: blur(20px) brightness(5); }
    }

    /* ====== 卓爾金網格：提煉後的純淨 ====== */
    #tzGrid {
      height: 82dvh; aspect-ratio: 13 / 20;
      display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: repeat(20, 1fr);
      gap: 3px; opacity: 0; transition: opacity 2s ease;
    }
    #tzGrid.visible { opacity: 1; }

    .kin-cell {
      background: var(--kin-white); border: 1px solid rgba(0,0,0,0.02);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: min(1.3vh, 10px); color: #AAA;
      transition: all 0.3s;
    }
    .kin-cell.red { background: var(--kin-red); }
    .kin-cell.blue { background: var(--kin-blue); }
    .kin-cell.yellow { background: var(--kin-yellow); }
    .kin-cell.gap { border: 1.5px solid rgba(136, 204, 136, 0.4); }
    
    .kin-cell.highlight {
      transform: scale(1.4); z-index: 50; background: #fff !important;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15); border-color: #333; color: #222;
    }

    .dot-track { display: flex; gap: 20px; margin-top: 60px; }
    .dot { width: 8px; height: 8px; border: 1px solid #333; border-radius: 50%; transition: 0.5s; }
    .dot.active { background: #333; box-shadow: 0 0 10px rgba(0,0,0,0.2); }

    @media (max-width: 500px) {
      .title-main { font-size: 28px; }
      #tzGrid { height: 78dvh; gap: 2px; }
    }
  </style>
</head>
<body>

  <div class="light-bloom">
    <svg class="bloom-svg" viewBox="0 0 400 400">
      <g transform="translate(200, 200)" fill="none" stroke="#C7A36B" stroke-width="2">
        <circle r="40"/><circle cx="0" cy="-40" r="40"/><circle cx="34.6" cy="-20" r="40"/><circle cx="34.6" cy="20" r="40"/>
        <circle cx="0" cy="40" r="40"/><circle cx="-34.6" cy="20" r="40"/><circle cx="-34.6" cy="-20" r="40"/>
        <g stroke-width="1.5" opacity="0.7">
          <circle cx="0" cy="-80" r="40"/><circle cx="52" cy="0" r="40"/><circle cx="0" cy="60" r="40"/><circle cx="-52" cy="0" r="40"/>
        </g>
      </g>
    </svg>
  </div>

  <div id="state-entrance" class="state active">
    <svg class="flower-icon" viewBox="0 0 400 400">
      <g transform="translate(200, 200)" fill="none" stroke="#C7A36B" stroke-width="1.8">
        <circle r="40"/>
        <circle cx="0" cy="-40" r="40"/><circle cx="34.6" cy="-20" r="40"/><circle cx="34.6" cy="20" r="40"/>
        <circle cx="0" cy="40" r="40"/><circle cx="-34.6" cy="20" r="40"/><circle cx="-34.6" cy="-20" r="40"/>
      </g>
    </svg>
    <div class="title-group">
      <h1 class="title-main">白色靜化境</h1>
      <p class="title-sub">提 煉 內 在 的 真 實</p>
    </div>
    <button class="align-btn" onclick="startAlignment()">校準對頻</button>
  </div>

  <div id="state-meditation" class="state">
    <div class="breath-hint" id="breathLabel">吸 入 光 ...</div>
    <div class="pulse-seed">
      <div class="pulse-ripple"></div>
      <div class="pulse-ripple" style="animation-delay: 1s"></div>
      <div class="pulse-ripple" style="animation-delay: 2s"></div>
    </div>
    <div class="dot-track">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <div id="state-tzolkin" class="state">
    <div id="tzGrid"></div>
    <p style="position:absolute; bottom:30px; letter-spacing:5px; color:#bbb; font-size:14px; font-weight:300;">輕 觸 螢 幕 · 鎖 定 對 頻</p>
  </div>

  <script src="../core/kin-card-core.js"></script>

  <script>
    const solarSeals = [
      {name:'紅龍', color:'red'},{name:'白風', color:'white'},{name:'藍夜', color:'blue'},{name:'黃種子', color:'yellow'},
      {name:'紅蛇', color:'red'},{name:'白世界橋', color:'white'},{name:'藍手', color:'blue'},{name:'黃星星', color:'yellow'},
      {name:'紅月', color:'red'},{name:'白狗', color:'white'},{name:'藍猴', color:'blue'},{name:'黃人', color:'yellow'},
      {name:'紅天行者', color:'red'},{name:'白巫師', color:'white'},{name:'藍鷹', color:'blue'},{name:'黃戰士', color:'yellow'},
      {name:'紅地球', color:'red'},{name:'白鏡', color:'white'},{name:'藍風暴', color:'blue'},{name:'黃太陽', color:'yellow'}
    ];
    const gapDays = [1,20,22,39,43,50,51,58,64,69,72,77,85,88,93,96,106,107,108,109,110,111,112,113,114,115,146,147,148,149,150,151,152,153,154,155,165,168,173,176,184,189,192,197,203,210,211,218,222,239,241,260];

    const kinCard = KIN_CARD_CORE.mount({
      hostEl: document.body,
      imageBasePath: '../images',
      solarSeals,
      galacticTones: ['磁性','月亮','電力','自我存在','超頻','韻律','共振','銀河','太陽','行星','光譜','水晶','宇宙']
    });

    function startAlignment() {
      document.getElementById('state-entrance').classList.remove('active');
      document.getElementById('state-meditation').classList.add('active');
      setTimeout(runCalibration, 500);
    }

    let breathCount = 0;
    const dots = document.querySelectorAll('.dot');
    const label = document.getElementById('breathLabel');
    const medState = document.getElementById('state-meditation');

    function runCalibration() {
      if (breathCount < 3) {
        dots[breathCount].classList.add('active');
        medState.classList.add('breathing');
        label.textContent = "吸 入 光 ...";
        
        setTimeout(() => {
          label.textContent = "吐 出 氣 ...";
          setTimeout(() => {
            medState.classList.remove('breathing');
            breathCount++;
            runCalibration();
          }, 4000);
        }, 4000);
      } else {
        // 植入靈魂動畫
        document.body.classList.add('blooming');
        setTimeout(() => {
          document.getElementById('state-meditation').classList.remove('active');
          document.getElementById('state-tzolkin').classList.add('active');
          initGrid();
        }, 1200);
      }
    }

    let shuffleInterval = null;
    let activeCell = null;

    function initGrid() {
      const grid = document.getElementById('tzGrid');
      grid.innerHTML = '';
      for(let row=0; row<20; row++) {
        for(let col=0; col<13; col++) {
          const kin = (row + 1) + 20 * col;
          const cell = document.createElement('div');
          cell.className = 'kin-cell ' + solarSeals[row].color;
          if (gapDays.includes(kin)) cell.classList.add('gap');
          cell.textContent = kin;
          cell.dataset.kin = kin;
          grid.appendChild(cell);
        }
      }
      setTimeout(() => {
        grid.classList.add('visible');
        startShuffle();
      }, 500);
    }

    function startShuffle() {
      const cells = document.querySelectorAll('.kin-cell');
      shuffleInterval = setInterval(() => {
        if (activeCell) activeCell.classList.remove('highlight');
        activeCell = cells[Math.floor(Math.random() * cells.length)];
        activeCell.classList.add('highlight');
      }, 75);
    }

    document.getElementById('state-tzolkin').addEventListener('click', () => {
      if (!shuffleInterval) return;
      clearInterval(shuffleInterval);
      shuffleInterval = null;
      kinCard.showFromKin(Number(activeCell.dataset.kin));
    });
  </script>
</body>
</html>
