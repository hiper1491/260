<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卓爾金曆 · 260 KIN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background: radial-gradient(ellipse at center, #fdfcfb 0%, #f7f5f2 40%, #ebe8e3 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 神聖幾何背景 */
        .sacred-geometry-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(180, 150, 80, 0.1) 40px, rgba(180, 150, 80, 0.1) 41px),
                repeating-linear-gradient(60deg, transparent, transparent 40px, rgba(180, 150, 80, 0.1) 40px, rgba(180, 150, 80, 0.1) 41px),
                repeating-linear-gradient(120deg, transparent, transparent 40px, rgba(180, 150, 80, 0.1) 40px, rgba(180, 150, 80, 0.1) 41px);
            pointer-events: none;
            z-index: 1;
        }

        /* 頁面進入動畫 */
        .page-container {
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 標題區 */
        .header {
            text-align: center;
            padding: 20px 20px 10px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            color: #5a5a5a;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 14px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* 卓爾金曆容器 */
        .tzolkin-container {
            width: 100%;
            height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            z-index: 5;
        }

        .tzolkin-wrapper {
            width: fit-content;
            height: fit-content;
            max-width: 95vw;
            max-height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 260 格網格 - 13欄×20行 */
        .tzolkin-grid {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            grid-template-rows: repeat(20, 1fr);
            grid-auto-flow: column;  /* 重要：先填欄，再填行 */
            gap: 2px;
            width: min(90vw, calc(90vh * 13 / 20));
            height: min(90vh, calc(90vw * 20 / 13));
            background: rgba(255, 255, 255, 0.2);
            padding: 5px;
            border-radius: 8px;
        }

        /* KIN 格子 */
        .kin-cell {
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 200, 200, 0.4);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(9px, 1.2vw, 16px);
            font-weight: 500;
            color: #5a5a5a;
        }

        .kin-cell:hover {
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            border-color: rgba(212, 175, 55, 0.6);
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
        }

        /* GAP 日 */
        .kin-cell.gap {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.35) 0%, rgba(102, 187, 106, 0.45) 100%);
            border-color: rgba(76, 175, 80, 0.6);
        }

        .kin-cell.gap:hover {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.5) 0%, rgba(102, 187, 106, 0.6) 100%);
        }

        /* 光點 */
        .light-orb {
            position: absolute;
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .light-orb.active {
            display: block;
            animation: orbPulse 0.6s ease-in-out infinite;
        }

        .orb-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 255, 250, 0.95) 0%, 
                rgba(255, 250, 235, 0.85) 30%,
                rgba(250, 240, 210, 0.7) 60%,
                rgba(240, 225, 180, 0.4) 100%
            );
            box-shadow: 
                0 0 30px rgba(255, 248, 220, 0.9),
                0 0 60px rgba(240, 220, 160, 0.7),
                inset 0 0 20px rgba(255, 255, 240, 0.6);
        }

        @keyframes orbPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        /* 定錨按鈕 */
        .anchor-button {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            border: 2px solid rgba(212, 175, 55, 0.6);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s ease;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(212, 175, 55, 0.3);
        }

        .anchor-button:hover {
            background: rgba(212, 175, 55, 0.25);
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 8px 35px rgba(212, 175, 55, 0.5);
            transform: scale(1.05);
        }

        .anchor-button.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .anchor-icon {
            font-size: 30px;
            margin-bottom: 3px;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
        }

        .anchor-text {
            font-size: 11px;
            color: #7a7a7a;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* 響應式 */
        @media (max-width: 1024px) {
            .tzolkin-grid {
                gap: 1.5px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
                letter-spacing: 10px;
            }

            .tzolkin-container {
                height: calc(100vh - 60px);
            }

            .tzolkin-grid {
                gap: 1px;
                width: min(95vw, calc(95vh * 13 / 20));
                height: min(95vh, calc(95vw * 20 / 13));
            }

            .anchor-button {
                width: 60px;
                height: 60px;
                bottom: 25px;
                right: 25px;
            }

            .anchor-icon {
                font-size: 24px;
            }

            .anchor-text {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="sacred-geometry-bg"></div>
    
    <div class="page-container">
        <div class="header">
            <h1>卓爾金曆</h1>
        </div>

        <div class="tzolkin-container">
            <div class="tzolkin-wrapper">
                <div class="tzolkin-grid" id="tzolkinGrid">
                    <!-- 由 JavaScript 動態生成 -->
                </div>
            </div>
        </div>

        <!-- 光點 -->
        <div class="light-orb" id="lightOrb">
            <div class="orb-core"></div>
        </div>

        <!-- 定錨按鈕 -->
        <div class="anchor-button" id="anchorButton">
            <div class="anchor-icon">⚓</div>
            <div class="anchor-text">定錨</div>
        </div>
    </div>

    <script>
        // ============================================
        // GAP 日（正確版本）
        // ============================================
        const gapDays = [1, 20, 22, 39, 43, 50, 51, 58, 64, 69, 72, 77, 85, 88, 93, 96, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 165, 168, 173, 176, 184, 189, 192, 197, 203, 210, 211, 218, 222, 239, 241, 260];

        // ============================================
        // DOM 元素
        // ============================================
        const grid = document.getElementById('tzolkinGrid');
        const lightOrb = document.getElementById('lightOrb');
        const anchorButton = document.getElementById('anchorButton');

        let currentKin = 1;
        let isJumping = false;
        let jumpInterval = null;
        let targetKin = null;

        // ============================================
        // 生成 260 格（13欄×20行）
        // ============================================
        function generateGrid() {
            console.log('開始生成 260 格...');
            grid.innerHTML = '';

            // 直接生成 1-260，CSS Grid 的 grid-auto-flow: column 會自動按欄排列
            for (let kin = 1; kin <= 260; kin++) {
                const isGap = gapDays.includes(kin);
                
                const cell = document.createElement('div');
                cell.className = `kin-cell${isGap ? ' gap' : ''}`;
                cell.setAttribute('data-kin', kin);
                cell.id = `cell-${kin}`;
                cell.textContent = kin;
                
                grid.appendChild(cell);
            }

            console.log(`已生成 ${grid.children.length} 個格子`);
            console.log('排列方式：第一欄 1-20，第二欄 21-40...');
        }

        // ============================================
        // 光點跳動系統
        // ============================================
        function positionLightOrb(kin) {
            const cell = document.getElementById(`cell-${kin}`);
            if (!cell) {
                console.warn(`找不到格子: cell-${kin}`);
                return;
            }

            const rect = cell.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;

            lightOrb.style.left = (rect.left + scrollLeft + rect.width / 2 - 35) + 'px';
            lightOrb.style.top = (rect.top + scrollTop + rect.height / 2 - 35) + 'px';
            lightOrb.classList.add('active');
        }

        function startJumping() {
            console.log('開始光點跳動...');
            isJumping = true;
            currentKin = 1;
            anchorButton.classList.remove('hidden');

            let speed = 80; // 初始速度（毫秒）

            function jump() {
                if (!isJumping) return;

                positionLightOrb(currentKin);

                // 速度曲線：前50格快，中間穩定，後面漸慢
                if (currentKin < 50) {
                    speed = 80;
                } else if (currentKin < 200) {
                    speed = 150;
                } else {
                    speed = Math.min(400, 150 + (currentKin - 200) * 4);
                }

                currentKin++;
                if (currentKin <= 260) {
                    jumpInterval = setTimeout(jump, speed);
                }
            }

            jump();
        }

        function stopJumping() {
            console.log('停止光點跳動');
            isJumping = false;
            if (jumpInterval) {
                clearTimeout(jumpInterval);
            }
            targetKin = currentKin - 1;
            
            console.log(`定錨在 KIN ${targetKin}`);
            anchorButton.classList.add('hidden');
            
            // TODO: 下一階段 - 顯示 KIN 卡片
        }

        // ============================================
        // 事件監聽
        // ============================================
        anchorButton.addEventListener('click', () => {
            if (isJumping) {
                stopJumping();
            }
        });

        // ============================================
        // 初始化
        // ============================================
        console.log('初始化卓爾金曆...');
        generateGrid();

        // 頁面載入 2 秒後開始光點跳動
        setTimeout(() => {
            startJumping();
        }, 2000);
    </script>
</body>
</html>
