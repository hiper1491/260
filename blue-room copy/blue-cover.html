<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>藍色114-1｜封面 (v2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg0:#08121f; --bg1:#0c1f33; --blue:#79bcff;
      --ink:#dbe7ef; --line:rgba(167,220,255,0.15);
    }
    body{
      margin:0; font-family:'Noto Serif TC', serif; color:var(--ink);
      background: radial-gradient(circle at 50% 40%, #16365a 0%, var(--bg0) 70%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .card{
      width:min(600px,90%); text-align:center;
      animation: fadeIn 1.5s ease;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

    .kicker{
      font-family:'Cormorant Garamond', serif; letter-spacing:.4em;
      color:var(--blue); opacity:.8; font-size:1rem;
    }
    h1{
      font-size:2.8rem; letter-spacing:.15em; margin:20px 0;
      background: linear-gradient(to bottom, #fff, var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .disc{
      width:220px; height:220px; border-radius:50%; margin:40px auto;
      border: 1px solid var(--line);
      background: radial-gradient(circle, rgba(121,188,255,0.15) 0%, transparent 70%);
      display:flex; align-items:center; justify-content:center;
      position:relative; box-shadow: 0 0 50px rgba(0,0,0,0.3);
    }
    .disc::after {
      content:''; position:absolute; inset:-10px; border-radius:50%;
      border: 1px solid rgba(121,188,255,0.05); animation: pulse 4s infinite;
    }
    .disc img{ width:70%; height:70%; opacity:.9; filter: drop-shadow(0 0 15px var(--blue)); }
    
    @keyframes pulse { 0%{transform:scale(1); opacity:0.5;} 100%{transform:scale(1.3); opacity:0;} }

    .btn{
      background: transparent; border: 1px solid var(--blue); color: var(--blue);
      padding: 15px 40px; border-radius: 40px; font-weight: 600; cursor: pointer;
      transition: all 0.3s; letter-spacing: 2px;
    }
    .btn:hover{ background: var(--blue); color: var(--bg0); box-shadow: 0 0 20px rgba(121,188,255,0.4); }
    .hint{ margin-top:30px; font-size:0.9rem; opacity:0.5; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <div class="kicker">WESTERN ALCHEMY</div>
    <h1>西方・轉煉</h1>
    <div class="disc">
      <img src="../images/hunab-ku-1.png" alt="Hunab-Ku">
    </div>
    <button class="btn" onclick="goInner()">開啟煉金陣列</button>
    <div class="hint">這是一場跨越時間的靜心</div>
  </div>
  <script>
    function goInner(){ parent.postMessage({type:'NAV', to:'inner'}, '*'); }
    function postHeight(){
      const h = document.documentElement.scrollHeight;
      parent.postMessage({type:'HEIGHT', id:'cover', height:h}, '*');
    }
    window.onload = postHeight;
  </script>
</body>
</html>
