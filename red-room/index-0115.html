<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- 114-13版｜母版=114-11｜只加 Level 3 神廟閱讀層（A＋B）｜不滾動｜不改抽卡/內頁結構 -->
  <title>13月亮曆・神廟石碑（115）</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ✅ FIX：你的 kin-calculator.js 在專案根目錄，不在 red-room -->
  <script src="../kin-calculator.js"></script>
  <script src="./red-brain.js"></script>

  <style>
    :root{
      --theme:#A5413F;
      --bg:#F8E8E8;
      --ink:#111;
      --themeRGB:165,65,63;
    }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      background:var(--bg);
      font-family:'Noto Serif TC', serif;
      overflow:hidden;
      transition: background-color 1.1s ease;
    }
    @supports (height: 100svh){
      html,body{ height:100svh; }
    }
    #root{ width:100%; height:100%; }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 650px at 50% 32%, rgba(255,255,255,.42), transparent 60%),
        radial-gradient(1200px 900px at 50% 92%, rgba(0,0,0,.14), transparent 66%);
      mix-blend-mode:multiply;
      opacity:.9;
    }

    /* =========================
       轉場：整版單色幕布（淺→更淺→無）
       ========================= */
    .cover-curtain{
      position:fixed;
      inset:0;
      z-index:9996;
      pointer-events:none;
    }
    .cover-curtain::before{
      content:"";
      position:absolute;
      inset:0;
      background: rgba(var(--themeRGB), 0.00);
      opacity:0;
      will-change: opacity, background;
    }
    body.cover-transiting .cover-curtain::before{
      animation: curtainMono 2.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes curtainMono{
      0%   { opacity:0; background: rgba(var(--themeRGB), 0.00); }
      14%  { opacity:1; background: rgba(var(--themeRGB), 0.16); }
      72%  { opacity:1; background: rgba(var(--themeRGB), 0.06); }
      100% { opacity:0; background: rgba(var(--themeRGB), 0.00); }
    }

    /* 放大旋進 Hunab Ku（同色線條） */
    .hunab-flip-svg{
      position:fixed;
      left:0; top:0;
      width:120px; height:120px;
      z-index:9998;
      pointer-events:none;
      opacity:0;
      transform-origin:center;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.10));
    }
    .hunab-flip-svg.show{ opacity:1; }
    .hunab-flip-svg .tint{
      fill: rgb(var(--themeRGB));
      opacity: .26;
    }

    .hunab-field{
      position:fixed;
      inset:0;
      z-index:9997;
      pointer-events:none;
      opacity:0;
      transition: opacity .12s ease;
    }
    .hunab-field.show{ opacity:1; }
    .hunab-field::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(900px 650px at 50% 48%,
          rgba(var(--themeRGB),0.20),
          rgba(var(--themeRGB),0.08) 48%,
          rgba(var(--themeRGB),0.00) 74%),
        radial-gradient(900px 650px at 50% 48%,
          rgba(255,255,255,0.22),
          rgba(255,255,255,0.08) 55%,
          rgba(255,255,255,0.00) 78%);
      opacity:0;
      filter: blur(0px);
      will-change: opacity, filter;
    }
    body.flip-activating .hunab-field::before{
      animation: fieldIn 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fieldIn{
      0%{ opacity:0; filter: blur(0px); }
      40%{ opacity:0.18; filter: blur(0px); }
      100%{ opacity:0.44; filter: blur(1px); }
    }

    /* Level 3 overlay */
    .reading-overlay{
      position:fixed;
      inset:0;
      z-index:2500;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(18,14,12,0.58);
      backdrop-filter: blur(2px);
      opacity:0;
      pointer-events:none;
      transition: opacity .55s ease;
    }
    .reading-overlay.show{ opacity:1; pointer-events:auto; }
    .reading-stone{
      width:min(760px,92vw);
      border-radius:64px;
      background:linear-gradient(180deg,#ECE7DE,#DED6C9);
      box-shadow:
        0 80px 140px rgba(0,0,0,.45),
        inset 0 4px 18px rgba(0,0,0,.28),
        inset 0 -2px 4px rgba(255,255,255,.4);
      padding:clamp(30px,4.6vh,52px);
      position:relative;
    }
    .reading-inner{
      background:rgba(245,242,236,.94);
      border-radius:36px;
      padding:clamp(22px,3.8vh,38px);
      box-shadow: inset 0 3px 12px rgba(0,0,0,.18);
    }
    .reading-title{
      font-family:'Cinzel',serif;
      font-size:1.25rem;
      letter-spacing:6px;
      text-align:center;
      margin-bottom:16px;
      opacity:.78;
      user-select:none;
    }
    .reading-block-title{
      font-weight:900;
      letter-spacing:2px;
      opacity:.70;
      margin:16px 0 10px;
    }
    .reading-text{
      font-size:1.16rem;
      line-height:1.9;
      font-weight:800;
      color:#111;
      word-break:break-word;
      white-space:pre-wrap;
    }
    .reading-exit{
      text-align:center;
      margin-top:18px;
      font-size:.9rem;
      letter-spacing:3px;
      opacity:.55;
      cursor:pointer;
      user-select:none;
    }
    .reading-exit:hover{ opacity:.85; }
    .reading-entry{
      text-align:center;
      margin-top:14px;
      font-size:.9rem;
      letter-spacing:3px;
      opacity:.55;
      cursor:pointer;
      user-select:none;
    }
    .reading-entry:hover{ opacity:.85; }

    /* =========================
       內頁（不動）
       ========================= */
    .home-button{
      position:fixed;
      top:32px;
      left:42px;
      width:64px;
      height:64px;
      border-radius:50%;
      background:linear-gradient(180deg,#F5F2EC,#E6E1DA);
      box-shadow:
        0 8px 16px rgba(0,0,0,.18),
        inset 0 1px 3px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:140;
      transition:.2s;
      text-decoration:none;
      font-size:1.7rem;
    }
    .home-button:hover{ transform:translateY(-2px) scale(1.05); }

    .history-sidebar{
      position:fixed;
      left:42px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      gap:16px;
      z-index:120;
    }
    .history-stone{
      width:76px;
      height:70px;
      border-radius:40% 60% 70% 30% / 50% 40% 60% 50%;
      background:linear-gradient(180deg,#F5F2EC,#E6E1DA);
      box-shadow:
        0 18px 34px rgba(0,0,0,.22),
        inset 0 2px 10px rgba(0,0,0,.14),
        inset 0 1px 0 rgba(255,255,255,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#222;
      font-family:'Cinzel', serif;
      font-weight:900;
      font-size:1.12rem;
      cursor:pointer;
      user-select:none;
      transition:.18s;
    }
    .history-stone:hover{ transform:translateY(-2px) scale(1.03); }

    .tablet{
      width:min(760px,92vw);
      height:min(880px,90vh);
      margin:0 auto;
      position:relative;
      border-radius:56px;
      background:linear-gradient(180deg,#F1EFE8,#E6E0D6);
      border:1px solid rgba(0,0,0,.10);
      box-shadow: 0 60px 110px rgba(0,0,0,.32), 0 14px 22px rgba(0,0,0,.18);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    @supports (height: 100svh){
      .tablet{ height:min(880px, 90svh); }
    }
    .tablet::after{
      content:"";
      position:absolute; inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,.10), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(0,0,0,.08), transparent 60%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      opacity:.16;
      mix-blend-mode:multiply;
    }

    .content{
      position:relative;
      z-index:5;
      width:100%;
      height:100%;
      padding:clamp(28px, 4vh, 52px) clamp(24px, 3.4vw, 48px) clamp(24px, 3vh, 40px);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(6px, 1.2vh, 14px);
      min-height:0;
      overflow:hidden;
    }

    .tone-area{ height:72px; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; flex:0 0 72px; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .tone-dots{ height:28px; display:flex; align-items:center; justify-content:center; gap:14px; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .tone-bars{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .tone-dot{ width:22px; height:22px; background:#000; border-radius:50%; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .tone-bar{ width:190px; height:16px; background:#000; border-radius:8px; transition:all .6s cubic-bezier(.4,0,.2,1); }

    .glyph-area{ width:100%; display:flex; justify-content:center; margin-top:8px; margin-bottom:6px; flex:0 0 200px; align-items:center; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .glyph-frame{ display:inline-flex; padding:10px; border-radius:24px; background:rgba(255,255,255,.12); border:1px solid rgba(0,0,0,.14); box-shadow:inset 0 4px 20px rgba(0,0,0,.30), inset 0 -6px 16px rgba(255,255,255,.24), 0 14px 28px rgba(0,0,0,.18); cursor:pointer; user-select:none; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .glyph-frame:hover{ transform: translateY(-2px); }
    .glyph-img{ height:180px; border-radius:16px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.24)); transition:all .6s cubic-bezier(.4,0,.2,1); }

    .kin-id{ font-family:'Cinzel', serif; font-size:clamp(2.8rem, 4.8vh, 3.8rem); font-weight:900; line-height:1; margin-top:2px; min-width:9ch; text-align:center; font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; user-select:none; cursor:pointer; color:#0E0E0E; flex:0 0 auto; transition:all .6s cubic-bezier(.4,0,.2,1); }
    .kin-name{ font-size:clamp(1.8rem, 3.5vh, 2.6rem); font-weight:900; letter-spacing:clamp(3px, .9vw, 7px); margin-top:4px; text-align:center; color:#111; flex:0 0 auto; transition:all .6s cubic-bezier(.4,0,.2,1); }

    .wavespell-badge{ display:inline-flex; align-items:center; gap:8px; padding:8px 18px; background:rgba(0,0,0,.06); border-radius:999px; font-size:.95rem; font-weight:700; color:#333; letter-spacing:1px; margin-top:4px; border:1px solid rgba(0,0,0,.08); box-shadow: inset 0 1px 3px rgba(0,0,0,.08); transition:all .6s cubic-bezier(.4,0,.2,1); flex:0 0 auto; }
    .wavespell-icon{ width:18px; height:18px; border-radius:4px; opacity:.9; }

    .name-etch{ width:64%; height:12px; border-radius:999px; background:linear-gradient(90deg, transparent 0%, var(--theme) 50%, transparent 100%); opacity:.64; margin:10px auto 12px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.14)); flex:0 0 auto; transition:all .6s cubic-bezier(.4,0,.2,1); }

    .compact .tone-area{ height:48px; flex-basis:48px; gap:6px; }
    .compact .tone-dots{ height:18px; gap:10px; }
    .compact .tone-bars{ gap:6px; }
    .compact .tone-dot{ width:14px; height:14px; }
    .compact .tone-bar{ width:120px; height:10px; }
    .compact .glyph-area{ flex-basis:130px; margin-bottom:4px; margin-top:4px; }
    .compact .glyph-frame{ padding:6px; }
    .compact .glyph-img{ height:118px; }
    .compact .kin-id{ font-size:clamp(1.8rem, 3.2vh, 2.2rem); margin-top:0; }
    .compact .kin-name{ font-size:clamp(1.25rem, 2.4vh, 1.7rem); margin-top:2px; letter-spacing:clamp(2px, .6vw, 4px); }
    .compact .wavespell-badge{ padding:5px 12px; font-size:.8rem; gap:6px; }
    .compact .wavespell-icon{ width:14px; height:14px; }
    .compact .name-etch{ width:50%; height:8px; margin:6px auto 10px; }

    .rest-slot{
      width:92%;
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:stretch;
    }

    .spinning-placeholder{
      width:100%;
      flex:1 1 auto;
      min-height:0;
      border-radius:32px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(0,0,0,.12);
      box-shadow: inset 0 3px 16px rgba(0,0,0,.18), 0 12px 20px rgba(0,0,0,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      letter-spacing:3px;
      opacity:.86;
      color:#111;
      font-size:1.05rem;
      text-align:center;
      padding:18px 18px;
      position:relative;
      overflow:hidden;
    }

    .msg-stack{ width:100%; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:clamp(16px, 2vh, 22px); animation: slideInUp .7s cubic-bezier(.4,0,.2,1) forwards; opacity:0; }
    @keyframes slideInUp{ from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:translateY(0)} }
    .msg-box{ background:rgba(245,242,236,.66); border-radius:32px; padding:clamp(20px,2.4vh,30px) clamp(22px,2.6vw,34px); border:1px solid rgba(0,0,0,.12); box-shadow: inset 0 3px 16px rgba(0,0,0,.24), 0 12px 20px rgba(0,0,0,.14); backdrop-filter: blur(3px); flex-shrink:0; }
    .label{ font-weight:900; opacity:.64; margin-bottom:12px; display:block; letter-spacing:2px; text-align:center; color:#111; font-size:1rem; }
    .content-text{ font-size:clamp(1.15rem,2.15vh,1.48rem); line-height:1.9; font-weight:900; text-align:left; color:#0B0B0B; text-shadow:none; word-break:break-word; }

    .ultra-msg .msg-stack{ gap:10px; }
    .ultra-msg .msg-box{ border-radius:24px; padding:14px 16px; }
    .ultra-msg .label{ font-size:0.88rem; margin-bottom:8px; letter-spacing:1px; }
    .ultra-msg .content-text{ font-size:1.02rem; line-height:1.65; }

    /* ✅ Portal Scrim（點外收合）
       ✅ FIX：z-index 必須低於 history-sidebar，否則你點不到石頭，永遠無法收合 */
    .portal-scrim{
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,.14);
      backdrop-filter: blur(0.5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease;
      touch-action: manipulation;
    }
    .portal-scrim.show{
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================
       ✅ Fix-10 封面：保留你說「圖位置OK」的布局
       （以下略：原檔內容保持）
       ========================= */
    .pre-card{
      width:min(680px,88%);
      border-radius:56px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.28), transparent 75%),
        linear-gradient(135deg, rgba(255,255,255,.15), rgba(0,0,0,.05)),
        rgba(255,255,255,.09);
      border:2px solid rgba(0,0,0,.09);
      box-shadow:
        0 52px 98px rgba(0,0,0,.24),
        inset 0 3px 20px rgba(0,0,0,.20),
        inset 0 -1px 0 rgba(255,255,255,.38);
      cursor:pointer;
      user-select:none;
      position:relative;
      overflow:hidden;
      transition: transform .25s ease;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: clamp(24px, 3vh, 38px) 20px clamp(18px, 2.4vh, 28px);
      min-height: min(620px, 72vh);
    }

    .cover-bay{
      width:100%;
      position:relative;
      height: 430px;
      display:block;
    }

    .bay-orn-top{
      position:absolute;
      left:50%;
      top:12px;
      transform:translateX(-50%);
    }
    .bay-orn-bottom{
      position:absolute;
      left:50%;
      bottom:10px;
      transform:translateX(-50%);
      text-align:center;
    }

    .bay-center{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      width:100%;
    }

    .pre-ornament{ display:flex; align-items:center; gap:16px; margin:0; }
    .pre-ornament-dot{ width:6px; height:6px; background:rgba(0,0,0,.22); border-radius:50%; }
    .pre-ornament-line{ width:74px; height:1px; background:linear-gradient(90deg, transparent, rgba(0,0,0,.24), transparent); }
    .pre-ornament-line.short{ width:56px; }

    .pre-symbol{
      width:170px;
      height:170px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      overflow:hidden;
    }
    .pre-glow{
      position:absolute;
      inset:-50px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.40), transparent 62%);
      opacity:.28;
      pointer-events:none;
    }
    .pre-hunab{
      width:100%;
      height:100%;
      display:block;
      border-radius:50%;
      object-fit:cover;
      opacity:.92;
      filter: drop-shadow(0 14px 26px rgba(0,0,0,.20));
    }

    .pre-title{
      font-weight:900;
      letter-spacing:12px;
      color:#141414;
      font-size:2.25rem;
      line-height:1.12;
      text-align:center;
      text-shadow:0 2px 10px rgba(0,0,0,.10);
      font-family:'Cinzel', serif;
      white-space:nowrap;
      max-width:92%;
    }
    .pre-subtitle{
      opacity:.72;
      font-weight:900;
      letter-spacing:5px;
      font-size:1.10rem;
      line-height:1.2;
      text-align:center;
      color:#222;
      white-space:nowrap;
      max-width:92%;
    }
    .pre-hint{
      font-weight:900;
      letter-spacing:4px;
      opacity:.86;
      color:#141414;
      font-size:1.05rem;
      line-height:1.2;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      white-space:nowrap;
      max-width:92%;
    }

    .pre-subhint{
      margin-top:10px;
      font-size:.92rem;
      letter-spacing:2px;
      opacity:.50;
      font-weight:800;
      color:#2b2b2b;
      user-select:none;
      white-space:nowrap;
    }

    .cover-etch-below{
      margin-top: 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      pointer-events:none;
    }
    .ritual-etch{
      width:min(260px, 64%);
      height:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border-radius:999px;
      background: radial-gradient(140px 18px at 50% 35%, rgba(255,255,255,.10), transparent 65%);
      filter: drop-shadow(0 14px 22px rgba(0,0,0,.18));
    }
    .ritual-etch::before{
      content:"";
      width:13px;height:13px;border-radius:50%;
      background: var(--theme);
      box-shadow:
        inset 0 -5px 8px rgba(0,0,0,.42),
        0 12px 18px rgba(0,0,0,.18);
      opacity:1;
    }
    .ritual-etch::after{
      content:"";
      width:min(170px, 44vw);
      height:13px;
      border-radius:13px;
      background: var(--theme);
      box-shadow:
        inset 0 -6px 9px rgba(0,0,0,.44),
        0 14px 20px rgba(0,0,0,.18);
      opacity:1;
    }

    /* =========================
       ✅ 手機版歷史記錄石（原檔手機區 + 我追加最終覆蓋）
       ========================= */
    @media (max-width: 520px){
      .home-button{ top:18px; left:16px; width:56px; height:56px; font-size:1.5rem; }

      .history-sidebar{
        left:14px;
        top:110px;
        transform:none;
        gap:8px;
        z-index:220; /* ✅ 必須高於 scrim */
        max-height: 360px;
        pointer-events:auto;
      }

      /* ======= ✅ red-115 手機歷史記錄石（最終規格覆蓋） ======= */
      .history-stone{
        width:56px;           /* 76→56 */
        height:52px;          /* 70→52 */
        font-size:0.95rem;    /* 1.12→0.95 */
      }

      /* 預設收合：只顯示第一顆（其餘完全消失） */
      .history-sidebar:not(.open) .history-stone:not(:first-child){
        display:none !important;
      }

      /* 展開：顯示全部 + 從第一顆下方滑出 */
      .history-sidebar.open .history-stone{
        display:flex !important;
        animation: slideDown 0.3s ease;
      }

      @keyframes slideDown{
        from{ opacity:0; transform: translateY(-10px); }
        to  { opacity:1; transform: translateY(0); }
      }

      /* 解除你舊版 secondary 的收合動畫殘留（避免衝突） */
      .history-sidebar:not(.open) .history-stone.secondary{
        opacity:1 !important;
        transform:none !important;
        pointer-events:auto !important;
        max-height:none !important;
        margin-top:0 !important;
      }
      .history-sidebar.open .history-stone.secondary{
        opacity:1 !important;
        transform:none !important;
        pointer-events:auto !important;
        max-height:none !important;
        margin-top:0 !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- ✅ Portal 掛載點（沿用：點外收合） -->
  <div id="scrim-portal"></div>

  <div class="cover-curtain" id="coverCurtain" aria-hidden="true"></div>

  <div class="reading-overlay" id="readingOverlay" aria-hidden="true">
    <div class="reading-stone">
      <div class="reading-inner">
        <div class="reading-title">靜室閱讀</div>

        <div class="reading-block-title">⚡ 能量感應</div>
        <div class="reading-text" id="readingTextA"></div>

        <div class="reading-block-title">🌱 調頻建議</div>
        <div class="reading-text" id="readingTextB"></div>

        <div class="reading-exit" id="readingExit">◦ 回到石碑 ◦</div>
      </div>
    </div>
  </div>

  <div class="hunab-field" id="hunabField" aria-hidden="true"></div>

  <svg class="hunab-flip-svg" id="hunabFlip" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <filter id="hunabMaskFilter">
        <feColorMatrix type="matrix" values="
          0.2126 0.7152 0.0722 0 0
          0.2126 0.7152 0.0722 0 0
          0.2126 0.7152 0.0722 0 0
          0      0      0      1 0" />
        <feComponentTransfer>
          <feFuncR type="table" tableValues="1 0"/>
          <feFuncG type="table" tableValues="1 0"/>
          <feFuncB type="table" tableValues="1 0"/>
        </feComponentTransfer>
      </filter>
      <mask id="hunabLineMask" maskUnits="objectBoundingBox">
        <image href="../images/hunab-ku.png" x="0" y="0" width="100" height="100"
               preserveAspectRatio="xMidYMid slice"
               filter="url(#hunabMaskFilter)"/>
      </mask>
    </defs>
    <rect class="tint" x="0" y="0" width="100" height="100" mask="url(#hunabLineMask)"></rect>
  </svg>

  <script type="text/babel">
    const {useState,useEffect,useRef,useLayoutEffect} = React;

    const TONE_NAMES=["磁性的","月亮的","電力的","自我存在的","超頻的","韻律的","共鳴的","銀河的","太陽的","行星的","光譜的","水晶的","宇宙的"];
    const GLYPH_NAMES=["紅龍","白風","藍夜","黃種子","紅蛇","白世界橋","藍手","黃星星","紅月","白狗","藍猴","黃人","紅天行者","白巫師","藍鷹","黃戰士","紅地球","白鏡","藍風暴","黃太陽"];

    const WAVESPELL_DATA = [
      { name: "紅龍波", startKin: 1, glyphId: 0 },
      { name: "白巫師波", startKin: 14, glyphId: 13 },
      { name: "藍手波", startKin: 27, glyphId: 6 },
      { name: "黃太陽波", startKin: 40, glyphId: 19 },
      { name: "紅天行者波", startKin: 53, glyphId: 12 },
      { name: "白世界橋波", startKin: 66, glyphId: 5 },
      { name: "藍風暴波", startKin: 79, glyphId: 18 },
      { name: "黃人波", startKin: 92, glyphId: 11 },
      { name: "紅蛇波", startKin: 105, glyphId: 4 },
      { name: "白鏡波", startKin: 118, glyphId: 17 },
      { name: "藍猴波", startKin: 131, glyphId: 10 },
      { name: "黃種子波", startKin: 144, glyphId: 3 },
      { name: "紅地球波", startKin: 157, glyphId: 16 },
      { name: "白狗波", startKin: 170, glyphId: 9 },
      { name: "藍夜波", startKin: 183, glyphId: 2 },
      { name: "黃戰士波", startKin: 196, glyphId: 15 },
      { name: "紅月波", startKin: 209, glyphId: 8 },
      { name: "白風波", startKin: 222, glyphId: 1 },
      { name: "藍鷹波", startKin: 235, glyphId: 14 },
      { name: "黃星星波", startKin: 248, glyphId: 7 }
    ];

    const COLORS=["red","white","blue","yellow"];
    const THEME={
      red:{main:"#A5413F",bg:"#F8E8E8"},
      white:{main:"#666666",bg:"#F2F4F6"},
      blue:{main:"#3D5A73",bg:"#E8F0F8"},
      yellow:{main:"#B39B59",bg:"#F9F8E8"}
    };

    function hexToRgbTuple(hex){
      const h = (hex || "").replace("#","").trim();
      if(h.length !== 6) return "165,65,63";
      const r = parseInt(h.slice(0,2),16);
      const g = parseInt(h.slice(2,4),16);
      const b = parseInt(h.slice(4,6),16);
      if([r,g,b].some(v=>Number.isNaN(v))) return "165,65,63";
      return `${r},${g},${b}`;
    }

    function getTodayKinSmart(){
      try{
        if (typeof window.getTodayKin === "function") return window.getTodayKin();
        if (window.KIN_CALC && typeof window.KIN_CALC.getTodayKin === "function") return window.KIN_CALC.getTodayKin();
        if (window.KIN_CALCULATOR && typeof window.KIN_CALCULATOR.getTodayKin === "function") return window.KIN_CALCULATOR.getTodayKin();
        if (window.kinCalculator && typeof window.kinCalculator.getTodayKin === "function") return window.kinCalculator.getTodayKin();
      }catch(e){}
      const referenceDate = new Date(2026, 0, 14);
      const referenceKin = 36;
      const today = new Date();
      today.setHours(0,0,0,0);
      referenceDate.setHours(0,0,0,0);
      const diffDays = Math.floor((today.getTime() - referenceDate.getTime()) / (1000*60*60*24));
      let k = ((referenceKin - 1 + diffDays) % 260) + 1;
      if (k <= 0) k += 260;
      return k;
    }

    function getWavespell(kin) {
      const wavespellIndex = Math.floor((kin - 1) / 13);
      return WAVESPELL_DATA[wavespellIndex];
    }

    function ToneDisplay({ toneId }) {
      const dots = toneId % 5;
      const bars = Math.floor(toneId / 5);
      return (
        <div className="tone-area">
          <div className="tone-dots">
            {[...Array(dots)].map((_, i) => <div key={i} className="tone-dot"></div>)}
          </div>
          <div className="tone-bars">
            {[...Array(bars)].map((_, i) => <div key={i} className="tone-bar"></div>)}
          </div>
        </div>
      );
    }

    function RedRoom(){
      const [kin,setKin] = useState(1);
      const [history,setHistory] = useState([]);
      const [spinning,setSpinning] = useState(false);
      const [hasDrawn,setHasDrawn] = useState(false);
      const [showMessage,setShowMessage] = useState(false);
      const [isCompact,setIsCompact] = useState(false);
      const [historyOpen,setHistoryOpen] = useState(false);

      const [tightSpin,setTightSpin] = useState(false);
      const [tightMsg,setTightMsg] = useState(false);
      const [ultraMsg,setUltraMsg] = useState(false);
      const [needReading,setNeedReading] = useState(false);

      const [coverAnimating,setCoverAnimating] = useState(false);

      const contentRef = useRef(null);
      const rafRef = useRef(null);
      const timerRef = useRef(null);

      const todayKin = getTodayKinSmart();
      const todayTheme = THEME[COLORS[(todayKin - 1) % 4]];
      const theme = THEME[COLORS[(kin - 1) % 4]];

      const toneId = (kin - 1) % 13 + 1;
      const glyphId = (kin - 1) % 20;
      const wavespell = getWavespell(kin);

      const brain = window.RED_BRAIN_DATA || {};
      const data = brain[String(kin)] || { synchronicMessage: "", alignment: "" };

      const isMobile = ()=> window.innerWidth <= 520;

      useEffect(()=>{
        const activeTheme = hasDrawn ? theme : todayTheme;
        document.documentElement.style.setProperty("--bg", activeTheme.bg);
        document.documentElement.style.setProperty("--theme", activeTheme.main);
        document.documentElement.style.setProperty("--themeRGB", hexToRgbTuple(activeTheme.main));
      },[theme.bg, theme.main, todayTheme.bg, todayTheme.main, hasDrawn]);

      /* ✅ 備援（保留）：點側欄外收合 */
      useEffect(()=>{
        if(!historyOpen) return;

        const closeIfOutside = (e)=>{
          const el = document.querySelector(".history-sidebar");
          if(!el) { setHistoryOpen(false); return; }
          if(el.contains(e.target)) return;
          setHistoryOpen(false);
        };

        document.addEventListener("pointerdown", closeIfOutside, true);
        document.addEventListener("touchstart", closeIfOutside, true);

        return ()=>{
          document.removeEventListener("pointerdown", closeIfOutside, true);
          document.removeEventListener("touchstart", closeIfOutside, true);
        };
      }, [historyOpen]);

      const measureOverflow = ()=>{
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = requestAnimationFrame(()=>{
          const el = contentRef.current;
          if(!el) return;

          const overflowPx = el.scrollHeight - el.clientHeight;

          if(spinning){
            setTightSpin(overflowPx > 10);
            setTightMsg(false);
            setUltraMsg(false);
            setNeedReading(false);
            return;
          }

          if(showMessage){
            const needTight = overflowPx > 10;
            setTightSpin(false);
            setTightMsg(needTight);

            requestAnimationFrame(()=>{
              const el2 = contentRef.current;
              if(!el2) return;
              const overflow2 = el2.scrollHeight - el2.clientHeight;

              const needUltra = overflow2 > 8;
              setUltraMsg(needUltra);

              requestAnimationFrame(()=>{
                const el3 = contentRef.current;
                if(!el3) return;
                const overflow3 = el3.scrollHeight - el3.clientHeight;
                setNeedReading(needUltra && overflow3 > 6);
              });
            });

            return;
          }

          setTightSpin(false);
          setTightMsg(false);
          setUltraMsg(false);
          setNeedReading(false);
        });
      };

      useLayoutEffect(()=>{ measureOverflow(); }, [spinning, showMessage, isCompact, kin]);
      useEffect(()=>{
        const onResize = ()=> measureOverflow();
        window.addEventListener('resize', onResize);
        return ()=> window.removeEventListener('resize', onResize);
      }, [spinning, showMessage, isCompact, tightSpin, tightMsg, ultraMsg]);

      const startSpin = ()=>{
        setHasDrawn(true);
        setSpinning(true);
        setShowMessage(false);
        setIsCompact(false);
        setTightSpin(false);
        setTightMsg(false);
        setUltraMsg(false);
        setNeedReading(false);

        clearInterval(timerRef.current);
        timerRef.current = setInterval(()=>{
          setKin(Math.floor(Math.random()*260) + 1);
        }, 65);
      };

      const stopSpin = ()=>{
        clearInterval(timerRef.current);
        setSpinning(false);
        setShowMessage(false);
        setIsCompact(false);

        setTimeout(() => {
          setIsCompact(true);
          setTimeout(() => {
            setShowMessage(true);
            measureOverflow();
          }, 100);
        }, 1000);

        setHistory(prev => [kin, ...prev].slice(0,5));
      };

      const toggle = ()=>{ if(spinning) stopSpin(); else startSpin(); };

      /* ✅ FIX：手機版第一顆永遠 toggle 收合/展開（避免「不能收合」） */
      const onHistoryStoneClick = (k, i, e)=>{
        if(e) e.stopPropagation();

        if(!isMobile()){
          if(!spinning) setKin(k);
          return;
        }

        // 第一顆：toggle 展開/收合（不選 KIN）
        if(i === 0){
          setHistoryOpen(prev => !prev);
          return;
        }

        // 其他顆：只有展開時可選，選完收合
        if(!historyOpen) return;
        if(!spinning) setKin(k);
        setHistoryOpen(false);
      };

      const openReading = ()=>{
        const overlay = document.getElementById('readingOverlay');
        const a = document.getElementById('readingTextA');
        const b = document.getElementById('readingTextB');
        if(!overlay || !a || !b) return;
        a.textContent = data.synchronicMessage || "";
        b.textContent = data.alignment || "";
        overlay.classList.add('show');
      };
      const closeReading = ()=>{
        const overlay = document.getElementById('readingOverlay');
        if(!overlay) return;
        overlay.classList.remove('show');
      };

      useEffect(()=>{
        const exit = document.getElementById('readingExit');
        const overlay = document.getElementById('readingOverlay');
        if(exit) exit.onclick = closeReading;
        if(overlay){
          overlay.addEventListener('click', (e)=>{
            if(e.target === overlay) closeReading();
          });
        }
      },[]);

      const manualInput = ()=>{
        const num = prompt("召喚指定 KIN (1-260):", kin);
        const n = parseInt(num,10);
        if(!Number.isNaN(n) && n>=1 && n<=260){
          setHasDrawn(true);
          setKin(n);
          setShowMessage(false);
          setIsCompact(false);
          setTimeout(() => {
            setIsCompact(true);
            setTimeout(() => {
              setShowMessage(true);
              measureOverflow();
            }, 100);
          }, 1000);
        }
      };

      const handleCoverClick = ()=>{
        // （原檔封面轉場邏輯保留）
        startSpin();
      };

      const closeHistoryHard = (e)=>{
        try{ e.preventDefault(); }catch(_){}
        try{ e.stopPropagation(); }catch(_){}
        setHistoryOpen(false);
      };

      const contentClass = [
        "content",
        isCompact ? "compact" : "",
        tightSpin ? "tight-spin" : "",
        tightMsg ? "tight-msg" : "",
        ultraMsg ? "ultra-msg" : ""
      ].filter(Boolean).join(" ");

      return (
        <>
          {hasDrawn && (<a href="../index.html" className="home-button" title="返回主頁">🏠</a>)}

          {/* ✅ scrim：點外收合（且 z-index 已調低，不會蓋住石頭） */}
          {ReactDOM.createPortal(
            <div
              className={`portal-scrim ${(isMobile() && historyOpen) ? 'show' : ''}`}
              onPointerDownCapture={closeHistoryHard}
              onTouchStartCapture={closeHistoryHard}
              onMouseDownCapture={closeHistoryHard}
              aria-hidden="true"
            />,
            document.getElementById('scrim-portal')
          )}

          <div className={`history-sidebar ${historyOpen ? 'open' : ''}`}>
            {history.map((k,i)=>(
              <div
                key={i}
                className={`history-stone ${i===0 ? 'primary' : 'secondary'}`}
                onClick={(e)=>onHistoryStoneClick(k,i,e)}
              >
                {k}
              </div>
            ))}
          </div>

          <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div className="tablet">
              <div ref={contentRef} className={contentClass}>
                {!hasDrawn ? (
                  <>
                    <div className="pre-card" onClick={handleCoverClick}>
                      <div className="cover-bay">
                        <div className="bay-orn-top">
                          <div className="pre-ornament">
                            <div className="pre-ornament-line"></div>
                            <div className="pre-ornament-dot"></div>
                            <div className="pre-ornament-line"></div>
                          </div>
                        </div>

                        <div className="bay-center">
                          <div className="pre-symbol">
                            <div className="pre-glow"></div>
                            <img className="pre-hunab" src="../images/hunab-ku.png" alt="Hunab Ku" />
                          </div>

                          <div className="pre-title">東方・火種</div>
                          <div className="pre-subtitle">誕生行動的第一道火光</div>
                          <div className="pre-hint">跟著直覺，鎖定印記</div>
                        </div>

                        <div className="bay-orn-bottom">
                          <div className="pre-ornament">
                            <div className="pre-ornament-dot"></div>
                            <div className="pre-ornament-line short"></div>
                            <div className="pre-ornament-dot"></div>
                          </div>
                          <div className="pre-subhint">點擊開始對頻</div>
                        </div>
                      </div>
                    </div>

                    <div className="cover-etch-below" aria-hidden="true">
                      <div className="ritual-etch"></div>
                    </div>
                  </>
                ) : (
                  <>
                    <ToneDisplay toneId={toneId} />

                    <div className="glyph-area">
                      <div className="glyph-frame" onClick={toggle} title="點圖騰：開始/停止對頻">
                        <img className="glyph-img" src={`../images/${String(glyphId + 1).padStart(2,'0')}.png`} alt="" />
                      </div>
                    </div>

                    <div className="kin-id" onClick={manualInput}>KIN {kin}</div>
                    <div className="kin-name">{TONE_NAMES[toneId-1]}{GLYPH_NAMES[glyphId]}</div>

                    <div className="wavespell-badge">
                      <img className="wavespell-icon" src={`../images/${String(wavespell.glyphId + 1).padStart(2,'0')}.png`} alt={wavespell.name} />
                      {wavespell.name}
                    </div>

                    <div className="name-etch"></div>

                    <div className="rest-slot">
                      {spinning ? (
                        <div className="spinning-placeholder">對頻中…（停止後顯示完整訊息）</div>
                      ) : showMessage && (
                        <>
                          <div className="msg-stack">
                            <div className="msg-box">
                              <span className="label">⚡ 能量感應</span>
                              <div className="content-text">{data.synchronicMessage}</div>
                            </div>

                            <div className="msg-box">
                              <span className="label">🌱 調頻建議</span>
                              <div className="content-text">{data.alignment}</div>
                            </div>
                          </div>

                          {needReading && (
                            <div className="reading-entry" onClick={openReading}>
                              ◦ 進入靜室閱讀 ◦
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<RedRoom/>);
  </script>
</body>
</html>
