<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西方 · 轉煉 v9</title>
  <style>
    :root { --bg: #0a0a0f; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
    }
    .frame {
      width: 100%;
      border: 0;
      display: none;
      overflow-x: hidden;
      transition: opacity 0.8s ease;
      opacity: 0;
    }
    .frame.active {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe id="coverFrame" class="frame active" src="./blue-v9-cover.html" title="Cover"></iframe>
  <iframe id="innerFrame" class="frame" src="./blue-v9-inner.html" title="Inner"></iframe>

  <script>
    const coverFrame = document.getElementById('coverFrame');
    const innerFrame = document.getElementById('innerFrame');

    function show(which) {
      if (which === 'inner') {
        coverFrame.classList.remove('active');
        innerFrame.classList.add('active');
      } else {
        innerFrame.classList.remove('active');
        coverFrame.classList.add('active');
      }
    }

    window.addEventListener('message', (e) => {
      const data = e.data || {};

      if (data.type === 'HEIGHT') {
        const h = Math.max(window.innerHeight, Number(data.height) || 0);
        if (data.id === 'cover') coverFrame.style.height = h + 'px';
        if (data.id === 'inner') innerFrame.style.height = h + 'px';
      }

      if (data.type === 'NAV') {
        show(data.to);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
