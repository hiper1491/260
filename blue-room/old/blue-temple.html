<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>藍色神廟 · 時間之流的三相顯化</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Noto Serif TC', serif;
      background: linear-gradient(180deg, #0A1628 0%, #16213E 50%, #1A2845 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    /* 星空背景效果 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(2px 2px at 60% 70%, rgba(184, 197, 214, 0.3), transparent),
        radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, 0.2), transparent),
        radial-gradient(1px 1px at 80% 10%, rgba(184, 197, 214, 0.25), transparent),
        radial-gradient(2px 2px at 90% 60%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 33% 85%, rgba(184, 197, 214, 0.2), transparent),
        radial-gradient(1px 1px at 75% 40%, rgba(255, 255, 255, 0.15), transparent);
      background-size: 200% 200%;
      background-position: 0% 0%;
      animation: stars 120s linear infinite;
      pointer-events: none;
      opacity: 0.6;
    }
    
    @keyframes stars {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }
    
    /* 狀態容器 */
    .state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    
    .state.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    /* ===== 呼吸儀式頁 ===== */
    #state-breath {
      gap: 60px;
    }
    
    .breath-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 藍色光點 */
    .blue-orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%,
        rgba(74, 144, 226, 0.9) 0%,
        rgba(74, 144, 226, 0.6) 30%,
        rgba(22, 33, 62, 0.8) 70%,
        transparent 100%);
      box-shadow: 
        0 0 60px rgba(74, 144, 226, 0.4),
        inset 0 0 30px rgba(184, 197, 214, 0.3);
      animation: breathePulse 12s ease-in-out infinite;
    }
    
    @keyframes breathePulse {
      0%, 100% {
        transform: scale(0.85);
        box-shadow: 
          0 0 40px rgba(74, 144, 226, 0.3),
          inset 0 0 20px rgba(184, 197, 214, 0.2);
      }
      50% {
        transform: scale(1.15);
        box-shadow: 
          0 0 80px rgba(74, 144, 226, 0.6),
          inset 0 0 40px rgba(184, 197, 214, 0.4);
      }
    }
    
    /* 呼吸引導文字 */
    .breath-text {
      font-size: 18px;
      letter-spacing: 8px;
      color: rgba(184, 197, 214, 0.85);
      text-shadow: 0 0 20px rgba(74, 144, 226, 0.4);
      opacity: 0;
      animation: breatheText 12s ease-in-out infinite;
    }
    
    @keyframes breatheText {
      0%, 48%, 52%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    
    /* 跳過按鈕 */
    .skip-btn {
      position: fixed;
      bottom: 60px;
      font-size: 13px;
      letter-spacing: 3px;
      color: rgba(184, 197, 214, 0.5);
      background: none;
      border: 1px solid rgba(184, 197, 214, 0.2);
      padding: 10px 24px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .skip-btn:hover {
      color: rgba(232, 239, 247, 0.9);
      border-color: rgba(184, 197, 214, 0.5);
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.3);
    }
    
    /* ===== 三卡抽牌頁 ===== */
    #state-cards {
      gap: 40px;
    }
    
    .cards-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 6px;
      color: rgba(232, 239, 247, 0.9);
      text-shadow: 0 0 30px rgba(74, 144, 226, 0.5);
      margin-bottom: 20px;
    }
    
    .cards-container {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }
    
    /* 單張卡片 */
    .card {
      position: relative;
      width: 280px;
      height: 400px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .card:hover:not(.flipped) {
      transform: translateY(-10px) scale(1.02);
    }
    
    /* 中央卡片較大 */
    .card.center {
      width: 320px;
      height: 460px;
    }
    
    /* 卡片翻轉容器 */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }
    
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    
    /* 卡片正反面 */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    /* 背面 - Hunab Ku */
    .card-back {
      background: linear-gradient(135deg, 
        rgba(22, 33, 62, 0.95) 0%, 
        rgba(26, 40, 69, 0.98) 100%);
      border: 2px solid rgba(184, 197, 214, 0.3);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 0 40px rgba(74, 144, 226, 0.1);
    }
    
    .hunab-ku {
      width: 180px;
      height: 180px;
      opacity: 0.7;
      animation: slowRotate 30s linear infinite;
      filter: drop-shadow(0 0 20px rgba(74, 144, 226, 0.3));
    }
    
    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* 正面 - KIN 資訊 */
    .card-front {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid var(--card-color, rgba(184, 197, 214, 0.4));
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.5),
        0 0 40px var(--card-glow, rgba(184, 197, 214, 0.2));
      backdrop-filter: blur(20px);
      transform: rotateY(180deg);
      padding: 30px;
      gap: 20px;
    }
    
    /* KIN 編號 */
    .kin-number {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(232, 239, 247, 0.6);
    }
    
    /* 圖騰圖示 */
    .seal-icon {
      width: 120px;
      height: 120px;
      filter: drop-shadow(0 0 20px var(--card-glow, rgba(184, 197, 214, 0.3)));
    }
    
    .card.center .seal-icon {
      width: 140px;
      height: 140px;
    }
    
    /* 印記名稱 */
    .kin-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(232, 239, 247, 0.95);
      text-shadow: 0 0 20px var(--card-glow, rgba(184, 197, 214, 0.4));
    }
    
    /* 調性名稱 */
    .tone-name {
      font-size: 16px;
      letter-spacing: 4px;
      color: rgba(184, 197, 214, 0.8);
    }
    
    /* 位置標籤 */
    .position-label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 4px;
      color: rgba(184, 197, 214, 0.6);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .card:not(.flipped):hover .position-label {
      opacity: 1;
    }
    
    /* 脈動提示 (未翻開的卡片) */
    .card:not(.flipped) .card-back {
      animation: cardPulse 2s ease-in-out infinite;
    }
    
    @keyframes cardPulse {
      0%, 100% {
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 0 40px rgba(74, 144, 226, 0.1);
      }
      50% {
        box-shadow: 
          0 8px 40px rgba(74, 144, 226, 0.3),
          inset 0 0 50px rgba(74, 144, 226, 0.2);
      }
    }
    
    /* ===== 波符顯示 (極簡橫條) ===== */
    .wavespell-display {
      margin-top: 40px;
      padding: 30px;
      background: rgba(22, 33, 62, 0.5);
      border-radius: 20px;
      border: 1px solid rgba(184, 197, 214, 0.2);
      backdrop-filter: blur(10px);
      min-width: 600px;
    }
    
    .wavespell-title {
      font-size: 16px;
      letter-spacing: 3px;
      color: rgba(184, 197, 214, 0.7);
      margin-bottom: 20px;
      text-align: center;
    }
    
    .wavespell-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    
    .wavespell-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(184, 197, 214, 0.15);
      border: 2px solid rgba(184, 197, 214, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(184, 197, 214, 0.5);
      transition: all 0.3s ease;
    }
    
    /* 當前位置 */
    .wavespell-dot.current {
      background: radial-gradient(circle, 
        rgba(74, 144, 226, 0.4) 0%, 
        rgba(74, 144, 226, 0.2) 100%);
      border-color: rgba(74, 144, 226, 0.8);
      color: rgba(232, 239, 247, 0.9);
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
      transform: scale(1.3);
    }
    
    /* 中心位置 (7) */
    .wavespell-dot.center {
      border-color: rgba(184, 197, 214, 0.5);
      background: rgba(184, 197, 214, 0.2);
    }
    
    .wavespell-position-hint {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      letter-spacing: 2px;
      color: rgba(184, 197, 214, 0.6);
    }
    
    /* ===== 響應式設計 ===== */
    @media (max-width: 768px) {
      .cards-container {
        flex-direction: column;
        gap: 30px;
      }
      
      .card, .card.center {
        width: 260px;
        height: 380px;
      }
      
      .wavespell-display {
        min-width: auto;
        width: 90%;
        padding: 20px;
      }
      
      .wavespell-track {
        gap: 4px;
      }
      
      .wavespell-dot {
        width: 24px;
        height: 24px;
        font-size: 10px;
      }
      
      .wavespell-dot.current {
        transform: scale(1.2);
      }
    }
  </style>
</head>
<body>
  <!-- 呼吸儀式頁 -->
  <div id="state-breath" class="state active">
    <div class="breath-container">
      <div class="blue-orb"></div>
    </div>
    <div class="breath-text">吸氣,連結源頭 · 吐氣,流向當下</div>
    <button class="skip-btn" onclick="skipBreath()">跳過呼吸</button>
  </div>
  
  <!-- 三卡抽牌頁 -->
  <div id="state-cards" class="state">
    <div class="cards-title">時間之流的三相</div>
    
    <div class="cards-container">
      <!-- 過去 -->
      <div class="card" data-position="past" onclick="flipCard(this)">
        <div class="position-label">過去</div>
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="./260/images/hunab-ku-1.png" alt="Hunab Ku" class="hunab-ku">
          </div>
          <div class="card-face card-front">
            <div class="kin-number">KIN 1</div>
            <img src="./260/images/01.png" alt="紅龍" class="seal-icon">
            <div class="kin-name">紅龍</div>
            <div class="tone-name">磁性</div>
          </div>
        </div>
      </div>
      
      <!-- 現在 -->
      <div class="card center" data-position="present" onclick="flipCard(this)">
        <div class="position-label">現在</div>
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="./260/images/hunab-ku-1.png" alt="Hunab Ku" class="hunab-ku">
          </div>
          <div class="card-face card-front">
            <div class="kin-number">KIN 74</div>
            <img src="./260/images/14.png" alt="白巫師" class="seal-icon">
            <div class="kin-name">白巫師</div>
            <div class="tone-name">太陽</div>
          </div>
        </div>
      </div>
      
      <!-- 未來 -->
      <div class="card" data-position="future" onclick="flipCard(this)">
        <div class="position-label">未來</div>
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="./260/images/hunab-ku-1.png" alt="Hunab Ku" class="hunab-ku">
          </div>
          <div class="card-face card-front">
            <div class="kin-number">KIN 133</div>
            <img src="./260/images/13.png" alt="紅天行者" class="seal-icon">
            <div class="kin-name">紅天行者</div>
            <div class="tone-name">共鳴</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 波符顯示 -->
    <div class="wavespell-display" style="display: none;" id="wavespell">
      <div class="wavespell-title">黃種子波符 (KIN 65-77)</div>
      <div class="wavespell-track">
        <div class="wavespell-dot">1</div>
        <div class="wavespell-dot">2</div>
        <div class="wavespell-dot">3</div>
        <div class="wavespell-dot">4</div>
        <div class="wavespell-dot">5</div>
        <div class="wavespell-dot">6</div>
        <div class="wavespell-dot center">7</div>
        <div class="wavespell-dot">8</div>
        <div class="wavespell-dot current">9</div>
        <div class="wavespell-dot">10</div>
        <div class="wavespell-dot">11</div>
        <div class="wavespell-dot">12</div>
        <div class="wavespell-dot">13</div>
      </div>
      <div class="wavespell-position-hint">你在第 9 天 - 太陽調性 (完成·脈動)</div>
    </div>
  </div>
  
  <script>
    // 呼吸計時器
    let breathTimer;
    
    function startBreath() {
      breathTimer = setTimeout(() => {
        switchState('state-breath', 'state-cards');
      }, 12000); // 12秒後自動進入
    }
    
    function skipBreath() {
      clearTimeout(breathTimer);
      switchState('state-breath', 'state-cards');
    }
    
    function switchState(fromId, toId) {
      document.getElementById(fromId).classList.remove('active');
      setTimeout(() => {
        document.getElementById(toId).classList.add('active');
      }, 300);
    }
    
    // 翻牌功能
    let flippedCount = 0;
    const flipOrder = [];
    
    function flipCard(cardElement) {
      if (cardElement.classList.contains('flipped')) return;
      
      cardElement.classList.add('flipped');
      flippedCount++;
      
      const position = cardElement.dataset.position;
      flipOrder.push(position);
      
      // 根據印記顏色設定發光效果
      const colors = {
        'past': { color: 'rgba(229, 62, 62, 0.6)', glow: 'rgba(229, 62, 62, 0.3)' },
        'present': { color: 'rgba(237, 242, 247, 0.8)', glow: 'rgba(237, 242, 247, 0.4)' },
        'future': { color: 'rgba(229, 62, 62, 0.6)', glow: 'rgba(229, 62, 62, 0.3)' }
      };
      
      const colorData = colors[position];
      cardElement.style.setProperty('--card-color', colorData.color);
      cardElement.style.setProperty('--card-glow', colorData.glow);
      
      // 全部翻開後顯示波符
      if (flippedCount === 3) {
        setTimeout(() => {
          document.getElementById('wavespell').style.display = 'block';
          checkFlipOrder();
        }, 800);
      }
    }
    
    // 檢查翻牌順序並給予回饋
    function checkFlipOrder() {
      const orderString = flipOrder.join('-');
      let message = '';
      
      if (orderString === 'past-present-future') {
        message = '你正順著時間之流前行';
      } else if (orderString === 'future-present-past') {
        message = '你正從願景回溯源頭,這是創化的逆向工程';
      } else if (orderString === 'present-past-future' || orderString === 'present-future-past') {
        message = '你以當下為錨點,連結過去與未來';
      } else {
        message = '你的靈魂不受線性時間束縛';
      }
      
      console.log('翻牌順序:', flipOrder);
      console.log('訊息:', message);
      // 未來可以在這裡顯示合盤金句
    }
    
    // 啟動呼吸計時
    startBreath();
  </script>
</body>
</html>
