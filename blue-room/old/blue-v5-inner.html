<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西方 · 轉煉</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Cormorant+Garamond:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --abyss-black: #0a0a0f;
      --deep-blue: #0d1633;
      --obsidian: #1a1520;
      --lava-orange: #ff6b35;
      --forge-red: #d64933;
      --metal-glow: #ffaa66;
      --stone-blue: #2d3e5f;
      --ash-gray: #4a4a52;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      color: #e8f4ff;
      background: 
        radial-gradient(1000px 700px at 50% 0%, rgba(255, 107, 53, 0.1), transparent 70%),
        linear-gradient(135deg, var(--abyss-black) 0%, var(--obsidian) 50%, var(--deep-blue) 100%);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(45, 62, 95, 0.08) 0%, transparent 50%);
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1300px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    /* 音效開關 */
    .audio-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .audio-toggle:hover {
      background: rgba(255, 107, 53, 0.1);
      border-color: var(--lava-orange);
    }

    .audio-toggle.active {
      background: rgba(255, 107, 53, 0.2);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
    }

    /* 標題 */
    .mast {
      text-align: center;
      margin-bottom: 60px;
    }

    .mast h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: var(--metal-glow);
      letter-spacing: 0.22em;
      font-weight: 900;
      margin-bottom: 16px;
      text-shadow: 0 0 40px rgba(255, 170, 102, 0.5);
    }

    .mast .sub {
      color: rgba(232, 244, 255, 0.65);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.9;
      font-weight: 500;
    }

    /* 三位網格 */
    .three {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(20px, 3vw, 40px);
      margin-bottom: 60px;
    }

    @media (max-width: 900px) {
      .three { grid-template-columns: 1fr; gap: 40px; }
    }

    /* 位置槽 */
    .slot {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(45, 62, 95, 0.3);
      border-radius: 20px;
      padding: clamp(25px, 4vw, 40px) clamp(18px, 3vw, 28px);
      text-align: center;
      transition: all 0.4s;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      min-height: 680px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 107, 53, 0.05);
    }

    .slot:hover {
      border-color: rgba(255, 107, 53, 0.4);
      box-shadow: 
        0 25px 70px rgba(255, 107, 53, 0.15),
        inset 0 1px 0 rgba(255, 107, 53, 0.1);
    }

    /* 標籤 - 永遠保留 */
    .label {
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      color: var(--lava-orange);
      font-weight: 900;
      letter-spacing: 0.18em;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
    }

    .subline {
      font-size: clamp(0.85rem, 1.6vw, 0.95rem);
      color: rgba(232, 244, 255, 0.6);
      margin-bottom: 30px;
      min-height: 2.8em;
      line-height: 1.6;
    }

    /* 門容器 */
    .gateWrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: all 0.6s ease;
      max-height: 280px;
      opacity: 1;
      overflow: hidden;
      padding: 20px 0;
    }

    .slot.revealed .gateWrap {
      max-height: 0;
      opacity: 0;
      padding: 0;
      margin-bottom: 0;
    }

    /* 煉金爐核心 */
    .forge {
      width: 180px;
      height: 180px;
      position: relative;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .forge:hover {
      transform: scale(1.05);
    }

    /* 火焰前景 */
    .forge-flame {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255, 170, 102, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(255, 107, 53, 0.25) 0%, transparent 60%);
      animation: flameRotate 8s linear infinite;
      filter: blur(6px);
    }

    @keyframes flameRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 熱浪層 */
    .forge-heat {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, transparent 70%);
      animation: heatPulse 3s ease-in-out infinite;
      filter: blur(10px);
    }

    @keyframes heatPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }

    /* Hunab Ku 深處 */
    .forge-hunab {
      position: absolute;
      inset: 15%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(13, 22, 51, 0.7) 0%, transparent 100%);
      animation: deepPulse 6s ease-in-out infinite;
    }

    @keyframes deepPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.04); opacity: 0.8; }
    }

    .forge-hunab img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      opacity: 0.35;
      filter: brightness(0.8) drop-shadow(0 0 15px rgba(255, 107, 53, 0.3));
      animation: slowRotate 45s linear infinite;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 底座 */
    .forge-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(45, 62, 95, 0.3);
      box-shadow: 
        0 0 50px rgba(255, 107, 53, 0.15),
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 2px 8px rgba(255, 170, 102, 0.08);
    }

    /* 鍛造動畫 */
    .slot.forging .forge-flame {
      animation: forgeBurst 0.3s ease !important;
    }

    @keyframes forgeBurst {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.3) rotate(20deg); opacity: 0.3; }
    }

    .slot.forging .forge-heat {
      animation: heatSurge 0.5s ease !important;
    }

    @keyframes heatSurge {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.4); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* 煉化動畫 */
    .slot.smelting .forge {
      animation: smelting 1.5s ease;
    }

    @keyframes smelting {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); filter: brightness(1.5); }
    }

    /* 輪動文字 */
    .spinLine {
      min-height: 26px;
      font-size: clamp(0.88rem, 1.8vw, 1rem);
      color: var(--metal-glow);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      letter-spacing: 0.08em;
    }

    .slot.smelting .spinLine {
      opacity: 1;
      animation: shimmer 0.8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { color: rgba(255, 170, 102, 0.6); }
      50% { color: var(--metal-glow); text-shadow: 0 0 10px var(--metal-glow); }
    }

    /* 卡片區域 */
    .face {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s ease;
    }

    .slot.revealing .face {
      opacity: 1;
      transform: translateY(0);
    }

    /* 核心卡片 */
    .core-card {
      width: 100%;
      max-width: 420px;
      background: rgba(248, 247, 242, 0.97);
      border-radius: 16px;
      color: #1a1a1a;
      padding: clamp(20px, 3.5vw, 30px) clamp(18px, 3vw, 26px);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 107, 53, 0.2) inset;
      animation: cardRise 1s ease forwards;
    }

    @keyframes cardRise {
      from { 
        opacity: 0; 
        transform: scale(0.85) translateY(30px) rotateX(15deg);
        filter: brightness(1.3);
      }
      to { 
        opacity: 1; 
        transform: scale(1) translateY(0) rotateX(0deg);
        filter: brightness(1);
      }
    }

    /* 調性視覺 */
    .tone-area-mini {
      height: 80px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tone-area-mini.no-dots .tone-dots { display: none; }

    .tone-dots {
      height: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tone-bars {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tone-dot {
      width: 22px;
      height: 22px;
      background: #000;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .tone-bar {
      width: clamp(160px, 18vw, 200px);
      height: 16px;
      background: #000;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .glyph-img {
      width: clamp(110px, 18vw, 150px);
      height: clamp(110px, 18vw, 150px);
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.25));
      margin: 8px 0;
    }

    .kin-id {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 3.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      border-bottom: 1px solid #ddd;
      width: 80%;
      margin: 0 auto 10px;
      padding-bottom: 6px;
    }

    .kin-name {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 900;
      color: #333;
      letter-spacing: 0.1em;
    }

    .wave-pill {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.05);
      font-size: clamp(0.8rem, 1.7vw, 0.9rem);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .wave-pill .mini-glyph {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.2));
    }

    /* 合盤區 */
    .synthesis-zone {
      margin-top: 60px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .synthesis-zone.active {
      opacity: 1;
      pointer-events: all;
    }

    /* 四卡展示 */
    .four-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(15px, 2.5vw, 30px);
      margin-bottom: 50px;
    }

    @media (max-width: 900px) {
      .four-cards {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
      }
      
      .fusion-card-wrap {
        grid-row: 1;
        margin-bottom: 30px;
      }
    }

    .mini-slot {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(45, 62, 95, 0.25);
      border-radius: 16px;
      padding: clamp(18px, 3vw, 25px) clamp(15px, 2.5vw, 20px);
      text-align: center;
      transition: all 0.3s;
    }

    .mini-label {
      font-size: clamp(0.9rem, 1.8vw, 1.1rem);
      color: var(--metal-glow);
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 15px;
      opacity: 0.7;
    }

    /* 融合卡特殊樣式 */
    .fusion-card-wrap {
      position: relative;
    }

    .fusion-card {
      transform: scale(1.2);
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 107, 53, 0.5);
      box-shadow: 
        0 25px 80px rgba(255, 107, 53, 0.4),
        0 0 60px rgba(255, 170, 102, 0.3),
        inset 0 2px 15px rgba(255, 107, 53, 0.1);
      animation: fusionGlow 3s ease-in-out infinite;
    }

    @keyframes fusionGlow {
      0%, 100% { 
        box-shadow: 
          0 25px 80px rgba(255, 107, 53, 0.4),
          0 0 60px rgba(255, 170, 102, 0.3),
          inset 0 2px 15px rgba(255, 107, 53, 0.1);
      }
      50% { 
        box-shadow: 
          0 30px 100px rgba(255, 107, 53, 0.6),
          0 0 80px rgba(255, 170, 102, 0.5),
          inset 0 2px 20px rgba(255, 107, 53, 0.15);
      }
    }

    .fusion-card .mini-label {
      color: var(--lava-orange);
      opacity: 1;
      font-size: clamp(1rem, 2vw, 1.25rem);
    }

    .fusion-card .core-card {
      position: relative;
    }

    .fusion-card .core-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, 
        rgba(255, 107, 53, 0.1) 0%, 
        rgba(255, 170, 102, 0.05) 50%, 
        rgba(255, 107, 53, 0.1) 100%);
      border-radius: 16px;
      z-index: -1;
      filter: blur(8px);
    }

    /* 合盤金句 */
    .synthesis-sentence {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(25px, 4vw, 40px) clamp(22px, 3.5vw, 35px);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 107, 53, 0.1);
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease;
    }

    .synthesis-sentence.active {
      opacity: 1;
      transform: translateY(0);
    }

    .synthesis-text {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 2.2;
      color: #e8f4ff;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .synthesis-highlight {
      color: var(--metal-glow);
      font-weight: 900;
      text-shadow: 0 0 20px rgba(255, 170, 102, 0.4);
    }

    .soul-mark {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 107, 53, 0.2);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: rgba(232, 244, 255, 0.7);
      font-style: italic;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="nebula"></div>
  
  <!-- 音效開關 -->
  <div class="audio-toggle" id="audioToggle" onclick="toggleAudio()" title="背景音效">
    <span id="audioIcon">🔇</span>
  </div>

  <div class="wrap">
    <div class="mast">
      <h1>三位一體</h1>
      <div class="sub">三種同時存在的意識流，在此交會、轉煉</div>
    </div>

    <!-- 三個煉金爐 -->
    <div class="three" id="threeGates">
      <div class="slot" id="slot-karma">
        <div class="label">業力種子</div>
        <div class="subline">已內化、仍在推動你的一股力</div>
        <div class="gateWrap">
          <div class="forge" onclick="handleForge(this, 'karma')">
            <div class="forge-base"></div>
            <div class="forge-flame"></div>
            <div class="forge-heat"></div>
            <div class="forge-hunab">
              <img src="../images/hunab-ku-1.png" alt="Hunab Ku">
            </div>
          </div>
          <div class="spinLine"></div>
        </div>
        <div class="face"></div>
      </div>

      <div class="slot" id="slot-furnace">
        <div class="label">煉金之爐</div>
        <div class="subline">你正在燃燒、正在鬆動的核心</div>
        <div class="gateWrap">
          <div class="forge" onclick="handleForge(this, 'furnace')">
            <div class="forge-base"></div>
            <div class="forge-flame"></div>
            <div class="forge-heat"></div>
            <div class="forge-hunab">
              <img src="../images/hunab-ku-1.png" alt="Hunab Ku">
            </div>
          </div>
          <div class="spinLine"></div>
        </div>
        <div class="face"></div>
      </div>

      <div class="slot" id="slot-rebirth">
        <div class="label">蛻變之門</div>
        <div class="subline">尚未成形、卻已拉住你的門檻</div>
        <div class="gateWrap">
          <div class="forge" onclick="handleForge(this, 'rebirth')">
            <div class="forge-base"></div>
            <div class="forge-flame"></div>
            <div class="forge-heat"></div>
            <div class="forge-hunab">
              <img src="../images/hunab-ku-1.png" alt="Hunab Ku">
            </div>
          </div>
          <div class="spinLine"></div>
        </div>
        <div class="face"></div>
      </div>
    </div>

    <!-- 合盤區（四卡 + 金句） -->
    <div class="synthesis-zone" id="synthesisZone">
      <div class="four-cards" id="fourCards"></div>
      <div class="synthesis-sentence" id="synthesisSentence">
        <div class="synthesis-text" id="synthesisText"></div>
        <div class="soul-mark">這是你此刻的靈魂印記</div>
      </div>
    </div>
  </div>

  <script src="../core/temple-core.js"></script>
  <script src="../core/temple_brain_final.js"></script>
  <script src="../core/kin-card-core.js"></script>

  <script>
    // 音效系統
    let audioContext = null;
    let oscillator = null;
    let gainNode = null;
    let audioEnabled = false;

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioContext.createOscillator();
        gainNode = audioContext.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.value = 50; // 50Hz 低頻
        gainNode.gain.value = 0.05; // 5% 音量
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
      }
    }

    function toggleAudio() {
      const toggle = document.getElementById('audioToggle');
      const icon = document.getElementById('audioIcon');
      
      audioEnabled = !audioEnabled;
      
      if (audioEnabled) {
        initAudio();
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
        toggle.classList.add('active');
        icon.textContent = '🔊';
      } else {
        if (audioContext && audioContext.state === 'running') {
          audioContext.suspend();
        }
        toggle.classList.remove('active');
        icon.textContent = '🔇';
      }
    }

    // JSON 資料
    let KIN_DATA = null;
    fetch('./kin-synthesis-data.json')
      .then(res => res.json())
      .then(data => {
        KIN_DATA = data;
        console.log('✅ JSON 載入成功');
      })
      .catch(err => console.error('❌ JSON 載入失敗:', err));

    // 後備大腦
    function fallbackBrain() {
      const SEALS = [
        { id: 1, name: "紅龍" }, { id: 2, name: "白風" }, { id: 3, name: "藍夜" },
        { id: 4, name: "黃種子" }, { id: 5, name: "紅蛇" }, { id: 6, name: "白世界橋" },
        { id: 7, name: "藍手" }, { id: 8, name: "黃星星" }, { id: 9, name: "紅月" },
        { id: 10, name: "白狗" }, { id: 11, name: "藍猴" }, { id: 12, name: "黃人" },
        { id: 13, name: "紅天行者" }, { id: 14, name: "白巫師" }, { id: 15, name: "藍鷹" },
        { id: 16, name: "黃戰士" }, { id: 17, name: "紅地球" }, { id: 18, name: "白鏡" },
        { id: 19, name: "藍風暴" }, { id: 20, name: "黃太陽" }
      ];
      const TONES = ["磁性", "月亮", "電力", "自我存在", "超頻", "韻律", "共振", "銀河", "太陽", "行星", "光譜", "水晶", "宇宙"];
      
      return {
        drawRandomKIN: () => Math.floor(Math.random() * 260) + 1,
        getTone: (k) => ({ id: ((k - 1) % 13) + 1, name: TONES[(k - 1) % 13] }),
        getSeal: (k) => SEALS[(k - 1) % 20],
        getFullName: (k) => `${TONES[(k - 1) % 13]}的${SEALS[(k - 1) % 20].name}`,
        getWavespell: (k) => {
          const start = Math.floor((k - 1) / 13) * 13 + 1;
          return { start, end: start + 12, seal: SEALS[(start - 1) % 20].name };
        }
      };
    }

    const BRAIN = (window.TEMPLE_BRAIN && typeof window.TEMPLE_BRAIN.getSeal === "function")
      ? window.TEMPLE_BRAIN : fallbackBrain();

    const toneIdOfKin = (kin) => ((kin - 1) % 13) + 1;
    const sealIdOfKin = (kin) => ((kin - 1) % 20) + 1;

    function renderToneMarksInto(container, toneId) {
      const bars = Math.floor(toneId / 5);
      const dots = toneId % 5;
      container.classList.toggle("no-dots", dots === 0);
      
      const dotsRow = container.querySelector(".tone-dots");
      const barsCol = container.querySelector(".tone-bars");
      if (!dotsRow || !barsCol) return;
      
      dotsRow.innerHTML = "";
      barsCol.innerHTML = "";
      
      for (let i = 0; i < dots; i++) {
        const d = document.createElement("div");
        d.className = "tone-dot";
        dotsRow.appendChild(d);
      }
      for (let i = 0; i < bars; i++) {
        const b = document.createElement("div");
        b.className = "tone-bar";
        barsCol.appendChild(b);
      }
    }

    function skeletonHTML() {
      return `
        <div class="core-card">
          <div class="tone-area-mini">
            <div class="tone-dots"></div>
            <div class="tone-bars"></div>
          </div>
          <img class="glyph-img" alt="">
          <div class="kin-id">KIN —</div>
          <div class="kin-name">　</div>
          <div class="wave-pill"></div>
        </div>
      `;
    }

    function fillFace(faceEl, kin) {
      const toneId = toneIdOfKin(kin);
      const sealId = sealIdOfKin(kin);
      const fullName = BRAIN.getFullName(kin);
      const wave = BRAIN.getWavespell(kin);
      const imgSrc = `../images/${String(sealId).padStart(2, '0')}.png`;

      const toneArea = faceEl.querySelector(".tone-area-mini");
      if (toneArea) renderToneMarksInto(toneArea, toneId);

      const glyph = faceEl.querySelector(".glyph-img");
      if (glyph) {
        glyph.src = imgSrc;
        glyph.alt = fullName;
      }

      const kinIdEl = faceEl.querySelector(".kin-id");
      const kinNameEl = faceEl.querySelector(".kin-name");
      if (kinIdEl) kinIdEl.textContent = `KIN ${kin}`;
      if (kinNameEl) kinNameEl.textContent = fullName;

      const pill = faceEl.querySelector(".wave-pill");
      if (pill) {
        pill.innerHTML = `
          <img class="mini-glyph" src="${imgSrc}" alt="">
          <span>${wave.seal}波（KIN ${wave.start}-${wave.end}）</span>
        `;
      }
    }

    let revealedCount = 0;
    const revealedKINs = { karma: null, furnace: null, rebirth: null };

    function handleForge(forgeEl, position) {
      const slot = forgeEl.closest(".slot");
      if (slot.dataset.busy === "1") return;
      slot.dataset.busy = "1";

      const kin = BRAIN.drawRandomKIN();
      const spinLine = slot.querySelector(".spinLine");

      // 1. 鍛造爆發
      slot.classList.add("forging");

      setTimeout(() => {
        slot.classList.remove("forging");
        slot.classList.add("revealing");

        const face = slot.querySelector(".face");
        face.innerHTML = skeletonHTML();

        // 2. 煉化輪動
        slot.classList.add("smelting");
        
        const spinTimer = setInterval(() => {
          const fake = BRAIN.drawRandomKIN();
          spinLine.textContent = `${BRAIN.getTone(fake).name} · ${BRAIN.getSeal(fake).name}`;
        }, 80);

        // 3. 顯形
        setTimeout(() => {
          clearInterval(spinTimer);
          spinLine.textContent = `${BRAIN.getTone(kin).name} · ${BRAIN.getSeal(kin).name}`;

          fillFace(face, kin);
          revealedKINs[position] = kin;

          slot.classList.remove("smelting");
          slot.classList.add("revealed");
          slot.dataset.busy = "0";

          revealedCount++;
          console.log(`已鍛造 ${revealedCount}/3`);
          
          if (revealedCount === 3) {
            setTimeout(() => triggerFusion(), 500);
          }
        }, 1500);
      }, 300);
    }

    // 合盤融合
    function triggerFusion() {
      console.log('開始三位合盤融合');
      
      const karma = revealedKINs.karma;
      const furnace = revealedKINs.furnace;
      const rebirth = revealedKINs.rebirth;
      
      // 計算合盤 KIN
      let fusionKIN = (karma + furnace + rebirth) % 260;
      if (fusionKIN === 0) fusionKIN = 260;
      
      console.log(`合盤: ${karma} + ${furnace} + ${rebirth} = ${fusionKIN}`);
      
      // 顯示四卡
      showFourCards(karma, furnace, rebirth, fusionKIN);
      
      // 生成金句
      setTimeout(() => generateSynthesis(karma, furnace, rebirth, fusionKIN), 1000);
    }

    function showFourCards(karma, furnace, rebirth, fusion) {
      const fourCardsDiv = document.getElementById('fourCards');
      const zone = document.getElementById('synthesisZone');
      
      // 建立四張小卡
      const cards = [
        { kin: karma, label: '業力種子', isFusion: false },
        { kin: furnace, label: '煉金之爐', isFusion: false },
        { kin: rebirth, label: '蛻變之門', isFusion: false },
        { kin: fusion, label: '煉金融合', isFusion: true }
      ];
      
      fourCardsDiv.innerHTML = cards.map(card => {
        const toneId = toneIdOfKin(card.kin);
        const sealId = sealIdOfKin(card.kin);
        const fullName = BRAIN.getFullName(card.kin);
        const wave = BRAIN.getWavespell(card.kin);
        const imgSrc = `../images/${String(sealId).padStart(2, '0')}.png`;
        
        const bars = Math.floor(toneId / 5);
        const dots = toneId % 5;
        
        let toneHTML = '<div class="tone-area-mini' + (dots === 0 ? ' no-dots' : '') + '">';
        toneHTML += '<div class="tone-dots">';
        for (let i = 0; i < dots; i++) toneHTML += '<div class="tone-dot"></div>';
        toneHTML += '</div><div class="tone-bars">';
        for (let i = 0; i < bars; i++) toneHTML += '<div class="tone-bar"></div>';
        toneHTML += '</div></div>';
        
        return `
          <div class="${card.isFusion ? 'fusion-card-wrap' : ''}">
            <div class="mini-slot ${card.isFusion ? 'fusion-card' : ''}">
              <div class="mini-label">${card.label}</div>
              <div class="core-card">
                ${toneHTML}
                <img class="glyph-img" src="${imgSrc}" alt="${fullName}">
                <div class="kin-id">KIN ${card.kin}</div>
                <div class="kin-name">${fullName}</div>
                <div class="wave-pill">
                  <img class="mini-glyph" src="${imgSrc}" alt="">
                  <span>${wave.seal}波（KIN ${wave.start}-${wave.end}）</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      zone.classList.add('active');
    }

    function generateSynthesis(karma, furnace, rebirth, fusion) {
      console.log('生成合盤金句');
      
      if (!KIN_DATA || !KIN_DATA.seals || !KIN_DATA.tones) {
        document.getElementById('synthesisText').innerHTML = `
從業力種子的推動，<br>
經煉金之爐的轉化，<br>
在蛻變之門中重生。<br><br>
三位一體的煉化，凝聚為<br>
<span class="synthesis-highlight">KIN ${fusion} ${BRAIN.getFullName(fusion)}</span>
        `;
        document.getElementById('synthesisSentence').classList.add('active');
        return;
      }

      const getToneKey = (kin) => {
        const toneId = ((kin - 1) % 13) + 1;
        return `${toneId}_${Object.keys(KIN_DATA.tones)[toneId - 1].split('_')[1]}`;
      };

      const getSealKey = (kin) => {
        const sealId = ((kin - 1) % 20) + 1;
        return `${sealId}_${Object.keys(KIN_DATA.seals)[sealId - 1].split('_').slice(1).join('_')}`;
      };

      const karmaSeal = KIN_DATA.seals[getSealKey(karma)];
      const furnaceTone = KIN_DATA.tones[getToneKey(furnace)];
      const furnaceSeal = KIN_DATA.seals[getSealKey(furnace)];
      const rebirthSeal = KIN_DATA.seals[getSealKey(rebirth)];
      const rebirthTone = KIN_DATA.tones[getToneKey(rebirth)];
      const fusionSeal = KIN_DATA.seals[getSealKey(fusion)];
      const fusionTone = KIN_DATA.tones[getToneKey(fusion)];

      const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const karmaKW = karmaSeal.keywords ? getRandomItem(karmaSeal.keywords) : karmaSeal.core;
      const furnaceVerb = furnaceTone.verbs ? getRandomItem(furnaceTone.verbs) : getRandomItem(furnaceTone.key_feel);
      const furnaceKW = furnaceSeal.keywords ? getRandomItem(furnaceSeal.keywords) : furnaceSeal.core;
      const rebirthKW = rebirthSeal.keywords ? getRandomItem(rebirthSeal.keywords) : rebirthSeal.core;
      const rebirthState = rebirthTone.high_freq || getRandomItem(rebirthTone.key_feel);
      const fusionCore = fusionSeal.core || fusionSeal.name_zh;

      const synthesis = `
從<span class="synthesis-highlight">${karmaSeal.name_zh}的${karmaKW}</span>出發，<br>
你正在<span class="synthesis-highlight">${furnaceTone.name_zh}的${furnaceSeal.name_zh}</span>裡${furnaceVerb}。<br>
當你真正${furnaceKW}，<br>
<span class="synthesis-highlight">${rebirthSeal.name_zh}的${rebirthKW}</span>會自然展開——${rebirthState}。<br><br>
三位一體的煉化，凝聚為<br>
<span class="synthesis-highlight">${fusionTone.name_zh}的${fusionSeal.name_zh}</span><br>
${fusionCore}
      `.trim();

      document.getElementById('synthesisText').innerHTML = synthesis;
      document.getElementById('synthesisSentence').classList.add('active');
    }

    function postHeight() {
      const h = Math.max(document.documentElement.scrollHeight, window.innerHeight);
      parent.postMessage({ type: 'HEIGHT', id: 'inner', height: h }, '*');
    }

    window.onload = () => {
      postHeight();
      const observer = new MutationObserver(postHeight);
      observer.observe(document.body, { childList: true, subtree: true });
    };
  </script>
</body>
</html>
