<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>西方 · 轉煉 v9</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Cormorant+Garamond:wght@700;900&display=swap" rel="stylesheet">
  <!-- V9: 引入神廟調性比例語法 -->
  <script src="../core/tone-scale.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --abyss-black: #0a0a0f;
      --deep-blue: #0d1633;
      --obsidian: #1a1520;
      --lava-orange: #ff6b35;
      --forge-red: #d64933;
      --metal-glow: #ffaa66;
      --stone-blue: #2d3e5f;
      --ash-gray: #4a4a52;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      color: #e8f4ff;
      background:
        radial-gradient(1000px 700px at 50% 0%, rgba(255, 107, 53, 0.1), transparent 70%),
        linear-gradient(135deg, var(--abyss-black) 0%, var(--obsidian) 50%, var(--deep-blue) 100%);
    }

    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(45, 62, 95, 0.08) 0%, transparent 50%);
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1300px;
      margin: 0 auto;
      padding: clamp(30px, 5vh, 50px) 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .audio-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .audio-toggle:hover,
    .audio-toggle:active {
      background: rgba(255, 107, 53, 0.1);
      border-color: var(--lava-orange);
    }

    .audio-toggle.active {
      background: rgba(255, 107, 53, 0.2);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
    }

    .mast {
      text-align: center;
      margin-bottom: clamp(30px, 5vh, 50px);
    }

    .mast h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--metal-glow);
      letter-spacing: 0.22em;
      font-weight: 900;
      margin-bottom: clamp(10px, 2vh, 16px);
      text-shadow: 0 0 40px rgba(255, 170, 102, 0.5);
    }

    .mast .sub {
      color: rgba(232, 244, 255, 0.65);
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      line-height: 1.8;
      font-weight: 500;
    }

    .three {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(15px, 2.5vw, 35px);
      margin-bottom: clamp(30px, 5vh, 50px);
      flex: 1;
    }

    @media (max-width: 900px) {
      .three {
        grid-template-columns: 1fr;
        gap: clamp(20px, 4vh, 35px);
      }
    }

    .slot {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(45, 62, 95, 0.3);
      border-radius: 20px;
      padding: clamp(20px, 3vh, 35px) clamp(15px, 2.5vw, 25px);
      text-align: center;
      transition: all 0.4s;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 107, 53, 0.05);
    }

    .slot:hover {
      border-color: rgba(255, 107, 53, 0.4);
      box-shadow:
        0 20px 60px rgba(255, 107, 53, 0.15),
        inset 0 1px 0 rgba(255, 107, 53, 0.1);
    }

    .label {
      font-size: clamp(1.1rem, 2.2vw, 1.4rem);
      color: var(--lava-orange);
      font-weight: 900;
      letter-spacing: 0.18em;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
    }

    .subline {
      font-size: clamp(0.8rem, 1.5vw, 0.9rem);
      color: rgba(232, 244, 255, 0.6);
      margin-bottom: clamp(15px, 2.5vh, 25px);
      min-height: 2.5em;
      line-height: 1.5;
    }

    .forge-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      padding: 20px 0;
    }

    .forge {
      width: clamp(160px, 20vw, 200px);
      height: clamp(160px, 20vw, 200px);
      position: relative;
      cursor: pointer;
      transition: all 0.4s ease;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .forge:hover {
      transform: scale(1.05);
    }

    /* V9 FIX: 所有裝飾層 pointer-events: none */
    .forge-flame {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 170, 102, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(255, 107, 53, 0.25) 0%, transparent 60%);
      animation: flameRotate 8s linear infinite;
      filter: blur(6px);
      pointer-events: none;
    }

    @keyframes flameRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .forge-heat {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, transparent 70%);
      animation: heatPulse 3s ease-in-out infinite;
      filter: blur(10px);
      pointer-events: none;
    }

    @keyframes heatPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }

    .forge-hunab {
      position: absolute;
      inset: 15%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(13, 22, 51, 0.7) 0%, transparent 100%);
      animation: deepPulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes deepPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.04); opacity: 0.8; }
    }

    .forge-hunab img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      opacity: 0.35;
      filter: brightness(0.8) drop-shadow(0 0 15px rgba(255, 107, 53, 0.3));
      animation: slowRotate 45s linear infinite;
      border-radius: 50%;
      pointer-events: none;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .forge-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(45, 62, 95, 0.3);
      box-shadow:
        0 0 50px rgba(255, 107, 53, 0.15),
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 2px 8px rgba(255, 170, 102, 0.08);
      pointer-events: none;
    }

    .slot.spinning .forge {
      animation: spinPulse 0.3s ease-in-out infinite;
    }

    @keyframes spinPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); filter: brightness(1.2); }
    }

    .slot.spinning .forge-flame {
      animation: flameRotate 2s linear infinite !important;
    }

    .slot.spinning .forge-heat {
      animation: heatSurge 0.5s ease-in-out infinite !important;
    }

    @keyframes heatSurge {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .spinText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: var(--metal-glow);
      font-weight: 900;
      text-shadow: 0 0 20px var(--lava-orange);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .slot.spinning .spinText {
      opacity: 1;
    }

    .hint-text {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      color: rgba(255, 170, 102, 0.6);
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      pointer-events: none;
    }

    .slot.spinning .hint-text {
      opacity: 1;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .card-overlay {
      position: absolute;
      inset: -10%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 5;
    }

    .slot.revealed .card-overlay {
      opacity: 1;
      pointer-events: all;
    }

    .slot.revealed .forge {
      opacity: 0.2;
      transform: scale(0.9);
    }

    /* ===== 核心卡片 - 使用 Temple Tone–Glyph Grammar ===== */
    .core-card {
      --glyph: clamp(90px, 15vw, 130px);
      width: 100%;
      max-width: min(280px, 90%);
      background: rgba(248, 247, 242, 0.97);
      border-radius: 16px;
      color: #1a1a1a;
      padding: clamp(18px, 3vw, 28px) clamp(15px, 2.5vw, 22px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 107, 53, 0.2) inset;
      animation: cardReveal 0.8s ease forwards;
    }

    @keyframes cardReveal {
      from {
        opacity: 0;
        transform: scale(0.8) rotateY(90deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotateY(0deg);
      }
    }

    /* ===== 調性視覺 - 使用 tone-scale.js 注入的 CSS 變數 ===== */
    .tone-area-mini {
      height: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--tone-gap-rowrow, 6px);
      margin-bottom: 10px;
    }

    .tone-area-mini.no-dots .tone-dots { display: none; }

    .tone-dots {
      height: auto;
      display: flex;
      align-items: center;
      gap: var(--tone-gap-dotdot, 8px);
    }

    .tone-bars {
      display: flex;
      flex-direction: column;
      gap: var(--tone-gap-barbar, 6px);
    }

    .tone-dot {
      width: var(--tone-dot-size, 12px);
      height: var(--tone-dot-size, 12px);
      background: #000;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .tone-bar {
      width: var(--tone-bar-w, 106px);
      height: var(--tone-bar-h, 9px);
      background: #000;
      border-radius: calc(var(--tone-bar-h, 9px) / 2);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .glyph-img {
      width: var(--glyph);
      height: var(--glyph);
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.25));
      margin: 6px 0;
    }

    .kin-id {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      border-bottom: 1px solid #ddd;
      width: 80%;
      margin: 0 auto 8px;
      padding-bottom: 5px;
    }

    .kin-name {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 900;
      color: #333;
      letter-spacing: 0.1em;
    }

    .wave-pill {
      margin-top: 12px;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.05);
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .wave-pill .mini-glyph {
      width: 18px;
      height: 18px;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.2));
    }

    /* 合盤區 */
    .synthesis-zone {
      margin-top: clamp(25px, 4vh, 40px);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.6s ease;
    }

    .synthesis-zone.active {
      opacity: 1;
      max-height: 2000px;
    }

    .four-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(12px, 2vw, 25px);
      margin-bottom: clamp(25px, 4vh, 40px);
    }

    @media (max-width: 900px) {
      .four-cards {
        grid-template-columns: 1fr;
      }

      .fusion-card-wrap {
        order: -1;
        margin-bottom: 20px;
      }
    }

    .mini-slot {
      --glyph: clamp(70px, 12vw, 100px);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(45, 62, 95, 0.25);
      border-radius: 14px;
      padding: clamp(15px, 2.5vw, 22px) clamp(12px, 2vw, 18px);
      text-align: center;
      transition: all 0.3s;
    }

    .mini-label {
      font-size: clamp(0.85rem, 1.6vw, 1rem);
      color: var(--metal-glow);
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .fusion-card {
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 107, 53, 0.5);
      box-shadow:
        0 25px 80px rgba(255, 107, 53, 0.4),
        0 0 60px rgba(255, 170, 102, 0.3),
        inset 0 2px 15px rgba(255, 107, 53, 0.1);
      animation: fusionGlow 3s ease-in-out infinite;
    }

    @keyframes fusionGlow {
      0%, 100% {
        box-shadow:
          0 25px 80px rgba(255, 107, 53, 0.4),
          0 0 60px rgba(255, 170, 102, 0.3),
          inset 0 2px 15px rgba(255, 107, 53, 0.1);
      }
      50% {
        box-shadow:
          0 30px 100px rgba(255, 107, 53, 0.6),
          0 0 80px rgba(255, 170, 102, 0.5),
          inset 0 2px 20px rgba(255, 107, 53, 0.15);
      }
    }

    .fusion-card .mini-label {
      color: var(--lava-orange);
      opacity: 1;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
    }

    @media (min-width: 901px) {
      .fusion-card {
        transform: scale(1.15);
      }
    }

    /* 合盤金句 */
    .synthesis-sentence {
      max-width: 100%;
      padding: clamp(20px, 3.5vh, 35px) clamp(18px, 3vw, 30px);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 107, 53, 0.1);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
    }

    .synthesis-sentence.active {
      opacity: 1;
      transform: translateY(0);
    }

    .synthesis-text {
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      line-height: 2.1;
      color: #e8f4ff;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .synthesis-highlight {
      color: var(--metal-glow);
      font-weight: 900;
      text-shadow: 0 0 20px rgba(255, 170, 102, 0.4);
    }

    .soul-mark {
      margin-top: clamp(18px, 3vh, 22px);
      padding-top: clamp(15px, 2.5vh, 18px);
      border-top: 1px solid rgba(255, 107, 53, 0.2);
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      color: rgba(232, 244, 255, 0.7);
      font-style: italic;
      letter-spacing: 0.08em;
    }

    /* V9: 點擊順序提示 */
    .click-order-hint {
      font-size: 0.75rem;
      color: rgba(255, 170, 102, 0.5);
      margin-top: 8px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="nebula"></div>

  <div class="audio-toggle" id="audioToggle" onclick="toggleAudio()" title="背景音效">
    <span id="audioIcon">🔇</span>
  </div>

  <div class="wrap">
    <div class="mast">
      <h1>三位一體</h1>
      <div class="sub">三種同時存在的意識流，在此交會、轉煉</div>
    </div>

    <div class="three">
      <div class="slot" id="slot-karma">
        <div class="label">業力種子</div>
        <div class="subline">已內化、仍在推動你的一股力</div>
        <div class="forge-container">
          <div class="forge" onclick="handleForgeClick(this, 'karma')">
            <div class="forge-base"></div>
            <div class="forge-flame"></div>
            <div class="forge-heat"></div>
            <div class="forge-hunab">
              <img src="../images/hunab-ku-1.png" alt="Hunab Ku">
            </div>
            <div class="spinText"></div>
          </div>
          <div class="hint-text">再次點擊停止</div>
          <div class="card-overlay"></div>
        </div>
        <div class="click-order-hint" id="karma-order"></div>
      </div>

      <div class="slot" id="slot-furnace">
        <div class="label">煉金之爐</div>
        <div class="subline">你正在燃燒、正在鬆動的核心</div>
        <div class="forge-container">
          <div class="forge" onclick="handleForgeClick(this, 'furnace')">
            <div class="forge-base"></div>
            <div class="forge-flame"></div>
            <div class="forge-heat"></div>
            <div class="forge-hunab">
              <img src="../images/hunab-ku-1.png" alt="Hunab Ku">
            </div>
            <div class="spinText"></div>
          </div>
          <div class="hint-text">再次點擊停止</div>
          <div class="card-overlay"></div>
        </div>
        <div class="click-order-hint" id="furnace-order"></div>
      </div>

      <div class="slot" id="slot-rebirth">
        <div class="label">蛻變之門</div>
        <div class="subline">尚未成形、卻已拉住你的門檻</div>
        <div class="forge-container">
          <div class="forge" onclick="handleForgeClick(this, 'rebirth')">
            <div class="forge-base"></div>
            <div class="forge-flame"></div>
            <div class="forge-heat"></div>
            <div class="forge-hunab">
              <img src="../images/hunab-ku-1.png" alt="Hunab Ku">
            </div>
            <div class="spinText"></div>
          </div>
          <div class="hint-text">再次點擊停止</div>
          <div class="card-overlay"></div>
        </div>
        <div class="click-order-hint" id="rebirth-order"></div>
      </div>
    </div>

    <div class="synthesis-zone" id="synthesisZone">
      <div class="four-cards" id="fourCards"></div>
      <div class="synthesis-sentence" id="synthesisSentence">
        <div class="synthesis-text" id="synthesisText"></div>
        <div class="soul-mark">這是你此刻的靈魂印記</div>
      </div>
    </div>
  </div>

  <script src="../core/temple-core.js"></script>
  <script src="../core/temple_brain_final.js"></script>

  <script>
    // ===== V9 新增：點擊順序追蹤 =====
    const clickOrder = []; // 記錄點擊順序：['karma', 'furnace', 'rebirth'] 等

    // 順序對應的意識狀態
    const ORDER_MEANINGS = {
      'karma,furnace,rebirth': { focus: '從過去走向未來', hint: '帶著根，往前走' },
      'karma,rebirth,furnace': { focus: '過去與未來拉扯', hint: '現在是你的錨點' },
      'furnace,karma,rebirth': { focus: '站穩現在，回看整合', hint: '你已經準備好了' },
      'furnace,rebirth,karma': { focus: '在現在創造未來', hint: '過去會自己釋放' },
      'rebirth,furnace,karma': { focus: '被願景拉著走', hint: '記得帶上你的根' },
      'rebirth,karma,furnace': { focus: '未來與過去對話', hint: '現在是橋' }
    };

    // 音效系統
    let audioContext = null;
    let oscillator = null;
    let gainNode = null;
    let audioEnabled = false;

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioContext.createOscillator();
        gainNode = audioContext.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.value = 50;
        gainNode.gain.value = 0.05;

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
      }
    }

    function toggleAudio() {
      const toggle = document.getElementById('audioToggle');
      const icon = document.getElementById('audioIcon');

      audioEnabled = !audioEnabled;

      if (audioEnabled) {
        initAudio();
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
        toggle.classList.add('active');
        icon.textContent = '🔊';
      } else {
        if (audioContext && audioContext.state === 'running') {
          audioContext.suspend();
        }
        toggle.classList.remove('active');
        icon.textContent = '🔇';
      }
    }

    // JSON 資料
    let KIN_DATA = null;
    fetch('./kin-synthesis-data.json')
      .then(res => res.json())
      .then(data => {
        KIN_DATA = data;
        console.log('✅ JSON 載入');
      })
      .catch(err => console.error('❌ JSON 失敗:', err));

    // 後備大腦
    function fallbackBrain() {
      const SEALS = [
        { id: 1, name: "紅龍" }, { id: 2, name: "白風" }, { id: 3, name: "藍夜" },
        { id: 4, name: "黃種子" }, { id: 5, name: "紅蛇" }, { id: 6, name: "白世界橋" },
        { id: 7, name: "藍手" }, { id: 8, name: "黃星星" }, { id: 9, name: "紅月" },
        { id: 10, name: "白狗" }, { id: 11, name: "藍猴" }, { id: 12, name: "黃人" },
        { id: 13, name: "紅天行者" }, { id: 14, name: "白巫師" }, { id: 15, name: "藍鷹" },
        { id: 16, name: "黃戰士" }, { id: 17, name: "紅地球" }, { id: 18, name: "白鏡" },
        { id: 19, name: "藍風暴" }, { id: 20, name: "黃太陽" }
      ];
      const TONES = ["磁性", "月亮", "電力", "自我存在", "超頻", "韻律", "共振", "銀河", "太陽", "行星", "光譜", "水晶", "宇宙"];

      return {
        drawRandomKIN: () => Math.floor(Math.random() * 260) + 1,
        getTone: (k) => ({ id: ((k - 1) % 13) + 1, name: TONES[(k - 1) % 13] }),
        getSeal: (k) => SEALS[(k - 1) % 20],
        getFullName: (k) => `${TONES[(k - 1) % 13]}的${SEALS[(k - 1) % 20].name}`,
        getWavespell: (k) => {
          const start = Math.floor((k - 1) / 13) * 13 + 1;
          return { start, end: start + 12, seal: SEALS[(start - 1) % 20].name };
        }
      };
    }

    const BRAIN = (window.TEMPLE_BRAIN && typeof window.TEMPLE_BRAIN.getSeal === "function")
      ? window.TEMPLE_BRAIN : fallbackBrain();

    const toneIdOfKin = (kin) => ((kin - 1) % 13) + 1;
    const sealIdOfKin = (kin) => ((kin - 1) % 20) + 1;

    /**
     * V9: 套用 Temple Tone–Glyph Grammar
     */
    function applyToneScale(containerEl) {
      if (window.TONE_SCALE && containerEl) {
        TONE_SCALE.apply(containerEl);
      }
    }

    function createCardHTML(kin) {
      const toneId = toneIdOfKin(kin);
      const sealId = sealIdOfKin(kin);
      const fullName = BRAIN.getFullName(kin);
      const wave = BRAIN.getWavespell(kin);
      const imgSrc = `../images/${String(sealId).padStart(2, '0')}.png`;

      // 正確公式：bars = floor(toneId / 5), dots = toneId % 5
      const bars = Math.floor(toneId / 5);
      const dots = toneId % 5;

      let toneHTML = '<div class="tone-area-mini' + (dots === 0 ? ' no-dots' : '') + '">';
      toneHTML += '<div class="tone-dots">';
      for (let i = 0; i < dots; i++) toneHTML += '<div class="tone-dot"></div>';
      toneHTML += '</div><div class="tone-bars">';
      for (let i = 0; i < bars; i++) toneHTML += '<div class="tone-bar"></div>';
      toneHTML += '</div></div>';

      return `
        <div class="core-card">
          ${toneHTML}
          <img class="glyph-img" src="${imgSrc}" alt="${fullName}">
          <div class="kin-id">KIN ${kin}</div>
          <div class="kin-name">${fullName}</div>
          <div class="wave-pill">
            <img class="mini-glyph" src="${imgSrc}" alt="">
            <span>${wave.seal}波（${wave.start}-${wave.end}）</span>
          </div>
        </div>
      `;
    }

    let revealedCount = 0;
    const revealedKINs = { karma: null, furnace: null, rebirth: null };
    const spinTimers = {};

    function handleForgeClick(forgeEl, position) {
      const slot = forgeEl.closest(".slot");
      const spinText = forgeEl.querySelector(".spinText");

      if (slot.classList.contains('spinning')) {
        clearInterval(spinTimers[position]);
        delete spinTimers[position];

        slot.classList.remove('spinning');

        const currentKIN = parseInt(spinText.textContent.match(/\d+/)[0]);
        revealedKINs[position] = currentKIN;

        // V9: 記錄點擊順序
        clickOrder.push(position);
        const orderNum = clickOrder.length;
        const orderHint = document.getElementById(`${position}-order`);
        if (orderHint) {
          orderHint.textContent = `第 ${orderNum} 個點擊`;
        }

        const overlay = slot.querySelector('.card-overlay');
        overlay.innerHTML = createCardHTML(currentKIN);

        // V9: 套用 Temple Tone–Glyph Grammar
        const coreCard = overlay.querySelector('.core-card');
        applyToneScale(coreCard);

        slot.classList.add('revealed');

        revealedCount++;
        console.log(`已鍛造 ${revealedCount}/3, KIN ${currentKIN}, 順序: ${clickOrder.join(' → ')}`);

        if (revealedCount === 3) {
          setTimeout(() => triggerFusion(), 800);
        }

        return;
      }

      if (slot.classList.contains('revealed')) return;

      slot.classList.add('spinning');

      spinTimers[position] = setInterval(() => {
        const randomKIN = BRAIN.drawRandomKIN();
        spinText.textContent = `KIN ${randomKIN}`;
      }, 60);
    }

    function triggerFusion() {
      console.log('開始合盤融合');
      console.log('點擊順序:', clickOrder.join(' → '));

      const karma = revealedKINs.karma;
      const furnace = revealedKINs.furnace;
      const rebirth = revealedKINs.rebirth;

      let fusionKIN = (karma + furnace + rebirth) % 260;
      if (fusionKIN === 0) fusionKIN = 260;

      console.log(`合盤: ${karma} + ${furnace} + ${rebirth} = ${fusionKIN}`);

      showFourCards(karma, furnace, rebirth, fusionKIN);
      setTimeout(() => generateSynthesis(karma, furnace, rebirth, fusionKIN), 600);
    }

    function showFourCards(karma, furnace, rebirth, fusion) {
      const fourCardsDiv = document.getElementById('fourCards');
      const zone = document.getElementById('synthesisZone');

      const cards = [
        { kin: karma, label: '業力種子', isFusion: false },
        { kin: furnace, label: '煉金之爐', isFusion: false },
        { kin: rebirth, label: '蛻變之門', isFusion: false },
        { kin: fusion, label: '煉金融合', isFusion: true }
      ];

      fourCardsDiv.innerHTML = cards.map(card => {
        const toneId = toneIdOfKin(card.kin);
        const sealId = sealIdOfKin(card.kin);
        const fullName = BRAIN.getFullName(card.kin);
        const wave = BRAIN.getWavespell(card.kin);
        const imgSrc = `../images/${String(sealId).padStart(2, '0')}.png`;

        const bars = Math.floor(toneId / 5);
        const dots = toneId % 5;

        let toneHTML = '<div class="tone-area-mini' + (dots === 0 ? ' no-dots' : '') + '">';
        toneHTML += '<div class="tone-dots">';
        for (let i = 0; i < dots; i++) toneHTML += '<div class="tone-dot"></div>';
        toneHTML += '</div><div class="tone-bars">';
        for (let i = 0; i < bars; i++) toneHTML += '<div class="tone-bar"></div>';
        toneHTML += '</div></div>';

        return `
          <div class="${card.isFusion ? 'fusion-card-wrap' : ''}">
            <div class="mini-slot ${card.isFusion ? 'fusion-card' : ''}">
              <div class="mini-label">${card.label}</div>
              ${toneHTML}
              <img class="glyph-img" src="${imgSrc}" alt="${fullName}">
              <div class="kin-id">KIN ${card.kin}</div>
              <div class="kin-name">${fullName}</div>
              <div class="wave-pill">
                <img class="mini-glyph" src="${imgSrc}" alt="">
                <span>${wave.seal}波（${wave.start}-${wave.end}）</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // V9: 套用 Temple Tone–Glyph Grammar 到合盤四卡
      fourCardsDiv.querySelectorAll('.mini-slot').forEach(applyToneScale);

      zone.classList.add('active');
    }

    function generateSynthesis(karma, furnace, rebirth, fusion) {
      // V9: 取得點擊順序的意涵
      const orderKey = clickOrder.join(',');
      const orderMeaning = ORDER_MEANINGS[orderKey] || { focus: '', hint: '' };

      if (!KIN_DATA || !KIN_DATA.seals || !KIN_DATA.tones) {
        let orderIntro = orderMeaning.focus ? `<br><em style="opacity:0.7">（${orderMeaning.focus}——${orderMeaning.hint}）</em>` : '';
        document.getElementById('synthesisText').innerHTML = `
從業力種子的推動，<br>
經煉金之爐的轉化，<br>
在蛻變之門中重生。<br><br>
三位一體的煉化，凝聚為<br>
<span class="synthesis-highlight">KIN ${fusion} ${BRAIN.getFullName(fusion)}</span>
${orderIntro}
        `;
        document.getElementById('synthesisSentence').classList.add('active');
        return;
      }

      const getToneKey = (kin) => {
        const toneId = ((kin - 1) % 13) + 1;
        return `${toneId}_${Object.keys(KIN_DATA.tones)[toneId - 1].split('_')[1]}`;
      };

      const getSealKey = (kin) => {
        const sealId = ((kin - 1) % 20) + 1;
        return `${sealId}_${Object.keys(KIN_DATA.seals)[sealId - 1].split('_').slice(1).join('_')}`;
      };

      const karmaSeal = KIN_DATA.seals[getSealKey(karma)];
      const furnaceTone = KIN_DATA.tones[getToneKey(furnace)];
      const furnaceSeal = KIN_DATA.seals[getSealKey(furnace)];
      const rebirthSeal = KIN_DATA.seals[getSealKey(rebirth)];
      const rebirthTone = KIN_DATA.tones[getToneKey(rebirth)];
      const fusionSeal = KIN_DATA.seals[getSealKey(fusion)];
      const fusionTone = KIN_DATA.tones[getToneKey(fusion)];

      const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const karmaKW = karmaSeal.keywords ? getRandomItem(karmaSeal.keywords) : karmaSeal.core;
      const furnaceVerb = furnaceTone.verbs ? getRandomItem(furnaceTone.verbs) : getRandomItem(furnaceTone.key_feel);
      const furnaceKW = furnaceSeal.keywords ? getRandomItem(furnaceSeal.keywords) : furnaceSeal.core;
      const rebirthKW = rebirthSeal.keywords ? getRandomItem(rebirthSeal.keywords) : rebirthSeal.core;
      const rebirthState = rebirthTone.high_freq || getRandomItem(rebirthTone.key_feel);
      const fusionCore = fusionSeal.core || fusionSeal.name_zh;

      // V9: 加入點擊順序的意涵
      let orderLine = orderMeaning.focus
        ? `<br><br><em style="opacity:0.8; font-size:0.95em">你的意識${orderMeaning.focus}——${orderMeaning.hint}</em>`
        : '';

      const synthesis = `
從<span class="synthesis-highlight">${karmaSeal.name_zh}的${karmaKW}</span>出發，<br>
你正在<span class="synthesis-highlight">${furnaceTone.name_zh}的${furnaceSeal.name_zh}</span>裡${furnaceVerb}。<br>
當你真正${furnaceKW}，<br>
<span class="synthesis-highlight">${rebirthSeal.name_zh}的${rebirthKW}</span>會自然展開——${rebirthState}。<br><br>
三位一體的煉化，凝聚為<br>
<span class="synthesis-highlight">${fusionTone.name_zh}的${fusionSeal.name_zh}</span><br>
${fusionCore}
${orderLine}
      `.trim();

      document.getElementById('synthesisText').innerHTML = synthesis;
      document.getElementById('synthesisSentence').classList.add('active');
    }

    function postHeight() {
      const h = Math.max(document.documentElement.scrollHeight, window.innerHeight);
      parent.postMessage({ type: 'HEIGHT', id: 'inner', height: h }, '*');
    }

    window.onload = () => {
      postHeight();
      const observer = new MutationObserver(postHeight);
      observer.observe(document.body, { childList: true, subtree: true });
    };
  </script>
</body>
</html>
