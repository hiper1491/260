<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藍色小屋 - 時光流轉殿</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Serif TC', serif;
      background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%);
      color: #c9d6df;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #c9d6df;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .title {
      text-align: center;
      margin-bottom: 30px;
    }
    .title h1 {
      font-size: 2.5rem;
      font-weight: 900;
      color: #4a90e2;
      letter-spacing: 0.12em;
      text-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
    }
    .title p {
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0.8;
    }
    .breath-guide {
      text-align: center;
      padding: 60px 20px;
      display: none;
    }
    .breath-guide.active { display: block; }
    .breath-circle {
      width: 150px;
      height: 150px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #4a90e2 0%, transparent 70%);
      animation: breathe 10s infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
      60% { transform: scale(1.2); opacity: 1; }
    }
    .breath-text {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .skip-btn {
      padding: 8px 20px;
      background: rgba(74, 144, 226, 0.2);
      border: 1px solid #4a90e2;
      color: #c9d6df;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Noto Serif TC', serif;
      transition: all 0.3s;
    }
    .skip-btn:hover {
      background: rgba(74, 144, 226, 0.4);
    }
    .three-cards {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 40px 0;
    }
    .three-cards.active { display: grid; }
    @media (max-width: 768px) {
      .three-cards { grid-template-columns: 1fr; }
    }
    .card-slot {
      background: rgba(26, 47, 74, 0.6);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card-slot:hover:not(.revealed) {
      border-color: #4a90e2;
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(74, 144, 226, 0.3);
    }
    .card-slot.center {
      transform: scale(1.05);
    }
    .card-label {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #4a90e2;
    }
    .card-back {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, #4a90e2 0%, #1a2f4a 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #c9d6df;
      margin-bottom: 20px;
    }
    .card-content {
      display: none;
    }
    .card-slot.revealed .card-back { display: none; }
    .card-slot.revealed .card-content { display: block; }
    .kin-card {
      background: rgba(230, 225, 214, 0.95);
      border-radius: 10px;
      padding: 15px;
      color: #3a3632;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    .tone-zone {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      font-size: 2rem;
    }
    .seal-zone {
      margin: 15px 0;
    }
    .seal-image {
      width: 120px;
      height: 120px;
      object-fit: contain;
      background: #f5f5f5;
      border-radius: 10px;
    }
    .name-zone {
      margin-top: 15px;
    }
    .kin-number {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .kin-name {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .wave-info {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    .synthesis {
      display: none;
      text-align: center;
      margin: 40px 0;
      padding: 30px;
      background: rgba(74, 144, 226, 0.1);
      border-radius: 15px;
      border: 2px solid #4a90e2;
    }
    .synthesis.active { display: block; }
    .synthesis h2 {
      font-size: 1.8rem;
      color: #4a90e2;
      margin-bottom: 20px;
    }
    .synthesis-card {
      max-width: 300px;
      margin: 0 auto 30px;
    }
    .script {
      text-align: left;
      line-height: 1.8;
      max-width: 800px;
      margin: 0 auto;
    }
    .script-section {
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(26, 47, 74, 0.4);
      border-radius: 10px;
      border-left: 4px solid #4a90e2;
    }
    .script-section h3 {
      color: #4a90e2;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }
    .redraw-btn {
      display: none;
      margin: 30px auto;
      padding: 12px 30px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      font-family: 'Noto Serif TC', serif;
      cursor: pointer;
      transition: all 0.3s;
    }
    .redraw-btn.active { display: block; }
    .redraw-btn:hover {
      background: #3a7bc8;
      transform: scale(1.05);
    }
    .debug-info {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  
  <div class="container">
    <div class="title">
      <h1>藍色小屋</h1>
      <p>時光流轉殿 · 三位一體的蛻變之旅</p>
    </div>
    
    <div class="breath-guide active" id="breathGuide">
      <div class="breath-circle"></div>
      <div class="breath-text">吸氣，連結源頭<br>吐氣，讓時間流向當下</div>
      <button class="skip-btn" onclick="skipBreath()">跳過呼吸</button>
    </div>
    
    <div class="three-cards" id="threeCards">
      <div class="card-slot" data-position="past" onclick="drawCard(this)">
        <div class="card-label">過去</div>
        <div class="card-back">∞</div>
        <div class="card-content"></div>
      </div>
      
      <div class="card-slot center" data-position="present" onclick="drawCard(this)">
        <div class="card-label">現在</div>
        <div class="card-back">∞</div>
        <div class="card-content"></div>
      </div>
      
      <div class="card-slot" data-position="future" onclick="drawCard(this)">
        <div class="card-label">未來</div>
        <div class="card-back">∞</div>
        <div class="card-content"></div>
      </div>
    </div>
    
    <div class="synthesis" id="synthesis">
      <h2>時空流轉的啟示</h2>
      <div class="synthesis-card" id="synthesisCard"></div>
      <div class="script" id="script"></div>
    </div>
    
    <button class="redraw-btn" id="redrawBtn" onclick="reset()">重新抽取</button>
  </div>
  
  <div class="debug-info" id="debug">初始化中...</div>
  
  <script>
    // 內嵌大腦（測試用）
    const TEMPLE_BRAIN = (() => {
      const YEAR_CONSTANTS = {
        2014: 62, 2015: 167, 2016: 12, 2017: 118, 2018: 223,
        2019: 68, 2020: 174, 2021: 19, 2022: 124, 2023: 229,
        2024: 72, 2025: 177, 2026: 22, 2027: 127, 2028: 233,
        2029: 78, 2030: 183, 2031: 28, 2032: 134, 2033: 239,
        2034: 84, 2035: 187
      };
      
      const SOLAR_SEALS = [
        "紅龍","白風","藍夜","黃種子","紅蛇","白世界橋","藍手","黃星星","紅月","白狗",
        "藍猴","黃人","紅天行者","白巫師","藍鷹","黃戰士","紅地球","白鏡","藍風暴","黃太陽"
      ];
      
      const GALACTIC_TONES = [
        "磁性","月亮","電力","自我存在","超頻","韻律","共振","銀河","太陽","行星","光譜","水晶","宇宙"
      ];
      
      return {
        drawRandomKIN: () => Math.floor(Math.random() * 260) + 1,
        
        calculateSynthesis: (...kins) => {
          let sum = kins.reduce((a,b) => a+b, 0);
          while(sum > 260) sum -= 260;
          return sum || 260;
        },
        
        getFullName: (k) => {
          const t = GALACTIC_TONES[(k-1)%13];
          const s = SOLAR_SEALS[(k-1)%20];
          return `${t}的${s}`;
        },
        
        getToneSymbol: (k) => {
          const t = ((k-1)%13)+1;
          const dots = t>4 ? 1 : t;
          const bars = t>4 ? Math.floor((t-1)/5) : 0;
          return '●'.repeat(dots) + '━'.repeat(bars);
        },
        
        getSealImagePath: (k) => {
          const id = ((k-1)%20)+1;
          return `../images/${String(id).padStart(2,'0')}.png`;
        },
        
        getWavespell: (k) => {
          const start = Math.floor((k-1)/13)*13+1;
          const seal = SOLAR_SEALS[((start-1)%20)];
          return {start, end: start+12, seal};
        }
      };
    })();
    
    // 生成星空
    const starsDiv = document.getElementById('stars');
    for(let i=0; i<100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random()*100 + '%';
      star.style.top = Math.random()*100 + '%';
      star.style.animationDelay = Math.random()*3 + 's';
      starsDiv.appendChild(star);
    }
    
    let drawnKins = {past: null, present: null, future: null};
    let drawCount = 0;
    
    // 更新除錯資訊
    function updateDebug(msg) {
      document.getElementById('debug').textContent = msg;
    }
    
    updateDebug('大腦已載入，等待呼吸結束...');
    
    function skipBreath() {
      updateDebug('呼吸結束，可以點擊卡牌');
      document.getElementById('breathGuide').classList.remove('active');
      document.getElementById('threeCards').classList.add('active');
    }
    
    setTimeout(skipBreath, 10000);
    
    function drawCard(slot) {
      if(slot.classList.contains('revealed')) {
        updateDebug('此卡已翻開');
        return;
      }
      
      const pos = slot.dataset.position;
      const kin = TEMPLE_BRAIN.drawRandomKIN();
      drawnKins[pos] = kin;
      
      updateDebug(`抽到${pos}: KIN ${kin}`);
      
      const wave = TEMPLE_BRAIN.getWavespell(kin);
      
      slot.classList.add('revealed');
      slot.querySelector('.card-content').innerHTML = `
        <div class="kin-card">
          <div class="tone-zone">${TEMPLE_BRAIN.getToneSymbol(kin)}</div>
          <div class="seal-zone">
            <img src="${TEMPLE_BRAIN.getSealImagePath(kin)}" 
                 class="seal-image" 
                 alt="${TEMPLE_BRAIN.getFullName(kin)}"
                 onerror="this.style.display='none'">
          </div>
          <div class="name-zone">
            <div class="kin-number">KIN ${kin}</div>
            <div class="kin-name">${TEMPLE_BRAIN.getFullName(kin)}</div>
          </div>
          <div class="wave-info">${wave.seal}波 (KIN ${wave.start}-${wave.end})</div>
        </div>
      `;
      
      drawCount++;
      updateDebug(`已抽 ${drawCount}/3 張`);
      
      if(drawCount === 3) showSynthesis();
    }
    
    function showSynthesis() {
      const {past, present, future} = drawnKins;
      const synthesis = TEMPLE_BRAIN.calculateSynthesis(past, present, future);
      
      updateDebug(`合盤: KIN ${synthesis}`);
      
      document.getElementById('synthesisCard').innerHTML = `
        <div class="kin-card">
          <div class="tone-zone">${TEMPLE_BRAIN.getToneSymbol(synthesis)}</div>
          <div class="seal-zone">
            <img src="${TEMPLE_BRAIN.getSealImagePath(synthesis)}" 
                 class="seal-image" 
                 alt="${TEMPLE_BRAIN.getFullName(synthesis)}"
                 onerror="this.style.display='none'">
          </div>
          <div class="name-zone">
            <div class="kin-number">KIN ${synthesis}</div>
            <div class="kin-name">${TEMPLE_BRAIN.getFullName(synthesis)}</div>
          </div>
        </div>
      `;
      
      document.getElementById('script').innerHTML = `
        <div class="script-section">
          <h3>【過去之流】</h3>
          <p>${TEMPLE_BRAIN.getFullName(past)}的能量曾經塑造了你的根基。這股力量來自${TEMPLE_BRAIN.getWavespell(past).seal}波，它在你的過去種下了深刻的印記。</p>
        </div>
        <div class="script-section">
          <h3>【現在之核】</h3>
          <p>此刻，你正站在${TEMPLE_BRAIN.getFullName(present)}的能量中心。${TEMPLE_BRAIN.getWavespell(present).seal}波的頻率正在引導你穿越當下的試煉與蛻變。</p>
        </div>
        <div class="script-section">
          <h3>【未來之門】</h3>
          <p>${TEMPLE_BRAIN.getFullName(future)}將引領你走向新的境界。${TEMPLE_BRAIN.getWavespell(future).seal}波正在前方為你開啟通道。</p>
        </div>
        <div class="script-section">
          <h3>【合盤啟示】</h3>
          <p>這三股力量交織成 ${TEMPLE_BRAIN.getFullName(synthesis)}。你的靈魂正在學習整合過去的智慧、當下的力量與未來的願景，成為完整的存在。</p>
        </div>
      `;
      
      document.getElementById('synthesis').classList.add('active');
      document.getElementById('redrawBtn').classList.add('active');
    }
    
    function reset() {
      drawnKins = {past: null, present: null, future: null};
      drawCount = 0;
      updateDebug('已重置，可重新抽卡');
      document.querySelectorAll('.card-slot').forEach(s => {
        s.classList.remove('revealed');
        s.querySelector('.card-content').innerHTML = '';
      });
      document.getElementById('synthesis').classList.remove('active');
      document.getElementById('redrawBtn').classList.remove('active');
    }
  </script>
</body>
</html>
