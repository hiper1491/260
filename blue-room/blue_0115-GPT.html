<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>藍色114-1｜西方・轉煉（v11）</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#0c1f33; --bg1:#143454; --bg2:#1b4269;
      --ink:#dbe7ef; --muted:rgba(219,231,239,.76);
      --blue:#6fb6ff; --blue2:#a7dcff;
      --line:rgba(167,220,255,.22); --shadow:rgba(0,0,0,.16);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Noto Serif TC', serif;
      background:
        radial-gradient(1100px 720px at 50% -12%, rgba(167,220,255,.22), transparent 62%),
        radial-gradient(900px 560px at 20% 15%, rgba(111,182,255,.13), transparent 58%),
        linear-gradient(135deg, var(--bg0) 0%, var(--bg1) 45%, var(--bg2) 100%);
      color:var(--ink);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* 星空 */
    .stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.78;}
    .star{
      position:absolute; width:2px; height:2px; border-radius:50%;
      background:rgba(219,231,239,.92);
      animation:twinkle 5.2s infinite;
      opacity:.16;
    }
    @keyframes twinkle{0%,100%{opacity:.10} 50%{opacity:.62}}

    .container{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:34px 18px 110px;}

    .mast{text-align:center; margin: 10px 0 22px;}
    .mast .kicker{
      font-family:'Cormorant Garamond', serif;
      letter-spacing:.26em;
      color:rgba(167,220,255,.9);
      font-weight:700;
      font-size:.92rem;
      text-shadow:0 0 20px rgba(167,220,255,.18);
    }
    .mast h1{
      margin-top:12px;
      font-weight:900;
      font-size:2.18rem;
      letter-spacing:.10em;
      color:var(--blue);
      text-shadow:0 0 22px rgba(111,182,255,.22);
    }
    .mast .sub{
      margin-top:14px;
      font-size:1.02rem;
      line-height:1.95;
      color:var(--muted);
      font-weight:800;
    }

    .panel{
      margin-top:26px;
      padding: 18px 16px;
      border-radius:20px;
      background: rgba(34,72,112,.18);
      border:1px solid var(--line);
      box-shadow: 0 18px 55px rgba(0,0,0,.12);
    }
    .three{display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top:10px;}
    @media(max-width:820px){ .three{grid-template-columns:1fr} }

    .slot{
      background: rgba(34,72,112,.32);
      border:1px solid rgba(167,220,255,.16);
      border-radius:18px;
      padding:18px 16px 18px;
      min-height: 640px;
      box-shadow: 0 14px 36px rgba(0,0,0,.12);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .label{font-size:1.18rem; color: rgba(167,220,255,.95); margin-top: 10px; margin-bottom:6px; letter-spacing:.08em; font-weight:900;}
    .subline{font-size:.88rem; color: rgba(219,231,239,.74); line-height:1.75; margin-bottom:16px;}

    /* ✅ 舞台：上(門) 下(顯形卡) 分離，永遠不疊壓 */
    .stage{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 14px;
      padding: 6px 0 8px;
    }

    /* Hunab-Ku 門（不再放角標文字） */
    .gate-disc{
      width:176px; height:176px;
      border-radius:999px;
      background: radial-gradient(circle, rgba(111,182,255,.34) 0%, rgba(12,31,51,.02) 72%);
      box-shadow: 0 0 0 1px rgba(167,220,255,.16) inset, 0 18px 42px rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      cursor:pointer;
      transition: transform .18s ease, box-shadow .18s ease, opacity .25s ease;
    }
    .gate-disc:hover{ transform: scale(1.01); box-shadow: 0 0 0 1px rgba(167,220,255,.22) inset, 0 22px 52px rgba(0,0,0,.20); }
    .gate-disc img{
      width:86%; height:86%;
      object-fit:contain;
      opacity:.95;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.16));
      border-radius:999px;
      pointer-events:none;
    }

    /* ✅ 輪動文字：只在圓下方一行，避免「角標搞笑」 */
    .spin-line{
      height: 22px;
      font-size:.92rem;
      letter-spacing:.06em;
      color: rgba(219,231,239,.70);
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity .18s ease, transform .18s ease;
      user-select:none;
      white-space:nowrap;
    }
    .slot.spinning .spin-line{
      opacity: 1;
      transform: translateY(0);
    }

    /* ✅ 翻動/跳動：都只作用在圓上 */
    .slot.flipping .gate-disc{ animation: nudge .30s ease both; }
    @keyframes nudge{ to { transform: scale(.985); opacity:.82; } }

    .slot.spinning .gate-disc{ animation: pulse .92s ease both; }
    @keyframes pulse{
      0%{transform:scale(1); filter:none}
      30%{transform:scale(1.05); filter: drop-shadow(0 0 18px rgba(167,220,255,.16))}
      60%{transform:scale(1.02)}
      100%{transform:scale(1)}
    }

    /* ✅ 顯形後：門退場（淡出＋收起高度），不再壓住卡片 */
    .gate-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      transition: max-height .35s ease, opacity .25s ease, transform .35s ease;
      max-height: 240px;
      opacity: 1;
      transform: translateY(0);
    }
    .slot.revealed .gate-wrap{
      max-height: 0px;
      opacity: 0;
      transform: translateY(-8px);
      overflow:hidden;
      pointer-events:none;
    }

    /* 灰卡容器（固定在門下面，不會蓋標題） */
    .face{
      width: min(380px, 100%);
      opacity:0;
      transform: translateY(-6px);
      transition: opacity .20s ease, transform .20s ease;
    }
    .slot.revealing .face{
      opacity:1;
      transform: translateY(0);
    }

    /* core card */
    .core-card{
      width: 100%;
      background: rgba(236,234,229,.94);
      border-radius: 14px;
      padding: 18px 16px 18px;
      box-shadow: 0 18px 44px rgba(0,0,0,.16);
      color:#111;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 10px;
    }
    .tone-area-mini{
      height:72px;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .tone-area-mini.no-dots .tone-dots{ display:none; }
    .tone-dots{
      height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .tone-bars{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .tone-dot{ width:22px; height:22px; background:#000; border-radius:50%; }
    .tone-bar{ width:190px; height:16px; background:#000; border-radius:8px; }

    .glyph-img{
      width: clamp(120px, 18vw, 160px);
      height: clamp(120px, 18vw, 160px);
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,0.16));
      margin-top: 2px;
    }
    .kin-id{
      font-family:'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight:900;
      letter-spacing:.10em;
      line-height:1;
      margin-top: 2px;
    }
    .kin-name{
      font-family:'Noto Serif TC', serif;
      font-size: 1.2rem;
      font-weight:900;
      letter-spacing:.12em;
      text-align:center;
      margin-top: 2px;
    }
    .wave-pill{
      margin-top:6px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.08em;
      color:#222;
      font-size:.95rem;
    }
    .wave-pill .mini-glyph{
      width:22px; height:22px; object-fit:contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.12));
    }

    /* 空殼：不畫任何點/槓（避免你說的「點點」） */
    .skeleton .tone-area-mini{ opacity:0; }
    .skeleton .glyph-img{ opacity:0; }
    .skeleton .kin-id,.skeleton .kin-name{ opacity:.30; }
    .skeleton .wave-pill{ display:none; }

    .hintline{
      font-size:.90rem;
      color: rgba(219,231,239,.70);
      margin-top: 10px;
      min-height: 1.6em;
    }

    .ver{
      position:fixed; right:12px; bottom:12px;
      background: rgba(0,0,0,.55);
      border:1px solid rgba(167,220,255,.22);
      color: rgba(167,220,255,.9);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: .78rem;
      letter-spacing: .08em;
      z-index: 9;
      opacity:.85;
    }
  </style>
</head>

<body>
  <div class="stars" id="stars"></div>

  <div class="container">
    <section class="scene active" id="sceneHall">
      <div class="mast">
        <div class="kicker">THREE POSITIONS · ONE ALCHEMY</div>
        <h1>三位一體</h1>
        <div class="sub">
          沒有時間刻度。只有三個同時存在的意識位置。<br>
          你不必理解，先讓它顯形。
        </div>
      </div>

      <div class="panel">
        <div class="three">

          <div class="slot" data-position="past">
            <div class="label">過去</div>
            <div class="subline">已內化、仍在推動你的一股力</div>

            <div class="stage">
              <div class="gate-wrap">
                <div class="gate-disc" onclick="reveal(event, this)">
                  <img src="../images/hunab-ku-1.png" alt="Hunab-Ku" onerror="this.style.display='none'">
                </div>
                <div class="spin-line">　</div>
              </div>

              <div class="face"></div>
            </div>

            <div class="hintline">點 Hunab-Ku：翻動 → 跳動 → 顯形。</div>
          </div>

          <div class="slot" data-position="present">
            <div class="label">現在</div>
            <div class="subline">你正在燃燒、正在鬆動的核心</div>

            <div class="stage">
              <div class="gate-wrap">
                <div class="gate-disc" onclick="reveal(event, this)">
                  <img src="../images/hunab-ku-1.png" alt="Hunab-Ku" onerror="this.style.display='none'">
                </div>
                <div class="spin-line">　</div>
              </div>

              <div class="face"></div>
            </div>

            <div class="hintline">點 Hunab-Ku：翻動 → 跳動 → 顯形。</div>
          </div>

          <div class="slot" data-position="future">
            <div class="label">未來</div>
            <div class="subline">尚未成形、卻已拉住你的門檻</div>

            <div class="stage">
              <div class="gate-wrap">
                <div class="gate-disc" onclick="reveal(event, this)">
                  <img src="../images/hunab-ku-1.png" alt="Hunab-Ku" onerror="this.style.display='none'">
                </div>
                <div class="spin-line">　</div>
              </div>

              <div class="face"></div>
            </div>

            <div class="hintline">點 Hunab-Ku：翻動 → 跳動 → 顯形。</div>
          </div>

        </div>
      </div>
    </section>
  </div>

  <div class="ver">BLUE 114-1 · v11</div>

  <script src="./temple-core.js"></script>
  <script src="./temple_brain_final.js"></script>
  <script src="./kin-card-core.js"></script>

  <script>
    // 星空
    const starsDiv = document.getElementById('stars');
    for(let i=0;i<110;i++){
      const star=document.createElement('div');
      star.className='star';
      star.style.left=(Math.random()*100)+'%';
      star.style.top=(Math.random()*100)+'%';
      star.style.animationDelay=(Math.random()*5.2)+'s';
      starsDiv.appendChild(star);
    }

    function fallbackBrain(){
      const SOLAR_SEALS = [
        {id:1,name:"紅龍"},{id:2,name:"白風"},{id:3,name:"藍夜"},{id:4,name:"黃種子"},{id:5,name:"紅蛇"},
        {id:6,name:"白世界橋"},{id:7,name:"藍手"},{id:8,name:"黃星星"},{id:9,name:"紅月"},{id:10,name:"白狗"},
        {id:11,name:"藍猴"},{id:12,name:"黃人"},{id:13,name:"紅天行者"},{id:14,name:"白巫師"},{id:15,name:"藍鷹"},
        {id:16,name:"黃戰士"},{id:17,name:"紅地球"},{id:18,name:"白鏡"},{id:19,name:"藍風暴"},{id:20,name:"黃太陽"}
      ];
      const GALACTIC_TONES = ["磁性","月亮","電力","自我存在","超頻","韻律","共振","銀河","太陽","行星","光譜","水晶","宇宙"];
      return {
        drawRandomKIN: ()=> Math.floor(Math.random()*260)+1,
        getTone: (k)=> ({ id: ((k-1)%13)+1, name: GALACTIC_TONES[(k-1)%13] }),
        getSeal: (k)=> SOLAR_SEALS[(k-1)%20],
        getFullName:(k)=> `${GALACTIC_TONES[(k-1)%13]}的${SOLAR_SEALS[(k-1)%20].name}`,
        getWavespell:(k)=>{
          const start=Math.floor((k-1)/13)*13+1;
          const end=start+12;
          const seal=SOLAR_SEALS[(start-1)%20].name;
          return {start,end,seal};
        }
      };
    }

    const BRAIN = (window.TEMPLE_BRAIN && typeof window.TEMPLE_BRAIN.getSeal === "function")
      ? window.TEMPLE_BRAIN : fallbackBrain();

    const toneIdOfKin = (kin)=> ((kin-1)%13)+1;
    const sealIdOfKin = (kin)=> ((kin-1)%20)+1;

    function renderToneMarksInto(container, toneId){
      const bars = Math.floor(toneId / 5);
      const dots = toneId % 5;

      container.classList.toggle("no-dots", dots === 0);

      const dotsRow = container.querySelector(".tone-dots");
      const barsCol = container.querySelector(".tone-bars");
      dotsRow.innerHTML = "";
      barsCol.innerHTML = "";

      for(let i=0;i<dots;i++){
        const d=document.createElement("div");
        d.className="tone-dot";
        dotsRow.appendChild(d);
      }
      for(let i=0;i<bars;i++){
        const b=document.createElement("div");
        b.className="tone-bar";
        barsCol.appendChild(b);
      }
    }

    function skeletonHTML(){
      return `
        <div class="core-card skeleton">
          <div class="tone-area-mini">
            <div class="tone-dots"></div>
            <div class="tone-bars"></div>
          </div>
          <img class="glyph-img" alt="">
          <div class="kin-id">KIN —</div>
          <div class="kin-name">　</div>
          <div class="wave-pill"></div>
        </div>
      `;
    }

    function fillFace(faceEl, kin){
      const toneId = toneIdOfKin(kin);
      const sealId = sealIdOfKin(kin);
      const fullName = BRAIN.getFullName(kin);
      const wave = BRAIN.getWavespell(kin);
      const imgSrc = `../images/${String(sealId).padStart(2,'0')}.png`;

      const card = faceEl.querySelector(".core-card");
      card.classList.remove("skeleton");

      renderToneMarksInto(faceEl.querySelector(".tone-area-mini"), toneId);

      const glyph = faceEl.querySelector(".glyph-img");
      glyph.src = imgSrc;
      glyph.alt = fullName;
      glyph.style.opacity = "1";

      faceEl.querySelector(".kin-id").textContent = `KIN ${kin}`;
      faceEl.querySelector(".kin-name").textContent = fullName;

      const pill = faceEl.querySelector(".wave-pill");
      pill.innerHTML = `
        <img class="mini-glyph" src="${imgSrc}" alt="" onerror="this.style.display='none'">
        <span>${wave.seal}波（KIN ${wave.start}-${wave.end}）</span>
      `;
      pill.style.display = "flex";
    }

    function reveal(e, discEl){
      e.stopPropagation();
      const slot = discEl.closest(".slot");
      if(slot.dataset.busy === "1") return;
      slot.dataset.busy = "1";

      const kin = BRAIN.drawRandomKIN();
      const spinLine = slot.querySelector(".spin-line");

      // 1) 翻動（微縮淡）
      slot.classList.add("flipping");

      // 2) 先讓空殼出現（但不畫點/槓）
      setTimeout(()=>{
        slot.classList.remove("flipping");
        slot.classList.add("revealing");

        const face = slot.querySelector(".face");
        face.innerHTML = skeletonHTML();

        // 3) 開始輪動（只顯示一行文字，避免角標搞笑）
        slot.classList.add("spinning");
        const spinTimer = setInterval(()=>{
          const fake = BRAIN.drawRandomKIN();
          spinLine.textContent = `${BRAIN.getTone(fake).name} · ${BRAIN.getSeal(fake).name}`;
        }, 70);

        // 4) 跳動時間結束 → 停在正確 → 填牌 → 門退場
        setTimeout(()=>{
          clearInterval(spinTimer);
          spinLine.textContent = `${BRAIN.getTone(kin).name} · ${BRAIN.getSeal(kin).name}`;

          fillFace(face, kin);

          slot.classList.remove("spinning");
          slot.classList.add("revealed"); // ✅ 讓門收起退場
          slot.dataset.busy = "0";
        }, 980);

      }, 260);
    }
  </script>
</body>
</html>
