<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南方 · 金穗</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Palette: Deep Grandeur */
            --void: #120C08;
            --earth: #2A1F16;
            --gold-deep: #DDAA00;
            --gold-light: #FFD700;
            --pollen: #FFF6E0;
            --ember: #FF8800;

            /* Colors for Tones (Red Room Standard) */
            --kin-red: #A5413F;
            --kin-white: #CCCCCC;
            --kin-blue: #3D5A73;
            --kin-yellow: #DDAA00;

            --ease-grand: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--void);
            color: var(--pollen);
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === Background === */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 20%, rgba(221, 170, 0, 0.15) 0%, transparent 60%),
                linear-gradient(to bottom, #1a1208 0%, #0a0604 100%);
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .dust {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold-deep);
            border-radius: 50%;
            animation: float 10s infinite linear;
            opacity: 0.5;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* === SCENE MANAGER === */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 1s var(--ease-grand);
            transform: scale(0.95);
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
            z-index: 10;
        }

        /* === SCENE 1: COVER === */
        .cover-content {
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
        }

        .main-title {
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            background: linear-gradient(to bottom, #FFD700, #B8860B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(221, 170, 0, 0.4));
            margin-bottom: 0.5rem;
        }

        .sub-title {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            color: var(--gold-deep);
            font-weight: 700;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
        }

        .desc-text {
            font-size: 1rem;
            color: rgba(255, 246, 224, 0.8);
            letter-spacing: 0.1em;
            opacity: 0.8;
            max-width: 600px;
            margin-bottom: 4vh;
        }

        /* Grand Core (The Sun Forge) */
        .sun-forge {
            width: clamp(220px, 30vw, 280px);
            height: clamp(220px, 30vw, 280px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4vh;
            cursor: pointer;
        }

        .sf-base {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(221, 170, 0, 0.3);
            border-radius: 50%;
        }

        .sf-ring-1 {
            position: absolute;
            inset: -10px;
            border: 1px dashed rgba(221, 170, 0, 0.2);
            border-radius: 50%;
            animation: rot 30s linear infinite;
        }

        .sf-ring-2 {
            position: absolute;
            inset: 20px;
            border: 2px solid rgba(221, 170, 0, 0.1);
            border-radius: 50%;
            animation: rotRev 20s linear infinite;
        }

        .sf-core {
            width: 50%;
            height: 50%;
            border-radius: 50%;
            background: radial-gradient(circle, #FFD700 0%, #DDAA00 40%, transparent 80%);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
            animation: pulseCore 3s ease-in-out infinite;
            z-index: 5;
        }

        .enter-hints {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: var(--gold-deep);
            border-bottom: 1px solid var(--gold-deep);
            padding-bottom: 5px;
            opacity: 0;
            transition: 0.5s;
        }

        .sun-forge:hover+.enter-hints {
            opacity: 1;
        }

        .sun-forge:hover .sf-core {
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.8);
            transform: scale(1.1);
        }

        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotRev {
            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulseCore {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }


        /* === SCENE 2: GRAND SLOTS (SELECTION) === */
        .slots-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* The "Grand Slot" - Heavy, 3D */
        .grand-slot {
            flex: 1;
            min-width: 160px;
            max-width: 220px;
            height: 380px;
            background: rgba(30, 24, 18, 0.7);
            border: 1px solid rgba(221, 170, 0, 0.15);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.4s var(--ease-grand);
            backdrop-filter: blur(10px);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .grand-slot:hover {
            transform: translateY(-15px);
            border-color: var(--gold-deep);
            background: rgba(40, 32, 24, 0.9);
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(221, 170, 0, 0.2),
                inset 0 1px 0 rgba(221, 170, 0, 0.2);
        }

        .slot-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(221, 170, 0, 0.1) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            transition: 0.4s;
        }

        .grand-slot:hover .slot-icon-box {
            transform: scale(1.2);
            background: radial-gradient(circle, rgba(221, 170, 0, 0.2) 0%, transparent 70%);
        }

        .slot-icon {
            width: 40px;
            height: 40px;
            fill: var(--pollen);
            opacity: 0.6;
            transition: 0.4s;
        }

        .grand-slot:hover .slot-icon {
            fill: var(--gold-light);
            opacity: 1;
            filter: drop-shadow(0 0 10px var(--gold-deep));
        }

        .slot-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            color: var(--pollen);
            opacity: 0.6;
            transition: 0.4s;
            flex-grow: 1;
            text-align: center;
        }

        .grand-slot:hover .slot-title {
            color: var(--gold-light);
            opacity: 1;
            letter-spacing: 0.4em;
        }


        /* === SCENE 3: ORACLE CARD === */
        .card-stage {
            perspective: 1000px;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .card-grand {
            background: #F2E8D5;
            /* Parchment */
            width: min(400px, 90vw);
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow:
                0 0 0 12px #2A1F16,
                /* Dark rim */
                0 0 0 14px var(--gold-deep),
                /* Gold rim */
                0 50px 120px rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
            color: #2A1F16;
            opacity: 0;
            transform: rotateX(20deg) translateY(50px);
            animation: cardAppear 1s var(--ease-grand) forwards 0.2s;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: rotateX(0) translateY(0);
            }
        }

        /* TONE & GLYPH DISPLAY (RED ROOM LOGIC) */
        .visual-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tone-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dots-row {
            display: flex;
            gap: 8px;
        }

        .bars-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Classes assigned by JS based on color */
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .bar {
            width: 100px;
            height: 12px;
            border-radius: 12px;
            box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .bg-red {
            background-color: var(--kin-red);
        }

        .bg-white {
            background-color: var(--kin-white);
            border: 1px solid #CCC;
        }

        .bg-blue {
            background-color: var(--kin-blue);
        }

        .bg-yellow {
            background-color: var(--kin-yellow);
        }

        .seal-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        .kin-info-block {
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(165, 65, 63, 0.2);
            padding-bottom: 20px;
        }

        .kin-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #2A1F16;
            margin-bottom: 5px;
        }

        .kin-name {
            font-size: 1.2rem;
            font-weight: 900;
            color: #554433;
            letter-spacing: 0.1em;
        }

        .msg-box {
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-left: 4px solid var(--gold-deep);
            text-align: left;
            margin-bottom: 12px;
        }

        .msg-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: #886600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .msg-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            color: #2A1F16;
        }

        .btn-frame {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-g {
            padding: 12px 30px;
            border: 1px solid var(--gold-deep);
            color: var(--gold-deep);
            background: transparent;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-g:hover {
            background: rgba(221, 170, 0, 0.1);
            box-shadow: 0 0 20px rgba(221, 170, 0, 0.2);
        }

        /* --- History Wall --- */
        .history-wall {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            padding: 20px;
            border-left: 1px solid rgba(221, 170, 0, 0.2);
            display: none;
            /* Desktop only */
        }

        @media (min-width: 1000px) {
            .history-wall {
                display: block;
            }
        }

        .h-item {
            margin-bottom: 15px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .h-tag {
            color: var(--gold-deep);
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>

    <div class="bg-layer"></div>
    <div class="particles" id="particles"></div>

    <!-- Scene 1: Cover -->
    <section id="s1" class="scene active">
        <div class="cover-content">
            <div class="main-title">南方 · 金穗</div>
            <div class="sub-title">成熟、覺醒與豐盛的果實</div>

            <div class="sun-forge" onclick="toScene2()">
                <div class="sf-base"></div>
                <div class="sf-ring-1"></div>
                <div class="sf-ring-2"></div>
                <div class="sf-core"></div>
            </div>

            <div class="enter-hints">點擊進入</div>
            <div class="desc-text">整合走過的歷程，收穫屬於你的智慧與成果。</div>
        </div>
    </section>

    <!-- Scene 2: Selection -->
    <section id="s2" class="scene">
        <div class="sub-title" style="margin-bottom: 3rem;">選擇一座豐盛祭壇</div>
        <div class="slots-container" id="slots">
            <!-- Injected -->
        </div>
    </section>

    <!-- Scene 3: Oracle -->
    <section id="s3" class="scene">
        <div class="card-stage" id="oracle"></div>
        <div class="btn-frame">
            <button class="btn-g" onclick="toScene2()">再次收穫</button>
            <button class="btn-g" style="border-color:#666; color:#888;" onclick="clearHistory()">重置</button>
        </div>
    </section>

    <!-- Side History -->
    <div class="history-wall" id="history"></div>

    <script>
        // --- Data ---
        const THEMES = [
            { id: 'financial', name: '財務', path: 'M12,2L2,22h20L12,2z M12,6l6,12H6L12,6z' },
            { id: 'career', name: '事業', path: 'M20,6h-4V4c0-1.1-0.9-2-2-2h-4C8.9,2,8,2.9,8,4v2H4C2.9,6,2,6.9,2,8v11c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8C22,6.9,21.1,6,20,6z' },
            { id: 'relationship', name: '感情', path: 'M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z' },
            { id: 'health', name: '健康', path: 'M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V5C21,3.9,20.1,3,19,3z' },
            { id: 'growth', name: '成長', path: 'M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z' }
        ];

        // Minimal Kin Data Sample (User logic)
        const kinData = {
            "default": { "alignment": "回到內在，感受呼吸。", "grounding": "喝一杯溫水，感受水流經身體。" }
        };

        const GLYPH_COLORS = [
            'red', 'white', 'blue', 'yellow', // 1-4
            'red', 'white', 'blue', 'yellow', // 5-8
            'red', 'white', 'blue', 'yellow', // 9-12
            'red', 'white', 'blue', 'yellow', // 13-16
            'red', 'white', 'blue', 'yellow', // 17-20
        ];
        const GLYPH_NAMES = [
            '紅龍', '白風', '藍夜', '黃種子', '紅蛇', '白世界橋', '藍手', '黃星星', '紅月', '白狗',
            '藍猴', '黃人', '紅天行者', '白巫師', '藍鷹', '黃戰士', '紅地球', '白鏡', '藍風暴', '黃太陽'
        ];
        const TONE_NAMES = [
            '磁性', '月亮', '電力', '自我存在', '超頻', '韻律', '共鳴', '銀河', '太陽', '行星', '光譜', '水晶', '宇宙'
        ];

        let history = JSON.parse(localStorage.getItem('yHallHistory')) || [];

        function init() {
            // Particles
            const box = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const d = document.createElement('div');
                d.className = 'dust';
                d.style.left = Math.random() * 100 + 'vw';
                d.style.animationDelay = Math.random() * 5 + 's';
                box.appendChild(d);
            }

            // Slots
            const slotBox = document.getElementById('slots');
            slotBox.innerHTML = THEMES.map(t => `
        <div class="grand-slot" onclick="selectTheme('${t.id}', '${t.name}')">
          <div class="slot-icon-box">
            <svg class="slot-icon" viewBox="0 0 24 24"><path d="${t.path}"/></svg>
          </div>
          <div class="slot-title">${t.name}</div>
        </div>
      `).join('');
            renderHistory();
        }

        function toScene2() {
            switchS('s2');
        }

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectTheme(tid, tname) {
            const randKin = Math.floor(Math.random() * 260) + 1;

            // Logic (Red Room Standard)
            const toneId = (randKin - 1) % 13 + 1; // 1-13
            const glyphId = (randKin - 1) % 20 + 1; // 1-20
            const colorKey = GLYPH_COLORS[glyphId - 1]; // red/white/blue/yellow

            const bars = Math.floor(toneId / 5);
            const dots = toneId % 5;
            const colorClass = `bg-${colorKey}`;

            let dotsHTML = '';
            if (dots > 0) {
                dotsHTML = `<div class="dots-row">${Array(dots).fill(0).map(() => `<div class="dot ${colorClass}"></div>`).join('')}</div>`;
            }
            let barsHTML = '';
            if (bars > 0) {
                barsHTML = `<div class="bars-col">${Array(bars).fill(0).map(() => `<div class="bar ${colorClass}"></div>`).join('')}</div>`;
            }

            const glyphName = GLYPH_NAMES[glyphId - 1];
            const toneName = TONE_NAMES[toneId - 1];
            const fullName = `${toneName}的${glyphName}`;
            const sealPad = String(glyphId).padStart(2, '0');

            // Random Message
            const msgs = kinData[randKin] || kinData["default"];

            const stage = document.getElementById('oracle');
            stage.innerHTML = `
        <div class="card-grand">
          <div class="visual-stack">
            <div class="tone-display">
              ${dotsHTML} ${barsHTML}
            </div>
            <img class="seal-img" src="../images/${sealPad}.png" onerror="this.src='https://via.placeholder.com/150'">
          </div>
          
          <div class="kin-info-block">
            <div class="kin-title">KIN ${randKin}</div>
            <div class="kin-name">${fullName}</div>
          </div>
          
          <div class="msg-box">
             <div class="msg-label">Alignment 調頻</div>
             <div class="msg-text">${msgs.alignment}</div>
          </div>
          <div class="msg-box">
             <div class="msg-label">Grounding 落地</div>
             <div class="msg-text">${msgs.grounding}</div>
          </div>
          
          <div style="margin-top:20px; font-weight:700; color:#AA8800;">${tname}之指引</div>
        </div>
      `;

            // History
            const timestamp = new Date().toLocaleDateString();
            history.unshift({ date: timestamp, theme: tname, kin: randKin, name: fullName });
            if (history.length > 5) history.pop();
            localStorage.setItem('yHallHistory', JSON.stringify(history));
            renderHistory();

            switchS('s3');
        }

        function renderHistory() {
            const w = document.getElementById('history');
            if (history.length === 0) { w.innerHTML = ''; return; }
            w.innerHTML = history.map(h => `
        <div class="h-item">
          <span class="h-tag">[${h.theme}] ${h.date}</span>
          KIN ${h.kin} ${h.name}
        </div>
      `).join('');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('yHallHistory');
            renderHistory();
        }

        window.onload = init;
    </script>
</body>

</html>
