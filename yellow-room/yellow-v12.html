<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南方 · 金穗聖域</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@600;900&display=swap"
        rel="stylesheet">
    <script src="kinData.js"></script>
    <style>
        :root {
            /* Theme: The Golden Harvest */
            --bg-inner: #F3E5AB;
            /* Malt */
            --bg-mid: #D2B48C;
            /* Tan */
            --bg-outer: #5D4037;
            /* Dark Brown */

            --gold-light: #FFF8E1;
            --gold-main: #FFC107;
            --gold-dark: #FF8F00;
            --bronze: #8D6E63;

            --text-main: #4E342E;

            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #5D4037 0%, #3E2723 100%);
            /* Deep Earth base */
            color: #F5F5F5;
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Rich Texture Background */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E"),
                radial-gradient(circle at 50% 30%, #8D6E63 0%, #4E342E 40%, #291a14 100%);
            background-blend-mode: soft-light;
        }

        .gold-dust {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1px 1px at 10% 10%, rgba(255, 215, 0, 0.8), transparent),
                radial-gradient(2px 2px at 20% 30%, rgba(255, 215, 0, 0.6), transparent),
                radial-gradient(1px 1px at 80% 80%, rgba(255, 215, 0, 0.7), transparent);
            background-size: 200px 200px;
            animation: dustFloat 20s linear infinite;
        }

        /* Scene System */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s var(--ease-out), transform 1s var(--ease-out);
            transform: scale(0.95);
            z-index: 10;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* === Scene 1: Golden Harvest Cover === */

        .cover-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2vh;
            width: 100%;
            height: 100%;
            justify-content: center;
            padding: 20px;
        }

        /* Top Text */
        .title-area {
            margin-bottom: 20px;
        }

        .t-main {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: #FFECB3;
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
            margin-bottom: 15px;
        }

        .t-sub {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #D7CCC8;
            letter-spacing: 0.2em;
            font-weight: 600;
            opacity: 0.9;
        }

        .t-desc {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #A1887F;
            /* Muted earth */
            margin-top: 10px;
            letter-spacing: 0.1em;
            max-width: 600px;
            line-height: 1.6;
        }

        /* The Emblem (Energy Map) */
        .harvest-emblem-wrap {
            position: relative;
            width: clamp(220px, 45vw, 320px);
            height: clamp(220px, 45vw, 320px);
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Interactive Layers */
        .emblem-glow {
            position: absolute;
            inset: -10%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.2) 0%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .emblem-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: rotateRing 60s linear infinite;
        }

        /* The SVG Wheat Symbol */
        .wheat-svg {
            width: 80%;
            height: 80%;
            filter: drop-shadow(0 0 15px rgba(255, 160, 0, 0.8));
            transition: transform 0.5s var(--ease-elastic);
            fill: url(#goldGradient);
        }

        .harvest-emblem-wrap:hover .wheat-svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1));
        }

        /* Bottom Button (Updated Text) */
        .start-btn-frame {
            margin-top: 20px;
            padding: 15px 40px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.1) 50%, transparent 100%);
            color: #FFECB3;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.5s;
            font-family: 'Noto Serif TC', serif;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            position: relative;
            user-select: none;
        }

        .start-btn-frame:hover {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.25) 50%, transparent 100%);
            letter-spacing: 0.3em;
            text-shadow: 0 0 10px #FFC107;
            border-color: #FFD700;
        }

        /* === Scene 2: Selection (Updated Title) === */
        .sel-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .sel-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .sel-main {
            font-size: 1.8rem;
            color: #FFECB3;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
        }

        .sel-sub {
            font-size: 1rem;
            color: #D7CCC8;
            letter-spacing: 0.2em;
            opacity: 0.8;
        }

        .coin-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }

        .coin-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .coin-disc {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8D6E63, #4E342E);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, 0.2),
                inset -5px -5px 10px rgba(0, 0, 0, 0.6),
                0 10px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
            border: 2px solid #5D4037;
        }

        .coin-item:hover .coin-disc {
            transform: translateY(-5px);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, 0.3),
                inset -5px -5px 10px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(255, 193, 7, 0.4);
            border-color: #FFC107;
        }

        .coin-svg {
            width: 50px;
            height: 50px;
            fill: #FFD54F;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
        }

        .coin-label {
            font-size: 1.1rem;
            color: #D7CCC8;
            letter-spacing: 0.2em;
        }

        .coin-item:hover .coin-label {
            color: #FFC107;
        }

        /* === Scene 3: Oracle === */
        .oracle-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .spin-count {
            font-size: 4rem;
            font-family: 'Cinzel';
            color: #FFB300;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .connect-btn {
            background: #FFB300;
            color: #3E2723;
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.4);
            transition: 0.3s;
        }

        .connect-btn:hover {
            background: #FFCA28;
            box-shadow: 0 0 40px rgba(255, 179, 0, 0.6);
        }

        .card-final {
            background: #F4EBD9;
            /* Parchment */
            color: #3E2723;
            padding: 40px;
            border-radius: 12px;
            width: min(360px, 90vw);
            text-align: center;
            display: none;
            animation: popUp 0.8s var(--ease-elastic);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .card-final.show {
            display: block;
        }

        .nav-row {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            display: none;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #FFCA28;
            color: #FFCA28;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: #FFCA28;
            color: #3E2723;
        }

        /* V8 Logic Styles */
        .tone-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 5px;
        }

        .tone-bars {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .t-dot {
            width: 12px;
            height: 12px;
            background: #3E2723;
            border-radius: 50%;
        }

        .t-bar {
            width: 60px;
            height: 8px;
            background: #3E2723;
            border-radius: 4px;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        @keyframes dustFloat {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 200px 200px;
            }
        }

        @keyframes popUp {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes rotateRing {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile tweaks */
        @media(max-width: 600px) {
            .coin-grid {
                gap: 15px;
            }

            .coin-disc {
                width: 80px;
                height: 80px;
            }

            .coin-svg {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer"></div>
    <div class="gold-dust"></div>

    <!-- SVG Definitions -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#FFECB3;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#FFC107;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
            </linearGradient>
            <!-- Wheat Symbol SVG -->
            <symbol id="icon-wheat" viewBox="0 0 100 100">
                <!-- Center Stalk -->
                <path d="M50,90 C50,90 50,20 50,20" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"
                    fill="none" />
                <!-- Left Leaves -->
                <path d="M50,70 C30,60 30,40 50,30" fill="url(#goldGradient)" />
                <path d="M50,55 C35,45 35,35 50,25" fill="url(#goldGradient)" />
                <path d="M50,40 C40,35 40,30 50,22" fill="url(#goldGradient)" />
                <!-- Right Leaves -->
                <path d="M50,70 C70,60 70,40 50,30" fill="url(#goldGradient)" />
                <path d="M50,55 C65,45 65,35 50,25" fill="url(#goldGradient)" />
                <path d="M50,40 C60,35 60,30 50,22" fill="url(#goldGradient)" />
                <!-- Circle Frame -->
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
                <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldGradient)" stroke-width="1"
                    stroke-dasharray="2 4" />
            </symbol>
        </defs>
    </svg>

    <!-- Scene 1: Harvest Cover -->
    <section id="s_gate" class="scene active" onclick="goSelection()">
        <div class="cover-content">
            <div class="title-area">
                <div class="t-main">南方 · 金穗</div>
                <div class="t-sub">成熟、覺醒與鞏固的果實</div>
            </div>

            <div class="harvest-emblem-wrap">
                <div class="emblem-glow"></div>
                <div class="emblem-ring"></div>
                <svg class="wheat-svg">
                    <use href="#icon-wheat"></use>
                </svg>
            </div>

            <div class="t-desc">
                整合走過的旅程，<br>收穫屬於你的智慧與成果
            </div>

            <!-- Changed Text Here -->
            <div class="start-btn-frame">
                開啟豐盛之門
            </div>
        </div>
    </section>

    <!-- Scene 2: Selection (New Titles) -->
    <section id="s_selection" class="scene">
        <div class="sel-container">
            <div class="sel-header">
                <div class="sel-main">五大生命金鑰</div>
                <div class="sel-sub">點擊共時金幣 · 領取宇宙指引</div>
            </div>

            <div class="coin-grid">
                <!-- Coins -->
                <div class="coin-item" onclick="start('financial', '財務')">
                    <div class="coin-disc">
                        <svg class="coin-svg" viewBox="0 0 24 24">
                            <path d="M12,2L2,22h20L12,2z M12,6l6,12H6L12,6z" />
                        </svg>
                    </div>
                    <div class="coin-label">財務</div>
                </div>
                <div class="coin-item" onclick="start('career', '事業')">
                    <div class="coin-disc">
                        <svg class="coin-svg" viewBox="0 0 24 24">
                            <path
                                d="M20,6h-4V4c0-1.1-0.9-2-2-2h-4C8.9,2,8,2.9,8,4v2H4C2.9,6,2,6.9,2,8v11c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8C22,6.9,21.1,6,20,6z" />
                        </svg>
                    </div>
                    <div class="coin-label">事業</div>
                </div>
                <div class="coin-item" onclick="start('relationship', '感情')">
                    <div class="coin-disc">
                        <svg class="coin-svg" viewBox="0 0 24 24">
                            <path
                                d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" />
                        </svg>
                    </div>
                    <div class="coin-label">感情</div>
                </div>
                <div class="coin-item" onclick="start('health', '健康')">
                    <div class="coin-disc">
                        <svg class="coin-svg" viewBox="0 0 24 24">
                            <path
                                d="M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V5C21,3.9,20.1,3,19,3z" />
                        </svg>
                    </div>
                    <div class="coin-label">健康</div>
                </div>
                <div class="coin-item" onclick="start('growth', '成長')">
                    <div class="coin-disc">
                        <svg class="coin-svg" viewBox="0 0 24 24">
                            <path d="M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z" />
                        </svg>
                    </div>
                    <div class="coin-label">成長</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scene 3: Oracle -->
    <section id="s_oracle" class="scene">
        <div class="oracle-layout">
            <div id="minigame" style="text-align:center;">
                <div id="spinNum" class="spin-count">1</div>
                <button class="connect-btn" onclick="reveal()">接引指引...</button>
            </div>

            <div id="card" class="card-final">
                <!-- Content -->
            </div>

            <div id="nav" class="nav-row">
                <button class="nav-btn" onclick="goHome()">回首頁</button>
                <button class="nav-btn" onclick="goSel()">再選一次</button>
            </div>
        </div>
    </section>

    <script>
        let interval = null;
        let theme = '';

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goSelection() { switchS('s_selection'); }
        function goHome() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_gate');
        }
        function goSel() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_selection');
        }

        function start(tid, tname) {
            theme = tname;
            switchS('s_oracle');
            document.getElementById('minigame').style.display = 'block';
            document.getElementById('card').style.display = 'none';
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                document.getElementById('spinNum').innerText = Math.floor(Math.random() * 260) + 1;
            }, 50);
        }

        function reveal() {
            clearInterval(interval);
            const kin = Math.floor(Math.random() * 260) + 1;

            const toneId = (kin - 1) % 13 + 1;
            const glyphId = (kin - 1) % 20 + 1;
            const sealPad = String(glyphId).padStart(2, '0');
            const toneNames = ['磁性', '月亮', '電力', '自我存在', '超頻', '韻律', '共鳴', '銀河', '太陽', '行星', '光譜', '水晶', '宇宙'];
            const glyphNames = ['紅龍', '白風', '藍夜', '黃種子', '紅蛇', '白世界橋', '藍手', '黃星星', '紅月', '白狗', '藍猴', '黃人', '紅天行者', '白巫師', '藍鷹', '黃戰士', '紅地球', '白鏡', '藍風暴', '黃太陽'];

            /* Render Tone */
            const dots = toneId % 5;
            const bars = Math.floor(toneId / 5);
            let tHtml = '';
            if (dots > 0) { tHtml += `<div class="tone-dots">${Array(dots).fill('<div class="t-dot"></div>').join('')}</div>`; }
            if (bars > 0) { tHtml += `<div class="tone-bars">${Array(bars).fill('<div class="t-bar"></div>').join('')}</div>`; }

            const data = (typeof kinData !== 'undefined' && kinData[kin]) ? kinData[kin] : { alignment: '...', grounding: '...' };

            const c = document.getElementById('card');
            c.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:15px; margin-bottom:20px; border-bottom:1px solid #ccc; padding-bottom:15px;">
                    <div style="display:flex; flex-direction:column; gap:6px;">${tHtml}</div>
                    <img src="../images/${sealPad}.png" style="width:100px; height:100px; object-fit:contain;" onerror="this.src='https://via.placeholder.com/100'">
                </div>
                <div style="font-family:'Cinzel'; color:#8D6E63; font-weight:700;">KIN ${kin}</div>
                <div style="font-size:1.5rem; font-weight:900; color:#3E2723; margin-bottom:20px;">${toneNames[toneId - 1]}的${glyphNames[glyphId - 1]}</div>
                
                <div style="text-align:left; background:rgba(0,0,0,0.05); padding:15px 20px; border-radius:8px; margin-bottom:15px;">
                    <div style="font-size:0.8rem; font-weight:700; color:#8D6E63; margin-bottom:5px;">調頻 GUIDANCE</div>
                    <div style="color:#4E342E;">${data.alignment}</div>
                </div>
                <div style="text-align:left; border-left:3px solid #8D6E63; padding-left:15px;">
                    <div style="font-size:0.8rem; font-weight:700; color:#8D6E63; margin-bottom:5px;">落地 GROUNDING</div>
                    <div style="color:#4E342E;">${data.grounding}</div>
                </div>
                <div style="margin-top:20px; font-size:0.8rem; color:#aaa; letter-spacing:0.2em;">✦ ${theme}指引 ✦</div>
            `;

            document.getElementById('minigame').style.display = 'none';
            c.style.display = 'block';
            c.classList.add('show');
            document.getElementById('nav').style.display = 'flex';
        }
    </script>
</body>

</html>
