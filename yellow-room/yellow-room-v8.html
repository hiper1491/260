<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃色小屋 V8 - 收穫與指引</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-malt: #D4A76A;
      --gold-amber: #B8860B;
      --bg-stone: #1C1812;
      --card-bg: #F2E6D0;
      --text-dark: #2A1B0D;
      --transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
      --light-gold: #F4E4B5;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background-color: var(--bg-stone); 
      color: var(--gold-malt); 
      font-family: 'Noto Serif TC', serif; 
      overflow-x: hidden; 
      min-height: 100vh;
    }

    /* 場景控制 */
    .scene { 
      position: fixed; 
      inset: 0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      opacity: 0; 
      pointer-events: none; 
      transition: var(--transition); 
      z-index: 10; 
      padding: 20px; 
      overflow-y: auto;
    }
    
    .scene.active { 
      opacity: 1; 
      pointer-events: all; 
      position: relative;
    }

    /* ===== 第一幕：門檻 (Gate) ===== */
    #scene-gate { 
      background: radial-gradient(circle at 50% 40%, #2A241B 0%, #110E0A 100%); 
      z-index: 100; 
    }
    
    .gate-content { 
      text-align: center; 
    }
    
    .gate-title { 
      font-family: 'Cinzel', serif; 
      font-size: clamp(2.2rem, 8vw, 3.5rem); 
      letter-spacing: 0.8rem; 
      margin-bottom: 1.5rem; 
      text-shadow: 0 0 20px rgba(212, 167, 106, 0.4); 
    }
    
    .gate-desc { 
      line-height: 2.2; 
      opacity: 0.8; 
      margin-bottom: 4rem; 
      font-size: 1.1rem; 
    }
    
    .gate-trigger { 
      width: 120px; 
      height: 120px; 
      border: 1px solid var(--gold-amber); 
      border-radius: 50%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 0 40px rgba(184, 134, 11, 0.2); 
      animation: gatePulse 4s infinite;
      background: rgba(180, 134, 11, 0.05);
    }
    
    .gate-trigger:hover { 
      box-shadow: 0 0 60px rgba(184, 134, 11, 0.4); 
    }

    /* ===== 第二幕：聖殿 (Sanctuary) ===== */
    #scene-sanctuary { 
      background-image: radial-gradient(circle at 50% 50%, #2a2215 0%, #1c1812 100%); 
      justify-content: flex-start; 
      padding-top: 8vh; 
    }
    
    .sanctuary-header { 
      text-align: center; 
      margin-bottom: 4rem; 
    }
    
    .sanctuary-header h2 { 
      letter-spacing: 0.5rem; 
      font-family: 'Cinzel', serif; 
      margin-bottom: 10px; 
      font-size: 2.5rem;
    }
    
    .sanctuary-header p { 
      opacity: 0.6; 
      letter-spacing: 0.2rem; 
    }
    
    .stamps-grid { 
      display: flex; 
      justify-content: center; 
      gap: 40px; 
      flex-wrap: wrap; 
      max-width: 1100px; 
      padding-bottom: 100px; 
    }
    
    .stamp-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      cursor: pointer; 
      background: none; 
      border: none; 
      width: 160px; 
      transition: 0.4s; 
      padding: 20px;
    }
    
    .stamp-item:hover { 
      transform: translateY(-8px); 
    }
    
    .stamp-body { 
      width: 130px; 
      height: 130px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #3d3121, #1a1208); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-bottom: 20px; 
      border: 1px solid rgba(212, 167, 106, 0.2); 
      box-shadow: inset 8px 8px 16px rgba(0,0,0,0.9), 
                  inset -2px -2px 5px rgba(255,255,255,0.05), 
                  0 15px 30px rgba(0,0,0,0.6); 
    }
    
    .stamp-svg { 
      width: 65%; 
      height: 65%; 
      fill: var(--gold-malt); 
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); 
      transition: 0.3s; 
      opacity: 0.9; 
    }
    
    .stamp-item:hover .stamp-svg { 
      filter: drop-shadow(0 0 10px var(--gold-amber)); 
      transform: scale(1.05); 
    }
    
    .stamp-name { 
      color: var(--gold-malt); 
      font-weight: 600; 
      letter-spacing: 0.3rem; 
      font-size: 1.2rem; 
    }

    /* ===== 第三幕：呼吸引導 (Breathe) ===== */
    .breathe-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .focus-seal { 
      width: 180px; 
      height: 180px; 
      border-radius: 50%; 
      background: var(--gold-amber); 
      box-shadow: 0 0 80px var(--gold-amber); 
      animation: ritualBreathe 5s infinite; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .focus-svg { 
      width: 60%; 
      height: 60%; 
      fill: #1a1208; 
    }
    
    .breathe-text { 
      font-size: 1.4rem; 
      letter-spacing: 0.6rem; 
      color: var(--gold-malt); 
      text-align: center;
      max-width: 500px;
    }

    /* ===== 第四幕：神諭卡片 (Oracle) ===== */
    #scene-oracle {
      padding: 60px 20px;
    }

    .oracle-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
      width: 100%;
    }

    .oracle-card { 
      background-color: var(--card-bg); 
      background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
      width: 100%; 
      max-width: 500px; 
      padding: 50px 40px; 
      border-radius: 12px; 
      border: 2px solid #D4A76A; 
      box-shadow: 0 30px 70px rgba(0,0,0,0.9); 
      color: var(--text-dark); 
      position: relative;
    }
    
    /* 調性顯示 */
    .card-tone-container { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      margin-bottom: 30px; 
      min-height: 50px;
    }
    
    .tone-dots-row { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 6px;
    }
    
    .tone-bars-stack { 
      display: flex; 
      flex-direction: column; 
      gap: 6px;
    }
    
    .tone-dot { 
      width: 14px; 
      height: 14px; 
      background: #2A1B0D; 
      border-radius: 50%; 
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2);
    }
    
    .tone-bar { 
      width: 75px; 
      height: 12px; 
      background: #2A1B0D; 
      border-radius: 6px; 
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2);
    }
    
    /* 圖騰 */
    .card-seal-box { 
      width: 140px; 
      height: 140px; 
      margin: 0 auto 30px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    
    .card-seal-box img { 
      width: 100%; 
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
    }
    
    /* KIN 資訊 */
    .card-kin-info { 
      margin-bottom: 40px; 
      text-align: center;
    }
    
    .kin-number { 
      font-family: 'Cinzel', serif; 
      font-weight: 700; 
      font-size: 2.5rem; 
      color: #2A1B0D;
      margin-bottom: 5px;
    }
    
    .kin-text { 
      font-weight: 900; 
      letter-spacing: 0.1rem; 
      font-size: 1.2rem; 
      opacity: 0.9;
    }

    /* ===== 文案權重強化 ===== */
    .guide-section { 
      margin-bottom: 35px; 
      text-align: left; 
      position: relative; 
      padding-left: 30px;
    }
    
    .guide-section::before { 
      content: ''; 
      position: absolute; 
      left: 0; 
      top: 5px; 
      bottom: 5px; 
      width: 4px; 
      background: var(--gold-amber); 
      border-radius: 2px;
    }
    
    .section-label { 
      font-size: 0.9rem; 
      font-weight: 700; 
      opacity: 0.7; 
      margin-bottom: 8px; 
      text-transform: uppercase; 
      letter-spacing: 0.05rem;
      color: #2A1B0D;
    }
    
    /* 調頻建議 - 強化 */
    .alignment-content { 
      font-size: 1.8rem; 
      font-weight: 900; 
      color: #1a1204; 
      line-height: 1.5;
      background: linear-gradient(135deg, rgba(244, 228, 181, 0.6), rgba(212, 167, 106, 0.3));
      padding: 20px;
      border-radius: 8px;
      border-left: 5px solid var(--gold-amber);
    }
    
    /* 落地行動 - 強化 */
    .grounding-content { 
      font-size: 1.8rem; 
      font-weight: 900; 
      color: #1a1204; 
      line-height: 1.5;
      background: linear-gradient(135deg, rgba(244, 228, 181, 0.6), rgba(212, 167, 106, 0.3));
      padding: 20px;
      border-radius: 8px;
      border-left: 5px solid var(--gold-amber);
    }

    /* 智慧金句 */
    .wisdom-quote {
      margin-top: 40px;
      padding: 20px;
      background: rgba(244, 228, 181, 0.3);
      border-radius: 8px;
      font-style: italic;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #2A1B0D;
      text-align: center;
      border-top: 2px solid var(--gold-amber);
    }

    /* ===== 歷史紀錄牆 ===== */
    .history-wall {
      width: 100%;
      max-width: 500px;
      margin-top: 2rem;
      padding: 20px;
      background: rgba(42, 27, 13, 0.5);
      border: 1px solid rgba(212, 167, 106, 0.2);
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .history-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2rem;
      margin-bottom: 15px;
      opacity: 0.8;
      text-align: center;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(212, 167, 106, 0.1);
      border-radius: 4px;
      font-size: 0.95rem;
      border-left: 3px solid var(--gold-malt);
    }

    .history-kin {
      font-weight: 700;
      color: var(--gold-amber);
    }

    .history-theme {
      font-size: 0.85rem;
      opacity: 0.7;
      padding: 3px 8px;
      background: rgba(212, 167, 106, 0.2);
      border-radius: 3px;
    }

    /* ===== 按鈕 ===== */
    .action-btn { 
      padding: 18px 60px; 
      background: linear-gradient(to bottom, #D4A76A, #B8860B); 
      color: #1a1204; 
      border: 1px solid #F2E6D0; 
      font-family: 'Noto Serif TC', serif; 
      font-weight: 900; 
      font-size: 1.2rem; 
      letter-spacing: 0.4rem; 
      cursor: pointer; 
      border-radius: 4px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      text-shadow: 0 1px 0 rgba(255,255,255,0.3);
      transition: all 0.3s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .action-btn.secondary {
      background: none;
      border: 2px solid var(--gold-malt);
      color: var(--gold-malt);
      box-shadow: none;
    }

    /* ===== 動畫 ===== */
    @keyframes gatePulse { 
      0%, 100% { transform: scale(1); opacity: 0.6; } 
      50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 60px rgba(184, 134, 11, 0.4); } 
    }
    
    @keyframes ritualBreathe { 
      0%, 100% { transform: scale(1); opacity: 0.8; } 
      50% { transform: scale(1.08); opacity: 1; } 
    }

    /* ===== 響應式設計 ===== */
    @media (max-width: 600px) {
      .stamps-grid { 
        flex-direction: column; 
        align-items: center; 
        gap: 30px; 
      }
      
      .stamp-item { 
        width: 100%; 
      }
      
      .gate-title { 
        font-size: 2.2rem; 
      }

      .oracle-card {
        max-width: 90vw;
        padding: 30px 20px;
      }

      .alignment-content,
      .grounding-content {
        font-size: 1.4rem;
      }
    }

    /* 滾動條美化 */
    .history-wall::-webkit-scrollbar {
      width: 6px;
    }

    .history-wall::-webkit-scrollbar-track {
      background: rgba(212, 167, 106, 0.1);
      border-radius: 3px;
    }

    .history-wall::-webkit-scrollbar-thumb {
      background: var(--gold-malt);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- ===== 第一幕：門檻 ===== -->
  <section id="scene-gate" class="scene active">
    <div class="gate-content">
      <h1 class="gate-title">南方·金禾</h1>
      <p class="gate-desc">成熟、覺醒與豐盛的果實<br>整合走過的歷程，收穫屬於你的智慧與成果</p>
      <div style="display: flex; justify-content: center;">
        <div class="gate-trigger" onclick="switchScene('scene-sanctuary')">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 第二幕：聖殿 ===== -->
  <section id="scene-sanctuary" class="scene">
    <div class="sanctuary-header">
      <h2>黃色小屋</h2>
      <p>收穫與指引 · Guidance Room</p>
    </div>
    <div class="stamps-grid" id="stampsGrid"></div>
  </section>

  <!-- ===== 第三幕：呼吸引導 ===== -->
  <section id="scene-breathe" class="scene">
    <div class="breathe-container">
      <div class="focus-seal" id="breatheSeal"></div>
      <p class="breathe-text" id="breatheText">請深呼吸，穩定心念</p>
      <button class="action-btn" onclick="revealOracle()">獲取豐盛指引</button>
    </div>
  </section>

  <!-- ===== 第四幕：神諭卡片 ===== -->
  <section id="scene-oracle" class="scene">
    <div class="oracle-container">
      <div class="oracle-card" id="oracleCard"></div>
      
      <div class="history-wall">
        <div class="history-title">最近 5 次抽牌</div>
        <div id="historyList"></div>
      </div>

      <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <button class="action-btn" onclick="switchScene('scene-sanctuary')">回小屋繼續收穫</button>
        <button class="action-btn secondary" onclick="clearHistory()">清空歷史</button>
      </div>
    </div>
  </section>

  <!-- kinData 內聯 -->
  <script>
    const kinData = {
      "1": {"synchronicMessage": "今天很適合回到最基本的事：先把自己照顧好。你越願意穩住生活的根，新的開始越容易長出來。","highFrequency": "","lowFrequency": "","alignment": "做一件最簡單的滋養：好好吃一餐／補水／提早睡，三選一；並把「我需要____」說出口。","grounding": "準備一份簡單但你真正想吃的食物；吃的時候不滑手機，專心進食。"},

      "3": {"synchronicMessage": "今天很適合把心裡的願景拉回現實：不是空想，而是找到『今天能做的那一步』。你會突然知道怎麼開始。","highFrequency": "","lowFrequency": "","alignment": "把想做的事寫成一句話，再加上一個 10 分鐘能完成的小步驟；做完就停，先讓動能起來。","grounding": "午睡或閉眼休息 10–15 分鐘，即使沒有睡著也沒關係。"},
      "4": {"synchronicMessage": "今天的關鍵是『變清楚』：你想做的事如果沒有形狀，就會一直拖著你。越明確，越省力。","highFrequency": "","lowFrequency": "","alignment": "替一件事定義完成標準：做到哪裡算完成？寫下來，今天只要朝那個標準前進。","grounding": "照顧一株植物：澆水、修剪或換位置。"},
      "5": {"synchronicMessage": "今天別用意志硬扛，身體其實一直在提醒你：什麼是想要、什麼是勉強。你越誠實，越能掌握節奏。","highFrequency": "","lowFrequency": "","alignment": "做 3 分鐘伸展或快走；問自己：我真正想要的是什麼？把第一個答案先記下來。","grounding": "完整伸展或瑜伽 10 分鐘，讓身體發熱。"},
      "6": {"synchronicMessage": "今天很適合做交接與收尾。你一旦把該結束的結束，心裡就會突然鬆，路也會跟著變順。","highFrequency": "","lowFrequency": "","alignment": "挑一件拖太久的事，今天就決定：完成／取消／交出去；做一個明確的結束動作。","grounding": "清空一個資料夾或信箱分類。"},
      "7": {"synchronicMessage": "今天你會發現：不是想通才會好轉，是做完才會好轉。把一件小事完成，整個人就會回到正軌。","highFrequency": "","lowFrequency": "","alignment": "選一件最小可完成的待辦，把它做完並打勾；完成後給自己 1 分鐘的『我做到了』。","grounding": "把一件拖延已久的事情做到『完成』。"},
      "8": {"synchronicMessage": "今天很看『一致性』：你喜歡的生活長什麼樣，從你怎麼整理細節就看得出來。你不必完美，但要舒服。","highFrequency": "","lowFrequency": "","alignment": "整理一個角落到「一眼看過去很舒服」；刪掉一個讓你分心的雜訊（通知/分頁/物品）。","grounding": "為空間加一個美的元素：花、香、光線。"},

      "10": {"synchronicMessage": "今天在提醒你：真正的在乎不是一直付出，而是把心放在值得的地方，也包括你自己。","highFrequency": "","lowFrequency": "","alignment": "做一件『把自己放回第一順位』的小事；同時設定一條小界線：今天我不再____。","grounding": "傳一則真誠關心的訊息給一個人。"},
      "11": {"synchronicMessage": "今天如果你越緊繃，越容易卡住；反而一放鬆，靈感就回來。你不需要更嚴肅，你需要更靈活。","highFrequency": "","lowFrequency": "","alignment": "給自己 20 分鐘純放鬆（音樂/走路/整理也算）；把壓力事改成「先做 5 分鐘」。","grounding": "做一件不為效率的小事：拼東西、哼歌。"},
      "12": {"synchronicMessage": "今天很適合做『自己的選擇』。你怎麼選，別人就怎麼被你影響。自由最迷人的是：你願意承擔。","highFrequency": "","lowFrequency": "","alignment": "做一個你一直拖的決定：我選擇____；我願意承擔____。寫下來就算生效。","grounding": "立刻行動完成一個你剛做出的選擇。"},
      "13": {"synchronicMessage": "今天別把自己關小了。你需要一點探索、一點空間感，心才會醒來。走出去，答案會跟上。","highFrequency": "","lowFrequency": "","alignment": "做一個小探險：換路走/換地方工作/去沒去過的店；重點是離開原本的軌道一下。","grounding": "去一個你平常不會停留的地方走走。"},
      "14": {"synchronicMessage": "今天最有用的不是衝，而是『在場』。你越安定，事情越好處理；你越急，越容易亂。","highFrequency": "","lowFrequency": "","alignment": "做一件慢慢做的事 10 分鐘（泡茶/整理/寫字）；過程中不滑手機。","grounding": "靜坐 5–10 分鐘，不改變任何狀態。"},
      "15": {"synchronicMessage": "今天在考驗你的『界線感』。別人的急不是你的急，你的步調不需要跟著別人跑。慢一點，反而更到位。","highFrequency": "","lowFrequency": "","alignment": "把今天一件「做得有點勉強」的事取消或延後；用省下的時間做你真正想做的。","grounding": "在你的空間裡點一支香或蠟燭，做一個『進入自己時間』的儀式。"},
      "16": {"synchronicMessage": "今天能量很銳利，但別拿來攻擊自己。你想改變的東西，只需要你的堅持，不需要你的憤怒。","highFrequency": "","lowFrequency": "","alignment": "把「我必須改變____」改成「我選擇朝____前進」；感受兩句話的不同。","grounding": "衝刺性地完成一個你拖最久的小任務。"},
      "17": {"synchronicMessage": "今天很適合『把心放下來』：你不需要什麼都擔起來，也不需要什麼都扛著走。一個人的力量足夠了。","highFrequency": "","lowFrequency": "","alignment": "列出今天的「必做」，其他的都 okay；專注在最重要的 3 件。","grounding": "去走一段路，讓身體帶著心走。"},
      "18": {"synchronicMessage": "今天在提醒你：你看到的真相往往不是全部真相，反射出的是你內在的一面鏡子。柔和一點，會看得更清。","highFrequency": "","lowFrequency": "","alignment": "對一件今天發生的事，試著從「別人的角度」解釋一次；你可能會發現新的可能。","grounding": "擦鏡子或清潔一面鏡子，象徵清晰視野。"},
      "19": {"synchronicMessage": "今天的能量是『蛻變前的混亂』。不是出問題了，是在轉變。讓它發生，新的樣子就快出現了。","highFrequency": "","lowFrequency": "","alignment": "承認「我現在還不是最終版本」；給自己一點混亂的空間。","grounding": "做一些「破壞」的事：丟掉、整理、清空不要的東西。"},
      "20": {"synchronicMessage": "今天很適合『開啟』某個東西。不管是計畫、關係、還是自己的一個新面向，時機到了。","highFrequency": "","lowFrequency": "","alignment": "問自己：我準備好打開什麼了？寫下來，今天就做第一步。","grounding": "開啟一件新的嘗試：新的課程、新的地方、新的習慣。"}
    };

    // 主題與智慧金句
    const THEMES = [
      { id: 'financial', name: '財務', path: 'M12,2L2,22h20L12,2z M12,6l6,12H6L12,6z M12,9l3,6H9L12,9z' },
      { id: 'career', name: '事業', path: 'M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6s6,2.69,6,6S15.31,18,12,18z M12,14c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S13.1,14,12,14z' },
      { id: 'relationship', name: '感情', path: 'M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z' },
      { id: 'health', name: '健康', path: 'M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6s6,2.69,6,6S15.31,18,12,18z M12,6c-2.21,0-4,1.79-4,4s1.79,4,4,4s4-1.79,4-4S14.21,6,12,6z' },
      { id: 'growth', name: '成長', path: 'M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6s6,2.69,6,6S15.31,18,12,18z M12,9l-2,4l2,4l2-4L12,9z' }
    ];

    const wisdomQuotes = {
      financial: [
        "豐盛不是擁有很多，而是對現在有的真誠感謝。",
        "金錢是能量的流動，流動的關鍵不是金額，而是信念。",
        "收穫的前提是你曾經播種。相信自己值得，世界就會回應。",
        "財務自由始於自己的選擇，而不是他人的給予。"
      ],
      career: [
        "你的天賦就是你的通行證，但你的堅持才是你的門票。",
        "最好的工作不是為了金錢，而是為了活著時能看到自己的價值。",
        "使命感來自於每一個細節的用心，不是來自於宏大的計畫。",
        "事業的高度，取決於你願意為那個目標付出的代價。"
      ],
      relationship: [
        "最深的連結來自於『我看見你』，而不是『我需要你』。",
        "愛一個人，不是要改變他，而是看見他本來的樣子然後還願意靠近。",
        "關係中最珍貴的不是時間長度，而是你們在一起時有多清晰。",
        "真正的親密是：你不需要假裝，就能被完全接納。"
      ],
      health: [
        "身體是靈魂在地球上的居所，善待它就是善待自己。",
        "健康不是沒有症狀，而是你每一刻都能感受到自己活著。",
        "照顧身體就是照顧未來的自己，今天的選擇就是明天的收穫。",
        "最好的藥不是吃什麼，而是停止做傷害自己的事。"
      ],
      growth: [
        "成長的痛來自於你在拓展，而不是你做錯了什麼。",
        "蛻變總是看起來像失敗，直到你看見新翅膀。",
        "你不是在改正自己，而是在找到更大的你。",
        "最快的成長發生在你停止抗拒改變的時候。"
      ]
    };

    let currentThemeData = null;
    let history = JSON.parse(localStorage.getItem('yellowRoomHistory')) || [];

    function init() {
      const grid = document.getElementById('stampsGrid');
      grid.innerHTML = THEMES.map(t => `
        <button class="stamp-item" onclick="startBreathe('${t.id}')">
          <div class="stamp-body">
            <svg class="stamp-svg" viewBox="0 0 24 24">
              <path d="${t.path}" />
            </svg>
          </div>
          <span class="stamp-name">${t.name}</span>
        </button>
      `).join('');
      updateHistoryDisplay();
    }

    function switchScene(id) {
      document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startBreathe(themeId) {
      currentThemeData = THEMES.find(t => t.id === themeId);
      document.getElementById('breatheText').innerText = `重心 [${currentThemeData.name}]，請深呼吸...`;
      document.getElementById('breatheSeal').innerHTML = `
        <svg class="focus-svg" viewBox="0 0 24 24">
          <path d="${currentThemeData.path}" />
        </svg>
      `;
      switchScene('scene-breathe');
    }

    function revealOracle() {
      const randomKin = Math.floor(Math.random() * 260) + 1;
      const kd = kinData[randomKin];
      
      if (!kd) {
        alert('KIN 資料不完整，請檢查');
        return;
      }

      const tone = ((randomKin - 1) % 13) + 1;
      const sealNum = ((randomKin - 1) % 20) + 1;
      const sealPad = sealNum.toString().padStart(2, '0');

      // 調性顯示
      const bars = Math.floor(tone / 5);
      const dots = tone % 5;
      
      let dotsHtml = '';
      if (dots > 0) {
        dotsHtml = '<div class="tone-dots-row">';
        for(let i=0; i<dots; i++) dotsHtml += '<div class="tone-dot"></div>';
        dotsHtml += '</div>';
      }
      
      let barsHtml = '';
      if (bars > 0) {
        barsHtml = '<div class="tone-bars-stack">';
        for(let i=0; i<bars; i++) barsHtml += '<div class="tone-bar"></div>';
        barsHtml += '</div>';
      }

      // 隨機智慧金句
      const quotes = wisdomQuotes[currentThemeData.id];
      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

      const card = document.getElementById('oracleCard');
      card.innerHTML = `
        <div class="card-tone-container">
          ${dotsHtml}
          ${barsHtml}
        </div>
        <div class="card-seal-box">
          <img src="../images/${sealPad}.png" onerror="this.src='https://via.placeholder.com/100?text=KIN+${randomKin}'" alt="KIN ${randomKin}">
        </div>
        <div class="card-kin-info">
          <div class="kin-number">KIN ${randomKin}</div>
          <p class="kin-text">[${currentThemeData.name}] 的豐盛顯化</p>
        </div>
        
        <div class="guide-section">
          <p class="section-label">調頻建議 Alignment</p>
          <div class="alignment-content">${kd.alignment}</div>
        </div>
        
        <div class="guide-section">
          <p class="section-label">落地行動 Grounding</p>
          <div class="grounding-content">${kd.grounding}</div>
        </div>

        <div class="wisdom-quote">✦ ${randomQuote} ✦</div>
      `;

      // 保存到歷史
      saveToHistory(randomKin, currentThemeData.name);
      switchScene('scene-oracle');
    }

    function saveToHistory(kin, theme) {
      const now = new Date();
      const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      
      history.unshift({
        kin: kin,
        theme: theme,
        date: dateStr
      });

      // 只保留最近 5 次
      if (history.length > 5) {
        history = history.slice(0, 5);
      }

      localStorage.setItem('yellowRoomHistory', JSON.stringify(history));
      updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
      const historyList = document.getElementById('historyList');
      
      if (history.length === 0) {
        historyList.innerHTML = '<div style="opacity: 0.5; text-align: center;">還沒有抽牌記錄</div>';
        return;
      }

      historyList.innerHTML = history.map((item, idx) => `
        <div class="history-item">
          <div>
            <span class="history-kin">KIN ${item.kin}</span>
          </div>
          <div class="history-theme">${item.theme}</div>
          <div style="font-size: 0.85rem; opacity: 0.6;">${item.date}</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm('確定要清空所有抽牌歷史嗎？')) {
        history = [];
        localStorage.removeItem('yellowRoomHistory');
        updateHistoryDisplay();
      }
    }

    window.onload = init;
  </script>
