<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南方 · 金穗聖域</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@600;900&display=swap"
        rel="stylesheet">
    <script src="kinData.js"></script>
    <style>
        :root {
            /* Theme: The Golden Sanctuary */
            /* Background: Warm Malt -> Limestone -> Earth */
            --bg-inner: #F3E5AB;
            /* Malt/Vanilla */
            --bg-mid: #D2B48C;
            /* Tan/Limestone */
            --bg-outer: #8B4513;
            /* Saddle Brown */

            --stone-light: #E8DCC5;
            --stone-dark: #C2B280;

            --metal-bronze: #cd7f32;
            --metal-gold: #FFD700;
            --metal-shadow: #8B5A2B;

            --text-main: #5D4037;
            /* Brown/coffee */
            --text-accent: #8D6E63;

            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 40%, var(--bg-inner), var(--bg-mid), var(--bg-outer));
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Texture Overlay */
        .texture {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .halo {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* === Scene System === */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out);
            transform: scale(0.95);
            z-index: 10;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* === Scene 1: The Gate (Reiki Symbol) === */
        .gate-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            cursor: pointer;
        }

        /* The Reiki Orb */
        .gate-orb {
            width: clamp(200px, 40vw, 280px);
            height: clamp(200px, 40vw, 280px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.8s var(--ease-out);
        }

        .orb-light {
            position: absolute;
            inset: -20%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.6) 0%, transparent 70%);
            animation: pulseLight 5s ease-in-out infinite;
            border-radius: 50%;
        }

        /* The Power Symbol (Cho Ku Rei) - SVG */
        .reiki-symbol {
            width: 80%;
            height: 80%;
            fill: none;
            stroke: #FFD700;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
            animation: drawPath 3s ease-out forwards, glowPulse 4s infinite alternate;
            opacity: 0.9;
        }

        .gate-wrapper:hover .gate-orb {
            transform: scale(1.05);
        }

        .gate-wrapper:hover .orb-light {
            background: radial-gradient(circle, rgba(255, 223, 0, 0.8) 0%, transparent 70%);
        }

        .title-group {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: #5D4037;
            letter-spacing: 0.15em;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5);
            background: linear-gradient(to bottom, #795548, #3E2723);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-desc {
            font-size: 1.1rem;
            color: #795548;
            letter-spacing: 0.2em;
            font-weight: 600;
            opacity: 0.8;
            margin-top: 10px;
        }

        .hint-pulse {
            margin-top: 2rem;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            color: #8D6E63;
            animation: fadeHint 3s infinite;
        }


        /* === Scene 2: The Selection (3D Coins in Wall) === */
        .selection-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            gap: 2rem;
            padding: 20px;
        }

        .sel-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sel-h1 {
            font-size: 1.8rem;
            color: #4E342E;
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
        }

        /* Centered Coin Grid */
        .coin-wall {
            display: flex;
            gap: clamp(20px, 4vw, 40px);
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1000px;
        }

        /* The 3D Coin Button */
        .coin-btn {
            width: clamp(100px, 18vw, 140px);
            height: clamp(100px, 18vw, 140px);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);

            /* Deep Inset Shadow (Pressed into Wall) */
            background: #D7CCC8;
            /* Wall color base */
            box-shadow:
                inset 8px 8px 16px rgba(62, 39, 35, 0.4),
                /* Deep shadow top-left */
                inset -5px -5px 12px rgba(255, 255, 255, 0.8),
                /* Highlight bottom-right */
                5px 10px 20px rgba(0, 0, 0, 0.1);
            /* External shadow */

            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .coin-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                inset 6px 6px 12px rgba(62, 39, 35, 0.3),
                inset -4px -4px 10px rgba(255, 255, 255, 0.9),
                0 15px 30px rgba(184, 134, 11, 0.2);
            /* Golden glow */
        }

        .coin-content {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            /* Metal embossing effect */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: 0.3s;
        }

        .coin-btn:hover .coin-content {
            opacity: 1;
            transform: scale(1.1);
        }

        .coin-icon {
            width: 60%;
            height: 60%;
            fill: #5D4037;
            /* Dark Bronze */
            filter: drop-shadow(1px 1px 0 rgba(255, 255, 255, 0.4));
        }

        .coin-label {
            position: absolute;
            bottom: -40px;
            font-size: 1.1rem;
            color: #5D4037;
            font-weight: 700;
            letter-spacing: 0.2em;
            opacity: 0.7;
            transition: 0.3s;
        }

        .coin-btn:hover+.coin-label,
        .coin-label:hover {
            /* Sibling selector might be tricky with absolute positioning inside flex */
            opacity: 1;
            color: #8B4513;
        }

        /* Better Structure: Wrap coin and label */
        .coin-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .coin-wrapper:hover .coin-label {
            opacity: 1;
            transform: translateY(-2px);
        }

        /* === Scene 3: The Oracle (Red House Standards) === */

        .oracle-stage {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Spin Area */
        .spin-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .spin-counter {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            color: #8D6E63;
            opacity: 0.5;
            font-weight: 900;
        }

        .ritual-btn {
            padding: 18px 50px;
            background: linear-gradient(135deg, #BCAAA4 0%, #8D6E63 100%);
            /* Wood/Stone tone */
            color: #F5F5F5;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            letter-spacing: 0.2em;
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(93, 64, 55, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .ritual-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .ritual-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(139, 69, 19, 0.4);
            background: linear-gradient(135deg, #A1887F 0%, #6D4C41 100%);
        }

        .ritual-btn:hover::before {
            transform: translateX(100%);
        }

        /* The Card Frame */
        .oracle-card {
            background: #F4EBD9;
            /* Parchment */
            width: min(380px, 90vw);
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow:
                0 30px 80px rgba(62, 39, 35, 0.4),
                inset 0 0 0 1px rgba(184, 134, 11, 0.1);
            text-align: center;
            display: none;
            /* Hidden initially */
            animation: unroll 1s var(--ease-elastic);
            margin-bottom: 30px;
        }

        .oracle-card.show {
            display: block;
        }

        /* TONE/GLYPH LAYOUT (RED HOUSE LOGIC) */
        /* Exact replication: Tone Top (Dots horizontal, Bars vertical), Glyph below. */

        .visual-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(141, 110, 99, 0.2);
        }

        /* Tone Blocks */
        .tone-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .dots-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            /* Red House uses 6px-8px */
        }

        .t-dot {
            width: 14px;
            height: 14px;
            background: #3E2723;
            /* Dark Coffee/Black */
            border-radius: 50%;
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.3);
        }

        .bars-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .t-bar {
            width: 70px;
            height: 10px;
            background: #3E2723;
            border-radius: 6px;
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.3);
        }

        /* Glyph */
        .kin-glyph {
            width: 110px;
            height: 110px;
            object-fit: contain;
            /* Direct manifestation, no box */
            filter: drop-shadow(0 6px 12px rgba(93, 64, 55, 0.25));
        }

        /* Text info */
        .kin-number {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #8D6E63;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
        }

        .kin-name {
            font-size: 1.8rem;
            font-weight: 900;
            color: #3E2723;
            letter-spacing: 0.12em;
            margin-bottom: 30px;
        }

        /* Guide Text */
        .guide-block {
            text-align: left;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(141, 110, 99, 0.05);
            /* very subtle tint */
            border-left: 3px solid #8D6E63;
            border-radius: 0 8px 8px 0;
        }

        .g-head {
            font-size: 0.8rem;
            font-weight: 900;
            color: #8D6E63;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            display: block;
        }

        .g-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #4E342E;
            font-weight: 600;
        }

        /* Navigation Buttons (Elegant) */
        .nav-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 10px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #8D6E63;
            color: #5D4037;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #8D6E63;
            color: #fff;
            box-shadow: 0 5px 15px rgba(141, 110, 99, 0.3);
        }

        /* Footer Stamp */
        .theme-stamp {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #A1887F;
            letter-spacing: 0.2em;
            font-style: italic;
        }

        /* Mobile Stack Fix */
        @media(max-width: 768px) {
            .coin-wall {
                flex-direction: column;
                /* Or grid */
                align-items: center;
                gap: 15px;
            }

            .coin-wrapper {
                /* for mobile list view */
                flex-direction: row;
                width: 80%;
                background: rgba(255, 255, 255, 0.1);
                padding: 10px 20px;
                border-radius: 50px;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .coin-btn {
                width: 60px;
                height: 60px;
                box-shadow: inset 3px 3px 8px rgba(62, 39, 35, 0.4);
            }

            .coin-label {
                position: static;
                color: #5D4037;
                opacity: 1;
                margin-left: 20px;
            }
        }

        /* Animations */
        @keyframes rotateSlow {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseLight {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        @keyframes fadeHint {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.8;
            }
        }

        @keyframes unroll {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(0 0 5px #FFD700);
            }

            100% {
                filter: drop-shadow(0 0 20px #FFD700);
            }
        }

        @keyframes drawPath {
            0% {
                stroke-dasharray: 1000;
                stroke-dashoffset: 1000;
            }

            100% {
                stroke-dasharray: 1000;
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Layers -->
    <div class="texture"></div>
    <div class="halo"></div>

    <!-- Scene 1: Sanctuary Gate -->
    <section id="s_gate" class="scene active" onclick="goSelection()">
        <div class="gate-wrapper">
            <div class="gate-orb">
                <div class="orb-light"></div>
                <!-- Reiki Symbol (Cho Ku Rei - Power Symbol) -->
                <svg class="reiki-symbol" viewBox="0 0 100 100">
                    <!-- Spiral of Power -->
                    <path d="M30,20 L80,20 L80,90 L50,90 C40,90 35,85 35,75 C35,65 40,60 50,60 C60,60 65,65 65,75" />
                    <!-- Vertical Line -->
                    <line x1="50" y1="20" x2="50" y2="80" stroke-width="4" stroke-linecap="round" opacity="0.6" />
                </svg>
            </div>

            <div class="title-group">
                <h1 class="main-title">南方 · 金穗</h1>
                <div class="sub-desc">THE GOLDEN SANCTUARY</div>
            </div>

            <div class="hint-pulse">點擊光球 · 啟動連結</div>
        </div>
    </section>

    <!-- Scene 2: Selection (Wall of Coins) -->
    <section id="s_selection" class="scene">
        <div class="selection-container">
            <div class="sel-header">
                <div class="sel-h1">選擇一座豐盛祭壇</div>
                <div style="font-size:0.9rem; letter-spacing:0.1em; color:#8D6E63; opacity:0.8;">請依直覺觸碰</div>
            </div>

            <div class="coin-wall">
                <!-- Coins -->
                <div class="coin-wrapper" onclick="startRitual('financial', '財務')">
                    <div class="coin-btn">
                        <svg class="coin-icon" viewBox="0 0 24 24">
                            <path d="M12,2L2,22h20L12,2z M12,6l6,12H6L12,6z" />
                        </svg>
                    </div>
                    <div class="coin-label">財務</div>
                </div>

                <div class="coin-wrapper" onclick="startRitual('career', '事業')">
                    <div class="coin-btn">
                        <svg class="coin-icon" viewBox="0 0 24 24">
                            <path
                                d="M20,6h-4V4c0-1.1-0.9-2-2-2h-4C8.9,2,8,2.9,8,4v2H4C2.9,6,2,6.9,2,8v11c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8C22,6.9,21.1,6,20,6z" />
                        </svg>
                    </div>
                    <div class="coin-label">事業</div>
                </div>

                <div class="coin-wrapper" onclick="startRitual('relationship', '感情')">
                    <div class="coin-btn">
                        <svg class="coin-icon" viewBox="0 0 24 24">
                            <path
                                d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" />
                        </svg>
                    </div>
                    <div class="coin-label">感情</div>
                </div>

                <div class="coin-wrapper" onclick="startRitual('health', '健康')">
                    <div class="coin-btn">
                        <svg class="coin-icon" viewBox="0 0 24 24">
                            <path
                                d="M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V5C21,3.9,20.1,3,19,3z" />
                        </svg>
                    </div>
                    <div class="coin-label">健康</div>
                </div>

                <div class="coin-wrapper" onclick="startRitual('growth', '成長')">
                    <div class="coin-btn">
                        <svg class="coin-icon" viewBox="0 0 24 24">
                            <path d="M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z" />
                        </svg>
                    </div>
                    <div class="coin-label">成長</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scene 3: Oracle (Card & Ritual) -->
    <section id="s_oracle" class="scene">
        <div class="oracle-stage">

            <!-- Spin Zone -->
            <div id="spinZone" class="spin-zone">
                <div class="spin-counter" id="spinNum">1</div>
                <button class="ritual-btn" onclick="stopAndReveal()">連結頻率...</button>
            </div>

            <!-- The Card -->
            <div id="oracleCard" class="oracle-card">
                <!-- Injected JS -->
            </div>

            <!-- Nav -->
            <div id="navActions" class="nav-actions" style="display:none;">
                <button class="nav-btn" onclick="goHome()">回首頁</button>
                <button class="nav-btn" onclick="goSelection()">再選一次</button>
            </div>

        </div>
    </section>

    <script>
        /* Logic */
        let spinInterval = null;
        let currentTheme = null;

        const TONE_NAMES = ['磁性', '月亮', '電力', '自我存在', '超頻', '韻律', '共鳴', '銀河', '太陽', '行星', '光譜', '水晶', '宇宙'];
        const GLYPH_NAMES = ['紅龍', '白風', '藍夜', '黃種子', '紅蛇', '白世界橋', '藍手', '黃星星', '紅月', '白狗', '藍猴', '黃人', '紅天行者', '白巫師', '藍鷹', '黃戰士', '紅地球', '白鏡', '藍風暴', '黃太陽'];

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            setTimeout(() => document.getElementById(id).classList.add('active'), 100);
        }

        function goSelection() { switchS('s_selection'); }
        function goHome() {
            document.getElementById('oracleCard').classList.remove('show');
            document.getElementById('navActions').style.display = 'none';
            switchS('s_gate');
        }

        function startRitual(tid, tname) {
            currentTheme = { id: tid, name: tname };
            switchS('s_oracle');

            // Reset
            document.getElementById('spinZone').style.display = 'flex';
            document.getElementById('oracleCard').classList.remove('show');
            document.getElementById('navActions').style.display = 'none';

            if (spinInterval) clearInterval(spinInterval);
            spinInterval = setInterval(() => {
                document.getElementById('spinNum').innerText = Math.floor(Math.random() * 260) + 1;
            }, 50);
        }

        function stopAndReveal() {
            clearInterval(spinInterval);
            const kin = Math.floor(Math.random() * 260) + 1;
            renderCard(kin);
        }

        function renderCard(kin) {
            const toneId = (kin - 1) % 13 + 1;
            const glyphId = (kin - 1) % 20 + 1;
            const sealPad = String(glyphId).padStart(2, '0');

            // Render Tone (Red House Standard: Dots Top, Bars Bottom)
            const bars = Math.floor(toneId / 5);
            const dots = toneId % 5;

            let toneHtml = '';
            if (dots > 0) toneHtml += `<div class="dots-row">${Array(dots).fill('<div class="t-dot"></div>').join('')}</div>`;
            if (bars > 0) toneHtml += `<div class="bars-col">${Array(bars).fill('<div class="t-bar"></div>').join('')}</div>`;

            // Data
            const data = (typeof kinData !== 'undefined' && kinData[kin]) ? kinData[kin] : {
                alignment: "請靜心感受當下，宇宙正在為你校準。",
                grounding: "喝一杯溫水，感受雙腳踩在地面的支持。"
            };

            const html = `
                <div class="visual-stack">
                    <div class="tone-group">${toneHtml}</div>
                    <img class="kin-glyph" src="../images/${sealPad}.png" onerror="this.src='https://via.placeholder.com/110'">
                </div>

                <div class="kin-number">KIN ${kin}</div>
                <div class="kin-name">${TONE_NAMES[toneId - 1]}的${GLYPH_NAMES[glyphId - 1]}</div>

                <div class="guide-block">
                    <span class="g-head">Alignment · 調頻</span>
                    <div class="g-body">${data.alignment}</div>
                </div>

                <div class="guide-block">
                    <span class="g-head">Grounding · 落地</span>
                    <div class="g-body">${data.grounding}</div>
                </div>

                <div class="theme-stamp">
                    ✦ ${currentTheme.name}指引 ✦
                </div>
            `;

            const card = document.getElementById('oracleCard');
            card.innerHTML = html;

            document.getElementById('spinZone').style.display = 'none';
            card.classList.add('show');
            document.getElementById('navActions').style.display = 'flex';
        }
    </script>
</body>

</html>
