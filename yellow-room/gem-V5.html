<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南方 · 金穗聖域 Gem-V15</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme: #B39B59;      /* 金穗主題色 */
      --bg: #F9F8E8;         /* 羊皮紙底色 */
      --stone: #1C1812;      /* 深沉石室 */
      --malt: #D4A76A;       /* 麥芽金 */
      --themeRGB: 179, 155, 89;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--stone);
      background-image: radial-gradient(circle at 50% 50%, #2a2215 0%, #1c1812 100%);
      color: var(--malt);
      font-family: 'Noto Serif TC', serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 場景控制 */
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    .scene.active { opacity: 1; pointer-events: all; }

    /* --- 第一幕：封面 (啟動儀式) --- */
    .pre-symbol {
      width: clamp(160px, 40vw, 220px);
      height: clamp(160px, 40vw, 220px);
      cursor: pointer;
      position: relative;
      margin-bottom: 2rem;
    }
    .pre-hunab {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 15px rgba(212, 167, 106, 0.4));
      animation: rotate-slow 25s linear infinite;
    }
    @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    .pre-title { font-family: 'Cinzel', serif; font-size: 3rem; letter-spacing: 0.6rem; color: var(--malt); margin-bottom: 1rem; }
    .pre-hint { font-size: 1.1rem; letter-spacing: 0.3rem; opacity: 0.7; }

    /* --- 第二幕：聖域選單 (3D 門章) --- */
    #scene-selection { justify-content: flex-start; padding-top: 10vh; }
    .stamps-path {
      display: flex;
      flex-direction: column;
      gap: 3vh;
      width: 100%;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    @media (min-width: 768px) { .stamps-path { flex-direction: row; gap: 40px; } }

    .stamp-btn {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.3s ease;
    }
    .stamp-btn:hover { transform: translateY(-5px); }

    .stamp-circle {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3d3121, #1a1208);
      border: 1px solid rgba(212, 167, 106, 0.2);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
      /* 強制 3D 壓印質感 */
      box-shadow: 
        inset 6px 6px 15px rgba(0,0,0,0.9), 
        inset -2px -2px 8px rgba(255,255,255,0.05),
        0 10px 25px rgba(0,0,0,0.6);
    }
    .stamp-icon { width: 55%; opacity: 0.8; filter: drop-shadow(0 2px 4px #000); }
    .stamp-label { color: var(--malt); font-weight: 700; letter-spacing: 0.3rem; font-size: 1.2rem; }

    /* --- 第三幕：過場定頻 --- */
    .breathe-seal { width: 140px; height: 140px; border-radius: 50%; background: var(--malt); box-shadow: 0 0 50px var(--malt); margin-bottom: 3rem; animation: breathe 4s infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
    
    .connect-btn {
      padding: 15px 50px; background: var(--malt); color: var(--stone);
      border: none; border-radius: 4px; font-family: 'Noto Serif TC', serif;
      font-weight: 900; font-size: 1.2rem; letter-spacing: 0.4rem; cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* --- 第四幕：指引顯化 (正統規格) --- */
    .oracle-card {
      background-color: var(--bg);
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      width: min(400px, 90vw);
      padding: 40px 30px;
      border-radius: 12px;
      color: #111;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }

    /* 調性：點在上、槓在下 */
    .tone-display { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 25px; }
    .tone-dots { display: flex; gap: 10px; }
    .tone-dot { width: 18px; height: 18px; background: #000; border-radius: 50%; }
    .tone-bar { width: 80px; height: 10px; background: #000; border-radius: 5px; margin-bottom: 6px; }

    /* 圖騰：無白框、無邊線 */
    .seal-area { width: 140px; height: 140px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
    .seal-img { width: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.15)); }

    .kin-id { font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
    .kin-name { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.2rem; margin-bottom: 30px; }

    .guide-box { text-align: left; border-left: 4px solid var(--malt); padding-left: 20px; margin-bottom: 25px; }
    .guide-label { font-size: 0.85rem; font-weight: 700; opacity: 0.6; margin-bottom: 6px; }
    .guide-text { font-size: 1.5rem; font-weight: 900; line-height: 1.4; color: #000; }

    .nav-buttons { display: flex; gap: 15px; margin-top: 30px; }
    .nav-btn {
      padding: 10px 25px; border: 1px solid var(--malt); background: none;
      color: var(--malt); font-family: 'Noto Serif TC', serif; border-radius: 4px;
      cursor: pointer; transition: 0.3s;
    }
    .nav-btn:hover { background: var(--malt); color: var(--stone); }
  </style>
</head>

<body>

  <section id="scene-gate" class="scene active">
    <div class="pre-symbol" onclick="switchScene('scene-selection')">
      <img src="../images/hunab-ku.png" class="pre-hunab" alt="Hunab Ku">
    </div>
    <h1 class="pre-title">南方 · 金穗</h1>
    <p class="pre-hint">點擊圖騰，開啟收穫儀式</p>
  </section>

  <section id="scene-selection" class="scene">
    <h2 style="font-family: 'Cinzel', serif; letter-spacing: 0.4rem; margin-bottom: 5vh;">黃色小屋聖域</h2>
    <div class="stamps-path">
      <button class="stamp-btn" onclick="prepareBreathe('財務')">
        <div class="stamp-circle"><span>💰</span></div>
        <span class="stamp-label">財務</span>
      </button>
      <button class="stamp-btn" onclick="prepareBreathe('事業')">
        <div class="stamp-circle"><span>💼</span></div>
        <span class="stamp-label">事業</span>
      </button>
      <button class="stamp-btn" onclick="prepareBreathe('感情')">
        <div class="stamp-circle"><span>💕</span></div>
        <span class="stamp-label">感情</span>
      </button>
      <button class="stamp-btn" onclick="prepareBreathe('健康')">
        <div class="stamp-circle"><span>🌿</span></div>
        <span class="stamp-label">健康</span>
      </button>
      <button class="stamp-item" onclick="prepareBreathe('成長')">
        <div class="stamp-circle"><span>🌱</span></div>
        <span class="stamp-label">成長</span>
      </button>
    </div>
  </section>

  <section id="scene-breathe" class="scene">
    <div class="breathe-seal"></div>
    <p id="breathe-msg" style="font-size: 1.3rem; letter-spacing: 0.5rem; margin-bottom: 3rem;">請深呼吸，穩定心念</p>
    <button class="connect-btn" onclick="revealOracle()">連結頻率...</button>
  </section>

  <section id="scene-oracle" class="scene">
    <div class="oracle-card" id="card-content">
      </div>
    <div class="nav-buttons">
      <button class="nav-btn" onclick="location.reload()">回首頁</button>
      <button class="nav-btn" onclick="switchScene('scene-selection')">再選一次</button>
    </div>
  </section>

  <script>
    let currentTheme = "";

    function switchScene(id) {
      document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function prepareBreathe(theme) {
      currentTheme = theme;
      document.getElementById('breathe-msg').innerText = `針對 [${theme}]，連結你的頻率...`;
      switchScene('scene-breathe');
    }

    function revealOracle() {
      const kin = Math.floor(Math.random() * 260) + 1;
      const toneId = (kin - 1) % 13 + 1;
      const glyphId = (kin - 1) % 20 + 1;
      
      const dots = toneId % 5;
      const bars = Math.floor(toneId / 5);

      let toneHtml = `<div class="tone-display"><div class="tone-dots">`;
      for(let i=0; i<dots; i++) toneHtml += `<div class="tone-dot"></div>`;
      toneHtml += `</div><div class="tone-bars">`;
      for(let i=0; i<bars; i++) toneHtml += `<div class="tone-bar"></div>`;
      toneHtml += `</div></div>`;

      const card = document.getElementById('card-content');
      card.innerHTML = `
        ${toneHtml}
        <div class="seal-area">
          <img src="../images/${String(glyphId + 1).padStart(2, '0')}.png" class="seal-img" onerror="this.src='https://via.placeholder.com/140?text=Seal'">
        </div>
        <div class="kin-id">KIN ${kin}</div>
        <div class="kin-name">藍鷹波 · 行星的藍鷹</div> <div class="guide-box">
          <p class="guide-label">調頻建議 ALIGNMENT</p>
          <div class="guide-text">聽從第一時間的身體反應</div>
        </div>
        <div class="guide-box">
          <p class="guide-label">落地行動 GROUNDING</p>
          <div class="guide-text">進行伸展運動，讓能量流動</div>
        </div>
        <p style="font-size:0.8rem; opacity:0.5; letter-spacing:2px;">✦ ${currentTheme}之鑰 · 豐盛顯化 ✦</p>
      `;
      switchScene('scene-oracle');
    }
  </script>
</body>
</html>
