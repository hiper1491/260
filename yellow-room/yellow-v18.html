<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南方 · 金穗聖域 v18</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@600;900&display=swap"
        rel="stylesheet">
    <script src="kinData.js"></script>
    <script src="../core/tone-scale.js"></script>
    <style>
        :root {
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #1A120A 0%, #0D0906 100%);
            color: #F5F5F5;
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 神廟石牆 background */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"),
                radial-gradient(ellipse 120% 80% at 50% 30%, #2A1F15 0%, #140E08 60%, #0A0604 100%);
        }

        /* 頂部聖光 */
        .divine-light {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 60%;
            background: radial-gradient(ellipse 60% 40% at 50% 0%,
                    rgba(255, 180, 80, 0.12) 0%,
                    rgba(255, 150, 50, 0.05) 40%,
                    transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scenes */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s var(--ease-out), transform 1s var(--ease-out);
            transform: scale(0.95);
            z-index: 10;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* Scene 1: Cover */
        .cover-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2vh;
            padding: 20px;
        }

        .t-main {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: #FFECB3;
            letter-spacing: 0.15em;
            text-shadow: 0 0 30px rgba(255, 180, 80, 0.5);
            margin-bottom: 10px;
        }

        .t-sub {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #BFA980;
            letter-spacing: 0.2em;
            font-weight: 600;
        }

        .t-desc {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #8B7355;
            margin-top: 10px;
            letter-spacing: 0.1em;
            max-width: 500px;
            line-height: 1.8;
        }

        .harvest-emblem-wrap {
            position: relative;
            width: clamp(200px, 40vw, 280px);
            height: clamp(200px, 40vw, 280px);
            margin: 30px 0;
            cursor: pointer;
        }

        .emblem-glow {
            position: absolute;
            inset: -30%;
            background: radial-gradient(circle, rgba(255, 170, 60, 0.25) 0%, transparent 60%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .wheat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(255, 160, 60, 0.6));
            transition: transform 0.5s var(--ease-elastic);
        }

        .harvest-emblem-wrap:hover .wheat-svg {
            transform: scale(1.08);
        }

        .start-btn-frame {
            margin-top: 20px;
            padding: 15px 40px;
            border: 1px solid rgba(255, 200, 100, 0.3);
            background: linear-gradient(90deg, transparent, rgba(255, 180, 80, 0.1), transparent);
            color: #FFECB3;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s;
            font-family: 'Noto Serif TC', serif;
        }

        .start-btn-frame:hover {
            background: linear-gradient(90deg, transparent, rgba(255, 180, 80, 0.2), transparent);
            border-color: rgba(255, 200, 100, 0.6);
            text-shadow: 0 0 15px rgba(255, 200, 100, 0.8);
        }

        /* =============================================
           Scene 2: 五大金鑰
           ============================================= */

        .sel-container {
            display: flex;
            flex-direction: column;
            gap: 50px;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .sel-header {
            text-align: center;
        }

        .sel-main {
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            color: #FFECB3;
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            text-shadow: 0 0 25px rgba(255, 180, 80, 0.4);
        }

        .sel-sub {
            font-size: 1rem;
            color: #9C8060;
            letter-spacing: 0.3em;
        }

        .medallion-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1000px;
        }

        .medallion-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            position: relative;
            transition: transform 0.4s var(--ease-out);
        }

        .medallion-item:hover {
            transform: translateY(-8px);
        }

        /* 神聖背光 */
        .medallion-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -55%);
            background: radial-gradient(circle,
                    rgba(255, 160, 60, 0.5) 0%,
                    rgba(255, 130, 40, 0.3) 25%,
                    rgba(255, 100, 20, 0.15) 45%,
                    transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(8px);
            transition: all 0.5s ease;
        }

        .medallion-item:hover .medallion-aura {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle,
                    rgba(255, 170, 70, 0.65) 0%,
                    rgba(255, 140, 50, 0.4) 25%,
                    rgba(255, 110, 30, 0.2) 45%,
                    transparent 65%);
        }

        /* 徽章主容器 */
        .medallion-wrap {
            width: 150px;
            height: 150px;
            position: relative;
            z-index: 1;
        }

        .medallion-svg {
            width: 100%;
            height: 100%;
            display: block;
            /* 讓 SVG 內部元素可以吃到些許陰影 */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        }

        /* 標籤 */
        .medallion-label {
            font-size: 1.4rem;
            color: #A08060;
            letter-spacing: 0.3em;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .medallion-item:hover .medallion-label {
            color: #E8C896;
            text-shadow: 0 0 20px rgba(255, 200, 120, 0.5), 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* 手機版 */
        @media (max-width: 600px) {
            .medallion-row {
                gap: 28px;
            }

            .medallion-wrap {
                width: 110px;
                height: 110px;
            }

            .medallion-aura {
                width: 150px;
                height: 150px;
            }

            .medallion-item:hover .medallion-aura {
                width: 170px;
                height: 170px;
            }

            .medallion-label {
                font-size: 1.1rem;
                letter-spacing: 0.2em;
            }
        }

        /* Scene 3: Oracle */
        .oracle-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
            max-height: 100vh;
            overflow-y: auto;
        }

        .spin-count {
            font-size: 4rem;
            font-family: 'Cinzel';
            color: #FFB300;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255, 180, 60, 0.6);
        }

        .connect-btn {
            background: linear-gradient(180deg, #FFB300 0%, #E69500 100%);
            color: #3E2723;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.2rem;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 179, 0, 0.4), 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }

        .connect-btn:hover {
            background: linear-gradient(180deg, #FFCA28 0%, #FFB300 100%);
            box-shadow: 0 0 50px rgba(255, 179, 0, 0.6), 0 4px 20px rgba(0, 0, 0, 0.4);
            transform: scale(1.02);
        }

        .card-final {
            --glyph: 100px;
            background: linear-gradient(180deg, #FAF3E6 0%, #F0E6D2 100%);
            color: #3E2723;
            padding: 30px;
            border-radius: 16px;
            width: min(400px, 92vw);
            text-align: center;
            display: none;
            animation: popUp 0.8s var(--ease-elastic);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 180, 80, 0.15);
        }

        .card-final.show {
            display: block;
        }

        /* 比例語法 */
        .card-final .tone-dots {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
            gap: var(--tone-gap-dotdot, 8px);
        }

        .card-final .tone-bars {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--tone-gap-barbar, 6px);
        }

        .card-final .tone-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--tone-gap-rowrow, 6px);
            margin-bottom: 12px;
        }

        .card-final .tone-area.no-dots .tone-dots {
            display: none;
        }

        .card-final .t-dot {
            width: var(--tone-dot-size, 12px);
            height: var(--tone-dot-size, 12px);
            background: #3E2723;
            border-radius: 50%;
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-final .t-bar {
            width: var(--tone-bar-w, 106px);
            height: var(--tone-bar-h, 9px);
            background: #3E2723;
            border-radius: calc(var(--tone-bar-h, 9px)/2);
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-final .glyph-img {
            width: var(--glyph);
            height: var(--glyph);
            object-fit: contain;
        }

        .card-block {
            text-align: left;
            background: rgba(0, 0, 0, 0.04);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .card-block-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #8D6E63;
            margin-bottom: 5px;
            letter-spacing: 0.1em;
        }

        .card-block-text {
            color: #4E342E;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .card-block-border {
            text-align: left;
            border-left: 3px solid #8D6E63;
            padding-left: 15px;
            margin-bottom: 12px;
        }

        .nav-row {
            margin-top: 30px;
            display: none;
            gap: 20px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #FFCA28;
            color: #FFCA28;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #FFCA28;
            color: #3E2723;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes popUp {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer"></div>
    <div class="divine-light"></div>

    <svg style="position:absolute;width:0;height:0;overflow:hidden;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFECB3" />
                <stop offset="50%" stop-color="#FFC107" />
                <stop offset="100%" stop-color="#FF8F00" />
            </linearGradient>

            <radialGradient id="bronzeBase" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#CA9C65" />
                <stop offset="30%" stop-color="#8B6914" />
                <stop offset="60%" stop-color="#5C4510" />
                <stop offset="100%" stop-color="#2A1E0A" />
            </radialGradient>

            <linearGradient id="symbolGold" x1="20%" y1="10%" x2="80%" y2="90%">
                <stop offset="0%" stop-color="#FFD700" />
                <stop offset="50%" stop-color="#FDB931" />
                <stop offset="100%" stop-color="#9E7C0C" />
            </linearGradient>

            <!-- 3D Bronze Filter -->
            <filter id="embossedBronze" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" result="displaced" />
                <feDiffuseLighting in="displaced" lighting-color="#FFF8E8" surfaceScale="5" diffuseConstant="1"
                    result="diffuse">
                    <feDistantLight azimuth="225" elevation="45" />
                </feDiffuseLighting>
                <feComposite in="diffuse" in2="SourceGraphic" operator="in" result="diffuseIn" />
                <feComposite in="diffuseIn" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"
                    result="lit" />
            </filter>

            <!-- Inner Shadow for Recess -->
            <filter id="innerShadow">
                <feOffset dx="2" dy="2" />
                <feGaussianBlur stdDeviation="3" result="offset-blur" />
                <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
                <feFlood flood-color="black" flood-opacity="0.8" result="color" />
                <feComposite operator="in" in="color" in2="inverse" result="shadow" />
                <feComposite operator="over" in="shadow" in2="SourceGraphic" />
            </filter>

            <!-- 封面麥穗 -->
            <symbol id="icon-wheat" viewBox="0 0 100 100">
                <path d="M50,90 L50,20" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"
                    fill="none" />
                <path d="M50,70 C30,60 30,40 50,30" fill="url(#goldGradient)" />
                <path d="M50,55 C35,45 35,35 50,25" fill="url(#goldGradient)" />
                <path d="M50,40 C40,35 40,30 50,22" fill="url(#goldGradient)" />
                <path d="M50,70 C70,60 70,40 50,30" fill="url(#goldGradient)" />
                <path d="M50,55 C65,45 65,35 50,25" fill="url(#goldGradient)" />
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
            </symbol>
        </defs>
    </svg>

    <section id="s_gate" class="scene active" onclick="goSelection()">
        <div class="cover-content">
            <div class="title-area">
                <div class="t-main">南方 · 金穗</div>
                <div class="t-sub">成熟、覺醒與鞏固的果實</div>
            </div>
            <div class="harvest-emblem-wrap">
                <div class="emblem-glow"></div>
                <svg class="wheat-svg">
                    <use href="#icon-wheat"></use>
                </svg>
            </div>
            <div class="t-desc">整合走過的旅程，<br>收穫屬於你的智慧與成果</div>
            <div class="start-btn-frame">開啟豐盛之門</div>
        </div>
    </section>

    <!-- Scene 2: The 5 Medallions -->
    <section id="s_selection" class="scene">
        <div class="sel-container">
            <div class="sel-header">
                <div class="sel-main">五大生命金鑰</div>
                <div class="sel-sub">點擊門章 · 領取指引</div>
            </div>

            <div class="medallion-row">

                <!-- Financial: 4-Loop Coin Knot -->
                <div class="medallion-item" onclick="start('financial','財務')">
                    <div class="medallion-aura"></div>
                    <div class="medallion-wrap">
                        <svg class="medallion-svg" viewBox="0 0 150 150">
                            <!-- Base -->
                            <circle cx="75" cy="75" r="70" fill="url(#bronzeBase)" filter="url(#embossedBronze)" />
                            <circle cx="75" cy="75" r="66" fill="none" stroke="#6B4C20" stroke-width="6" />
                            <circle cx="75" cy="75" r="60" fill="none" stroke="#3A2810" stroke-width="2" />
                            <!-- Recess -->
                            <circle cx="75" cy="75" r="54" fill="#2A1E0A" opacity="0.6" filter="url(#innerShadow)" />

                            <!-- Symbol: 4-Loop Knot with Coins -->
                            <g fill="none" stroke="url(#symbolGold)" stroke-width="6" stroke-linecap="round">
                                <!-- Top Loop -->
                                <path
                                    d="M75,75 C75,50 55,50 55,35 C55,25 65,20 75,20 C85,20 95,25 95,35 C95,50 75,50 75,75" />
                                <!-- Bottom Loop -->
                                <path
                                    d="M75,75 C75,100 95,100 95,115 C95,125 85,130 75,130 C65,130 55,125 55,115 C55,100 75,100 75,75" />
                                <!-- Left Loop -->
                                <path
                                    d="M75,75 C50,75 50,95 35,95 C25,95 20,85 20,75 C20,65 25,55 35,55 C50,55 50,75 75,75" />
                                <!-- Right Loop -->
                                <path
                                    d="M75,75 C100,75 100,55 115,55 C125,55 130,65 130,75 C130,85 125,95 115,95 C100,95 100,75 75,75" />
                            </g>
                            <!-- Currency Symbols inside loops -->
                            <g fill="url(#symbolGold)" font-family="Cinzel" font-weight="900" font-size="14"
                                text-anchor="middle">
                                <text x="75" y="38">$</text>
                                <text x="75" y="120">$</text>
                                <text x="34" y="80" transform="rotate(-90 34 80)">$</text>
                                <text x="116" y="80" transform="rotate(90 116 80)">$</text>
                            </g>
                        </svg>
                    </div>
                    <div class="medallion-label">財務</div>
                </div>

                <!-- Career: Obelisk with Sun -->
                <div class="medallion-item" onclick="start('career','事業')">
                    <div class="medallion-aura"></div>
                    <div class="medallion-wrap">
                        <svg class="medallion-svg" viewBox="0 0 150 150">
                            <circle cx="75" cy="75" r="70" fill="url(#bronzeBase)" filter="url(#embossedBronze)" />
                            <circle cx="75" cy="75" r="66" fill="none" stroke="#6B4C20" stroke-width="6" />
                            <circle cx="75" cy="75" r="60" fill="none" stroke="#3A2810" stroke-width="2" />
                            <circle cx="75" cy="75" r="54" fill="#2A1E0A" opacity="0.6" filter="url(#innerShadow)" />

                            <!-- Symbol: Obelisk & Sun -->
                            <!-- Sun Halo -->
                            <circle cx="75" cy="45" r="16" fill="none" stroke="url(#symbolGold)" stroke-width="4" />
                            <!-- Obelisk -->
                            <path d="M75,25 L65,50 L60,110 L90,110 L85,50 Z" fill="url(#symbolGold)" />
                            <!-- Base -->
                            <rect x="55" y="110" width="40" height="8" rx="2" fill="url(#symbolGold)" />
                        </svg>
                    </div>
                    <div class="medallion-label">事業</div>
                </div>

                <!-- Relationship: Thick Interlocking Rings -->
                <div class="medallion-item" onclick="start('relationship','感情')">
                    <div class="medallion-aura"></div>
                    <div class="medallion-wrap">
                        <svg class="medallion-svg" viewBox="0 0 150 150">
                            <circle cx="75" cy="75" r="70" fill="url(#bronzeBase)" filter="url(#embossedBronze)" />
                            <circle cx="75" cy="75" r="66" fill="none" stroke="#6B4C20" stroke-width="6" />
                            <circle cx="75" cy="75" r="60" fill="none" stroke="#3A2810" stroke-width="2" />
                            <circle cx="75" cy="75" r="54" fill="#2A1E0A" opacity="0.6" filter="url(#innerShadow)" />

                            <!-- Symbol: Thick Rings -->
                            <g stroke="url(#symbolGold)" stroke-width="10" fill="none">
                                <circle cx="58" cy="75" r="24" />
                                <circle cx="92" cy="75" r="24" />
                            </g>
                        </svg>
                    </div>
                    <div class="medallion-label">感情</div>
                </div>

                <!-- Health: Dense Tree -->
                <div class="medallion-item" onclick="start('health','健康')">
                    <div class="medallion-aura"></div>
                    <div class="medallion-wrap">
                        <svg class="medallion-svg" viewBox="0 0 150 150">
                            <circle cx="75" cy="75" r="70" fill="url(#bronzeBase)" filter="url(#embossedBronze)" />
                            <circle cx="75" cy="75" r="66" fill="none" stroke="#6B4C20" stroke-width="6" />
                            <circle cx="75" cy="75" r="60" fill="none" stroke="#3A2810" stroke-width="2" />
                            <circle cx="75" cy="75" r="54" fill="#2A1E0A" opacity="0.6" filter="url(#innerShadow)" />

                            <!-- Symbol: Tree of Life -->
                            <g stroke="url(#symbolGold)" stroke-width="5" fill="none" stroke-linecap="round">
                                <!-- Trunk -->
                                <path d="M75,120 L75,70" stroke-width="8" />
                                <!-- Roots -->
                                <path d="M75,120 Q60,125 50,115" />
                                <path d="M75,120 Q90,125 100,115" />
                                <!-- Branches -->
                                <path d="M75,70 Q50,60 40,40 M40,40 Q35,30 45,25" />
                                <path d="M75,70 Q100,60 110,40 M110,40 Q115,30 105,25" />
                                <path d="M75,70 L75,30" />
                                <path d="M75,55 L55,45" />
                                <path d="M75,55 L95,45" />
                                <!-- Leaves -->
                                <circle cx="75" cy="25" r="4" fill="url(#symbolGold)" stroke="none" />
                                <circle cx="45" cy="25" r="3" fill="url(#symbolGold)" stroke="none" />
                                <circle cx="105" cy="25" r="3" fill="url(#symbolGold)" stroke="none" />
                                <circle cx="55" cy="45" r="3" fill="url(#symbolGold)" stroke="none" />
                                <circle cx="95" cy="45" r="3" fill="url(#symbolGold)" stroke="none" />
                            </g>
                        </svg>
                    </div>
                    <div class="medallion-label">健康</div>
                </div>

                <!-- Growth: Fibonacci Grid -->
                <div class="medallion-item" onclick="start('growth','成長')">
                    <div class="medallion-aura"></div>
                    <div class="medallion-wrap">
                        <svg class="medallion-svg" viewBox="0 0 150 150">
                            <circle cx="75" cy="75" r="70" fill="url(#bronzeBase)" filter="url(#embossedBronze)" />
                            <circle cx="75" cy="75" r="66" fill="none" stroke="#6B4C20" stroke-width="6" />
                            <circle cx="75" cy="75" r="60" fill="none" stroke="#3A2810" stroke-width="2" />
                            <circle cx="75" cy="75" r="54" fill="#2A1E0A" opacity="0.6" filter="url(#innerShadow)" />

                            <!-- Symbol: Fibonacci Grid & Spiral -->
                            <g stroke="url(#symbolGold)" fill="none">
                                <!-- Grid -->
                                <rect x="35" y="45" width="80" height="50" stroke-width="2" opacity="0.5" />
                                <line x1="85" y1="45" x2="85" y2="95" stroke-width="2" opacity="0.5" />
                                <line x1="85" y1="75" x2="115" y2="75" stroke-width="2" opacity="0.5" />
                                <line x1="95" y1="75" x2="95" y2="95" stroke-width="2" opacity="0.5" />

                                <!-- Spiral -->
                                <path d="M115,45 
                                         A50,50 0 0,0 85,95
                                         A30,30 0 0,0 35,45
                                         A20,20 0 0,1 65,45" stroke-width="6" stroke-linecap="round" />
                            </g>
                        </svg>
                    </div>
                    <div class="medallion-label">成長</div>
                </div>

            </div>
        </div>
    </section>

    <!-- Scene 3: Oracle -->
    <section id="s_oracle" class="scene">
        <div class="oracle-layout">
            <div id="minigame" style="text-align:center;">
                <div id="spinNum" class="spin-count">1</div>
                <button class="connect-btn" onclick="reveal()">接引指引...</button>
            </div>
            <div id="card" class="card-final"></div>
            <div id="nav" class="nav-row">
                <button class="nav-btn" onclick="goHome()">回首頁</button>
                <button class="nav-btn" onclick="goSel()">再選一次</button>
            </div>
        </div>
    </section>

    <script>
        // Same logic as v17
        let interval = null;
        let theme = '';

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goSelection() { switchS('s_selection'); }
        function goHome() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_gate');
        }
        function goSel() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_selection');
        }

        function start(tid, tname) {
            theme = tname;
            switchS('s_oracle');
            document.getElementById('minigame').style.display = 'block';
            document.getElementById('card').style.display = 'none';
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                document.getElementById('spinNum').innerText = Math.floor(Math.random() * 260) + 1;
            }, 50);
        }

        function reveal() {
            clearInterval(interval);
            const kin = Math.floor(Math.random() * 260) + 1;
            const toneId = (kin - 1) % 13 + 1;
            const glyphId = (kin - 1) % 20 + 1;
            const sealPad = String(glyphId).padStart(2, '0');
            const toneNames = ['磁性', '月亮', '電力', '自我存在', '超頻', '韻律', '共鳴', '銀河', '太陽', '行星', '光譜', '水晶', '宇宙'];
            const glyphNames = ['紅龍', '白風', '藍夜', '黃種子', '紅蛇', '白世界橋', '藍手', '黃星星', '紅月', '白狗', '藍猴', '黃人', '紅天行者', '白巫師', '藍鷹', '黃戰士', '紅地球', '白鏡', '藍風暴', '黃太陽'];

            const dots = toneId % 5;
            const bars = Math.floor(toneId / 5);
            const noDots = dots === 0 ? ' no-dots' : '';

            let tHtml = '<div class="tone-dots">';
            for (let i = 0; i < dots; i++) tHtml += '<div class="t-dot"></div>';
            tHtml += '</div><div class="tone-bars">';
            for (let i = 0; i < bars; i++) tHtml += '<div class="t-bar"></div>';
            tHtml += '</div>';

            const data = (typeof kinData !== 'undefined' && kinData[kin])
                ? kinData[kin]
                : { synchronicMessage: '', alignment: '', grounding: '' };

            const c = document.getElementById('card');
            c.innerHTML = `
                <div class="tone-area${noDots}">${tHtml}</div>
                <img class="glyph-img" src="../images/${sealPad}.png" alt="${glyphNames[glyphId - 1]}">
                <div style="font-family:'Cinzel';color:#8D6E63;font-weight:700;margin-top:10px;">KIN ${kin}</div>
                <div style="font-size:1.4rem;font-weight:900;color:#3E2723;margin-bottom:16px;">${toneNames[toneId - 1]}的${glyphNames[glyphId - 1]}</div>
                <div class="card-block">
                    <div class="card-block-label">⚡ 能量感應</div>
                    <div class="card-block-text">${data.synchronicMessage || ''}</div>
                </div>
                <div class="card-block">
                    <div class="card-block-label">🌱 調頻指引</div>
                    <div class="card-block-text">${data.alignment || ''}</div>
                </div>
                <div class="card-block-border">
                    <div class="card-block-label">🪨 落地行動</div>
                    <div class="card-block-text">${data.grounding || ''}</div>
                </div>
                <div style="margin-top:16px;font-size:0.8rem;color:#aaa;letter-spacing:0.2em;">✦ ${theme}指引 ✦</div>
            `;

            if (window.TONE_SCALE) TONE_SCALE.apply(c);

            document.getElementById('minigame').style.display = 'none';
            c.style.display = 'block';
            c.classList.add('show');
            document.getElementById('nav').style.display = 'flex';
        }
    </script>
</body>

</html>
