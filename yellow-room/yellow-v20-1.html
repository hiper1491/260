<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南方 · 金穗聖域 v20</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@600;900&display=swap"
        rel="stylesheet">
    <script src="kinData.js"></script>
    <script src="../core/tone-scale.js"></script>
    <style>
        :root {
            --bg-inner: #F3E5AB;
            --bg-mid: #D2B48C;
            --bg-outer: #5D4037;

            --bronze-dark: #3E2723;
            --bronze-mid: #5D4037;
            --bronze-light: #8D6E63;
            --bronze-highlight: #D7CCC8;
            --gold-glow: #FFD54F;

            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #2D241E 0%, #1A120B 100%);
            color: #F5F5F5;
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E"),
                radial-gradient(circle at 50% 30%, #4E342E 0%, #2D241E 50%, #140E0A 100%);
            background-blend-mode: soft-light;
        }

        .gold-dust {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1px 1px at 10% 10%, rgba(255, 215, 0, 0.8), transparent),
                radial-gradient(2px 2px at 20% 30%, rgba(255, 215, 0, 0.6), transparent);
            background-size: 200px 200px;
            animation: dustFloat 20s linear infinite;
        }

        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s var(--ease-out), transform 1s var(--ease-out);
            transform: scale(0.95);
            z-index: 10;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* Scene 1: Harvest Cover */
        .cover-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2vh;
            justify-content: center;
            padding: 20px;
        }

        .title-area { margin-bottom: 20px; }

        .t-main {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: #FFECB3;
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
            margin-bottom: 15px;
        }

        .t-sub {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #D7CCC8;
            letter-spacing: 0.2em;
            font-weight: 600;
            opacity: 0.9;
        }

        .t-desc {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #A1887F;
            margin-top: 10px;
            letter-spacing: 0.1em;
            max-width: 600px;
            line-height: 1.6;
        }

        .harvest-emblem-wrap {
            position: relative;
            width: clamp(220px, 45vw, 320px);
            height: clamp(220px, 45vw, 320px);
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .emblem-glow {
            position: absolute;
            inset: -10%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.2) 0%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .emblem-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: rotateRing 60s linear infinite;
        }

        .wheat-svg {
            width: 80%;
            height: 80%;
            filter: drop-shadow(0 0 15px rgba(255, 160, 0, 0.8));
            transition: transform 0.5s var(--ease-elastic);
            fill: url(#goldGradient);
        }

        .harvest-emblem-wrap:hover .wheat-svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1));
        }

        .start-btn-frame {
            margin-top: 20px;
            padding: 15px 40px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.1) 50%, transparent 100%);
            color: #FFECB3;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.5s;
            font-family: 'Noto Serif TC', serif;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .start-btn-frame:hover {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.25) 50%, transparent 100%);
            letter-spacing: 0.3em;
            text-shadow: 0 0 10px #FFC107;
            border-color: #FFD700;
        }

        /* ==============================================
           Scene 2: 五大金鑰 - 3D 青銅浮雕銅幣
           ============================================== */

        .sel-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .sel-header {
            text-align: center;
            z-index: 2;
        }

        .sel-main {
            font-size: 2rem;
            color: #FFECB3;
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 193, 7, 0.4);
        }

        .sel-sub {
            font-size: 1.1rem;
            color: #BCAAA4;
            letter-spacing: 0.3em;
            opacity: 0.9;
        }

        .medallion-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 36px;
            width: 100%;
            max-width: 1100px;
        }

        .medallion-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            position: relative;
            transition: transform 0.4s var(--ease-out);
        }

        .medallion-item:hover {
            transform: translateY(-8px);
        }

        /* ===== 神廟背光光暈 ===== */
        .medallion-halo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -55%);
            background: radial-gradient(circle,
                rgba(255, 170, 80, 0.5) 0%,
                rgba(255, 140, 50, 0.3) 30%,
                rgba(255, 100, 20, 0.1) 50%,
                transparent 70%);
            border-radius: 50%;
            filter: blur(15px);
            pointer-events: none;
            z-index: 0;
            transition: all 0.4s ease;
        }

        .medallion-item:hover .medallion-halo {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle,
                rgba(255, 180, 90, 0.6) 0%,
                rgba(255, 150, 60, 0.4) 30%,
                rgba(255, 120, 40, 0.15) 50%,
                transparent 70%);
        }

        /* ===== 青銅銅幣主體 ===== */
        .medallion {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: relative;
            z-index: 1;

            /* 青銅材質底：中心亮、邊緣暗 */
            background:
                radial-gradient(circle at 40% 35%,
                    #C9A86C 0%,
                    #A07840 15%,
                    #7D5A30 35%,
                    #5C4020 55%,
                    #3D2A15 75%,
                    #2A1A0A 100%);

            /* 銅幣投影：外陰影 + 多層深度 */
            box-shadow:
                /* 背光映射 */
                0 0 50px rgba(255, 160, 60, 0.25),
                /* 主投影 */
                0 12px 30px rgba(0, 0, 0, 0.7),
                0 4px 10px rgba(0, 0, 0, 0.5),
                /* 邊緣立體：上亮下暗 */
                inset 0 3px 6px rgba(210, 180, 130, 0.4),
                inset 0 -3px 8px rgba(0, 0, 0, 0.6),
                /* 左右立體 */
                inset 3px 0 6px rgba(180, 150, 100, 0.25),
                inset -3px 0 6px rgba(0, 0, 0, 0.4);

            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        /* ===== 外圈厚邊框 (rim) ===== */
        .medallion::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 8px solid transparent;
            background:
                linear-gradient(145deg, #8B7355 0%, #5D4037 50%, #3E2723 100%) padding-box,
                linear-gradient(145deg, #A08060 0%, #6D5040 50%, #4A3020 100%) border-box;
            box-shadow:
                inset 2px 2px 4px rgba(180, 150, 100, 0.4),
                inset -2px -2px 5px rgba(0, 0, 0, 0.7),
                2px 2px 4px rgba(0, 0, 0, 0.5),
                -1px -1px 3px rgba(140, 110, 70, 0.2);
            pointer-events: none;
        }

        /* ===== 內圈凹陷 ===== */
        .medallion::after {
            content: '';
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%,
                #6D5035 0%,
                #5A4028 40%,
                #48321C 100%);
            box-shadow:
                inset 3px 3px 8px rgba(0, 0, 0, 0.7),
                inset -2px -2px 5px rgba(160, 130, 80, 0.2),
                inset 0 0 15px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        /* ===== 符號容器 ===== */
        .medallion-inner {
            width: 80px;
            height: 80px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 青銅浮雕符號 ===== */
        .medallion-svg {
            width: 100%;
            height: 100%;
            /* 青銅浮雕色：用亮銅色 */
            fill: #C9A050;
            /* 浮雕效果：左上亮邊 + 右下暗邊 */
            filter:
                drop-shadow(1.5px 1.5px 1px rgba(20, 12, 5, 0.9))
                drop-shadow(-1px -1px 0.5px rgba(220, 190, 130, 0.6))
                drop-shadow(0 0 3px rgba(160, 120, 60, 0.4));
            transition: all 0.4s ease;
        }

        .medallion-item:hover .medallion-svg {
            fill: #DDB860;
            filter:
                drop-shadow(2px 2px 1px rgba(20, 12, 5, 0.85))
                drop-shadow(-1px -1px 1px rgba(240, 210, 150, 0.7))
                drop-shadow(0 0 8px rgba(200, 160, 80, 0.5));
        }

        .medallion-item:hover .medallion {
            box-shadow:
                0 0 70px rgba(255, 170, 70, 0.35),
                0 18px 40px rgba(0, 0, 0, 0.75),
                0 6px 15px rgba(0, 0, 0, 0.5),
                inset 0 4px 8px rgba(220, 190, 140, 0.45),
                inset 0 -3px 8px rgba(0, 0, 0, 0.55),
                inset 3px 0 6px rgba(190, 160, 110, 0.3),
                inset -3px 0 6px rgba(0, 0, 0, 0.35);
            background:
                radial-gradient(circle at 40% 35%,
                    #DDBA7A 0%,
                    #B8904A 15%,
                    #956A38 35%,
                    #6D4A28 55%,
                    #4D3218 75%,
                    #352210 100%);
        }

        /* ===== 標籤 ===== */
        .medallion-label {
            font-size: 1.3rem;
            color: #A08060;
            letter-spacing: 0.25em;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .medallion-item:hover .medallion-label {
            color: #E0C080;
            text-shadow: 0 0 15px rgba(255, 200, 100, 0.5), 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* ===== 手機版 ===== */
        @media (max-width: 600px) {
            .medallion-row { gap: 24px; }

            .medallion-halo {
                width: 140px;
                height: 140px;
            }

            .medallion-item:hover .medallion-halo {
                width: 160px;
                height: 160px;
            }

            .medallion {
                width: 105px;
                height: 105px;
            }

            .medallion::before {
                inset: 4px;
                border-width: 6px;
            }

            .medallion::after {
                inset: 16px;
            }

            .medallion-inner {
                width: 55px;
                height: 55px;
            }

            .medallion-label {
                font-size: 1rem;
                letter-spacing: 0.15em;
            }
        }

        /* Scene 3: Oracle */
        .oracle-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
            max-height: 100vh;
            overflow-y: auto;
        }

        .spin-count {
            font-size: 4rem;
            font-family: 'Cinzel';
            color: #FFB300;
            margin-bottom: 30px;
        }

        .connect-btn {
            background: #FFB300;
            color: #3E2723;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.2rem;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.4);
        }

        .connect-btn:hover {
            background: #FFCA28;
            box-shadow: 0 0 40px rgba(255, 179, 0, 0.6);
        }

        .card-final {
            --glyph: 100px;
            background: #F4EBD9;
            color: #3E2723;
            padding: 30px;
            border-radius: 12px;
            width: min(400px, 92vw);
            text-align: center;
            display: none;
            animation: popUp 0.8s var(--ease-elastic);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .card-final.show { display: block; }

        .card-final .tone-dots {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
            gap: var(--tone-gap-dotdot, 8px);
        }

        .card-final .tone-bars {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--tone-gap-barbar, 6px);
        }

        .card-final .tone-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--tone-gap-rowrow, 6px);
            margin-bottom: 12px;
        }

        .card-final .tone-area.no-dots .tone-dots { display: none; }

        .card-final .t-dot {
            width: var(--tone-dot-size, 12px);
            height: var(--tone-dot-size, 12px);
            background: #3E2723;
            border-radius: 50%;
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-final .t-bar {
            width: var(--tone-bar-w, 106px);
            height: var(--tone-bar-h, 9px);
            background: #3E2723;
            border-radius: calc(var(--tone-bar-h, 9px) / 2);
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-final .glyph-img {
            width: var(--glyph);
            height: var(--glyph);
            object-fit: contain;
        }

        .card-block {
            text-align: left;
            background: rgba(0, 0, 0, 0.05);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .card-block-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #8D6E63;
            margin-bottom: 5px;
            letter-spacing: 0.1em;
        }

        .card-block-text {
            color: #4E342E;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .card-block-border {
            text-align: left;
            border-left: 3px solid #8D6E63;
            padding-left: 15px;
            margin-bottom: 12px;
        }

        .nav-row {
            margin-top: 30px;
            display: none;
            gap: 20px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #FFCA28;
            color: #FFCA28;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #FFCA28;
            color: #3E2723;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        @keyframes dustFloat {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="bg-layer"></div>
    <div class="gold-dust"></div>

    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFECB3"/>
                <stop offset="50%" stop-color="#FFC107"/>
                <stop offset="100%" stop-color="#FF8F00"/>
            </linearGradient>

            <symbol id="icon-wheat" viewBox="0 0 100 100">
                <path d="M50,90 L50,20" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M50,70 C30,60 30,40 50,30" fill="url(#goldGradient)"/>
                <path d="M50,55 C35,45 35,35 50,25" fill="url(#goldGradient)"/>
                <path d="M50,40 C40,35 40,30 50,22" fill="url(#goldGradient)"/>
                <path d="M50,70 C70,60 70,40 50,30" fill="url(#goldGradient)"/>
                <path d="M50,55 C65,45 65,35 50,25" fill="url(#goldGradient)"/>
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
            </symbol>

            <!-- v20: 結構描摹 SVG 符號 -->

            <!-- 1. 財務：無盡結 -->
            <symbol id="icon-financial" viewBox="0 0 100 100">
                <path d="M18,50 C18,32 32,22 50,35 C68,22 82,32 82,50" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
                <path d="M82,50 C82,68 68,78 50,65 C32,78 18,68 18,50" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
                <circle cx="18" cy="32" r="5" fill="currentColor"/>
                <circle cx="82" cy="32" r="5" fill="currentColor"/>
                <circle cx="18" cy="68" r="5" fill="currentColor"/>
                <circle cx="82" cy="68" r="5" fill="currentColor"/>
            </symbol>

            <!-- 2. 事業：方尖碑 -->
            <symbol id="icon-career" viewBox="0 0 100 100">
                <path d="M50,8 L40,25 L38,85 L62,85 L60,25 Z" fill="currentColor"/>
                <rect x="30" y="85" width="40" height="8" rx="1" fill="currentColor"/>
            </symbol>

            <!-- 3. 感情：雙環 -->
            <symbol id="icon-relationship" viewBox="0 0 100 100">
                <circle cx="38" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="8"/>
                <circle cx="62" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="8"/>
            </symbol>

            <!-- 4. 健康：生命樹 -->
            <symbol id="icon-health" viewBox="0 0 100 100">
                <path d="M50,90 L50,50" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
                <path d="M50,90 Q35,85 25,95" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                <path d="M50,90 Q65,85 75,95" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                <path d="M50,50 L50,18" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
                <path d="M50,52 Q30,42 18,28" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
                <path d="M50,52 Q70,42 82,28" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
                <path d="M50,42 Q38,35 28,22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                <path d="M50,42 Q62,35 72,22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                <circle cx="50" cy="15" r="5" fill="currentColor"/>
                <circle cx="18" cy="25" r="5" fill="currentColor"/>
                <circle cx="82" cy="25" r="5" fill="currentColor"/>
                <circle cx="28" cy="19" r="4" fill="currentColor"/>
                <circle cx="72" cy="19" r="4" fill="currentColor"/>
            </symbol>

            <!-- 5. 成長：黃金螺旋 -->
            <symbol id="icon-growth" viewBox="0 0 100 100">
                <rect x="18" y="18" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1" opacity="0.08"/>
                <line x1="18" y1="50" x2="82" y2="50" stroke="currentColor" stroke-width="1" opacity="0.08"/>
                <line x1="50" y1="18" x2="50" y2="82" stroke="currentColor" stroke-width="1" opacity="0.08"/>
                <path d="M50,18 A32,32 0 0,1 82,50 A32,32 0 0,1 50,82 A32,32 0 0,1 18,50 A16,16 0 0,0 50,50 A8,8 0 0,0 50,66 A4,4 0 0,0 54,62" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
            </symbol>
        </defs>
    </svg>

    <!-- Scene 1 -->
    <section id="s_gate" class="scene active" onclick="goSelection()">
        <div class="cover-content">
            <div class="title-area">
                <div class="t-main">南方 · 金穗</div>
                <div class="t-sub">成熟、覺醒與鞏固的果實</div>
            </div>
            <div class="harvest-emblem-wrap">
                <div class="emblem-glow"></div>
                <div class="emblem-ring"></div>
                <svg class="wheat-svg"><use href="#icon-wheat"></use></svg>
            </div>
            <div class="t-desc">整合走過的旅程，<br>收穫屬於你的智慧與成果</div>
            <div class="start-btn-frame">開啟豐盛之門</div>
        </div>
    </section>

    <!-- Scene 2: 五大金鑰（3D青銅銅幣） -->
    <section id="s_selection" class="scene">
        <div class="sel-container">
            <div class="sel-header">
                <div class="sel-main">五大生命金鑰</div>
                <div class="sel-sub">點擊門章 · 領取指引</div>
            </div>
            <div class="medallion-row">

                <!-- 財務 -->
                <div class="medallion-item" onclick="start('financial','財務')">
                    <div class="medallion-halo"></div>
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg" viewBox="0 0 100 100"><use href="#icon-financial"></use></svg>
                        </div>
                    </div>
                    <div class="medallion-label">財務</div>
                </div>

                <!-- 事業 -->
                <div class="medallion-item" onclick="start('career','事業')">
                    <div class="medallion-halo"></div>
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg" viewBox="0 0 100 100"><use href="#icon-career"></use></svg>
                        </div>
                    </div>
                    <div class="medallion-label">事業</div>
                </div>

                <!-- 感情 -->
                <div class="medallion-item" onclick="start('relationship','感情')">
                    <div class="medallion-halo"></div>
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg" viewBox="0 0 100 100"><use href="#icon-relationship"></use></svg>
                        </div>
                    </div>
                    <div class="medallion-label">感情</div>
                </div>

                <!-- 健康 -->
                <div class="medallion-item" onclick="start('health','健康')">
                    <div class="medallion-halo"></div>
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg" viewBox="0 0 100 100"><use href="#icon-health"></use></svg>
                        </div>
                    </div>
                    <div class="medallion-label">健康</div>
                </div>

                <!-- 成長 -->
                <div class="medallion-item" onclick="start('growth','成長')">
                    <div class="medallion-halo"></div>
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg" viewBox="0 0 100 100"><use href="#icon-growth"></use></svg>
                        </div>
                    </div>
                    <div class="medallion-label">成長</div>
                </div>

            </div>
        </div>
    </section>

    <!-- Scene 3 -->
    <section id="s_oracle" class="scene">
        <div class="oracle-layout">
            <div id="minigame" style="text-align:center;">
                <div id="spinNum" class="spin-count">1</div>
                <button class="connect-btn" onclick="reveal()">接引指引...</button>
            </div>
            <div id="card" class="card-final"></div>
            <div id="nav" class="nav-row">
                <button class="nav-btn" onclick="goHome()">回首頁</button>
                <button class="nav-btn" onclick="goSel()">再選一次</button>
            </div>
        </div>
    </section>

    <script>
        let interval = null, theme = '';

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goSelection() { switchS('s_selection'); }
        function goHome() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_gate');
        }
        function goSel() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_selection');
        }

        function start(tid, tname) {
            theme = tname;
            switchS('s_oracle');
            document.getElementById('minigame').style.display = 'block';
            document.getElementById('card').style.display = 'none';
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                document.getElementById('spinNum').innerText = Math.floor(Math.random() * 260) + 1;
            }, 50);
        }

        function reveal() {
            clearInterval(interval);
            const kin = Math.floor(Math.random() * 260) + 1;
            const toneId = (kin - 1) % 13 + 1;
            const glyphId = (kin - 1) % 20 + 1;
            const sealPad = String(glyphId).padStart(2, '0');
            const toneNames = ['磁性','月亮','電力','自我存在','超頻','韻律','共鳴','銀河','太陽','行星','光譜','水晶','宇宙'];
            const glyphNames = ['紅龍','白風','藍夜','黃種子','紅蛇','白世界橋','藍手','黃星星','紅月','白狗','藍猴','黃人','紅天行者','白巫師','藍鷹','黃戰士','紅地球','白鏡','藍風暴','黃太陽'];

            const dots = toneId % 5;
            const bars = Math.floor(toneId / 5);
            const noDots = dots === 0 ? ' no-dots' : '';

            let tHtml = '<div class="tone-dots">';
            for (let i = 0; i < dots; i++) tHtml += '<div class="t-dot"></div>';
            tHtml += '</div><div class="tone-bars">';
            for (let i = 0; i < bars; i++) tHtml += '<div class="t-bar"></div>';
            tHtml += '</div>';

            const data = (typeof kinData !== 'undefined' && kinData[kin]) ? kinData[kin] : { synchronicMessage: '', alignment: '', grounding: '' };

            const c = document.getElementById('card');
            c.innerHTML = `
                <div class="tone-area${noDots}">${tHtml}</div>
                <img class="glyph-img" src="../images/${sealPad}.png" alt="${glyphNames[glyphId-1]}" onerror="this.style.display='none'">
                <div style="font-family:'Cinzel';color:#8D6E63;font-weight:700;margin-top:10px;">KIN ${kin}</div>
                <div style="font-size:1.4rem;font-weight:900;color:#3E2723;margin-bottom:16px;">${toneNames[toneId-1]}的${glyphNames[glyphId-1]}</div>
                <div class="card-block"><div class="card-block-label">⚡ 能量感應</div><div class="card-block-text">${data.synchronicMessage||''}</div></div>
                <div class="card-block"><div class="card-block-label">🌱 調頻指引</div><div class="card-block-text">${data.alignment||''}</div></div>
                <div class="card-block-border"><div class="card-block-label">🪨 落地行動</div><div class="card-block-text">${data.grounding||''}</div></div>
                <div style="margin-top:16px;font-size:0.8rem;color:#aaa;letter-spacing:0.2em;">✦ ${theme}指引 ✦</div>
            `;

            if (window.TONE_SCALE) TONE_SCALE.apply(c);

            document.getElementById('minigame').style.display = 'none';
            c.style.display = 'block';
            c.classList.add('show');
            document.getElementById('nav').style.display = 'flex';
        }
    </script>
</body>

</html>
