<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南方 · 金穗</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;600;900&display=swap"
        rel="stylesheet">
    <style>
        /* === V4: Grand Atmosphere (Golden Treasury) === */
        :root {
            --void: #140F0B;
            /* 深淵褐 */
            --stone: #241D17;
            /* 古老岩石 */
            --amber-glow: #FFB84D;
            /* 琥珀光輝 */
            --gold-solid: #DDAA00;
            /* 固態黃金 */
            --pollen: #FFF6E0;
            /* 豐盛花粉 (亮部) */
            --shadow-depth: rgba(0, 0, 0, 0.7);

            --ease-grand: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--void);
            color: var(--pollen);
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === Dynamic Background (Layers) === */
        .layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .bg-gradient {
            background: radial-gradient(circle at 50% 30%, #3D2914 0%, var(--void) 80%);
            z-index: -2;
        }

        .particles-container {
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: var(--amber-glow);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 15s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            80% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        /* === Scenes === */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 1s var(--ease-grand);
            transform: scale(0.95);
            padding: 20px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
            z-index: 10;
        }

        /* === Scene 1: Cover (Sun Core) === */
        .grand-title-block {
            text-align: center;
            z-index: 10;
            margin-bottom: 2vh;
        }

        .grand-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            color: var(--gold-solid);
            background: linear-gradient(135deg, var(--pollen) 0%, var(--gold-solid) 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(221, 170, 0, 0.4));
            margin-bottom: 1rem;
        }

        .grand-subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: rgba(255, 246, 224, 0.8);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        /* Animated Core */
        .sun-core-wrapper {
            position: relative;
            width: clamp(200px, 40vh, 320px);
            height: clamp(200px, 40vh, 320px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4rem;
            cursor: pointer;
            transition: transform 0.6s var(--ease-grand);
        }

        .sun-core-wrapper:hover {
            transform: scale(1.05);
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--amber-glow);
            opacity: 0.3;
            transition: all 0.5s;
        }

        .r1 {
            width: 100%;
            height: 100%;
            border-width: 2px;
            animation: spin 20s linear infinite;
        }

        .r2 {
            width: 75%;
            height: 75%;
            border: 1px dashed var(--gold-solid);
            animation: spinRev 30s linear infinite;
        }

        .r3 {
            width: 130%;
            height: 130%;
            border: none;
            background: radial-gradient(circle, rgba(221, 170, 0, 0.15) 0%, transparent 70%);
            animation: pulse 4s infinite ease-in-out;
        }

        .core-orb {
            width: 40%;
            height: 40%;
            background: radial-gradient(circle at 30% 30%, #FFF 0%, #FFCC00 20%, #B8860B 100%);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 204, 0, 0.6);
            z-index: 5;
        }

        .sun-core-wrapper:hover .r1 {
            border-color: var(--pollen);
            opacity: 0.8;
        }

        .sun-core-wrapper:hover .core-orb {
            box-shadow: 0 0 150px rgba(255, 204, 0, 0.9);
        }

        .enter-trigger {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            color: var(--amber-glow);
            border-bottom: 1px solid var(--amber-glow);
            padding-bottom: 5px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .sun-core-wrapper:hover+.enter-trigger {
            opacity: 1;
            letter-spacing: 0.4em;
        }

        /* === Scene 2: 5 Pillars (Altars) === */
        .altar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            height: 60vh;
            align-items: center;
        }

        .altar {
            height: 100%;
            background: rgba(36, 29, 23, 0.6);
            border: 1px solid rgba(221, 170, 0, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s var(--ease-grand);
            backdrop-filter: blur(10px);
        }

        .altar::before {
            /* Glow overlay */
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(221, 170, 0, 0.1));
            opacity: 0;
            transition: 0.4s;
        }

        .altar:hover {
            background: rgba(36, 29, 23, 0.9);
            border-color: var(--gold-solid);
            transform: translateY(-20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(221, 170, 0, 0.2);
        }

        .altar:hover::before {
            opacity: 1;
        }

        /* Reveal Animation by Index */
        .altar:nth-child(1) {
            transition-delay: 0.0s;
        }

        .altar:nth-child(2) {
            transition-delay: 0.05s;
        }

        .altar:nth-child(3) {
            transition-delay: 0.1s;
        }

        .altar:nth-child(4) {
            transition-delay: 0.15s;
        }

        .altar:nth-child(5) {
            transition-delay: 0.2s;
        }

        .altar-icon {
            width: 60px;
            height: 60px;
            fill: var(--pollen);
            opacity: 0.5;
            margin-bottom: 30px;
            transition: 0.4s;
        }

        .altar:hover .altar-icon {
            transform: scale(1.2);
            opacity: 1;
            fill: var(--gold-solid);
        }

        .altar-title {
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: var(--pollen);
            font-weight: 700;
            opacity: 0.7;
            transition: 0.4s;
        }

        .altar:hover .altar-title {
            opacity: 1;
            color: var(--gold-solid);
        }

        /* === Scene 3: Oracle Card (Ritual) === */
        .oracle-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .card-grand {
            background: #EBE6D8;
            /* Creamy Parchment */
            width: min(400px, 90vw);
            padding: 40px;
            border-radius: 4px;
            box-shadow:
                0 0 0 10px rgba(20, 15, 11, 0.8),
                /* Gap */
                0 0 0 12px var(--gold-solid),
                /* Gold Rim */
                0 40px 100px rgba(0, 0, 0, 0.8);
            text-align: center;
            color: #332211;
            position: relative;
            transform: translateY(30px);
            opacity: 0;
            animation: cardRise 1.2s var(--ease-grand) forwards;
        }

        .card-grand::after {
            /* Texture */
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes cardRise {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Standard Visuals: Dots TOP, Bars BOTTOM */
        .viz-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .viz-dots {
            display: flex;
            gap: 8px;
        }

        .v-dot {
            width: 14px;
            height: 14px;
            background: #332211;
            border-radius: 50%;
        }

        .viz-bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .v-bar {
            width: 80px;
            height: 10px;
            background: #332211;
            border-radius: 10px;
        }

        .viz-seal {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
        }

        .card-kin-num {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #B8860B;
            margin-bottom: 8px;
            z-index: 2;
            position: relative;
        }

        .card-kin-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(184, 134, 11, 0.2);
            z-index: 2;
            position: relative;
        }

        .card-focus-box {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            text-align: left;
            border-left: 4px solid #B8860B;
            margin-bottom: 15px;
            z-index: 2;
            position: relative;
        }

        .cf-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: #B8860B;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .cf-text {
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 600;
        }

        .card-actions {
            margin-top: 2rem;
            display: flex;
            gap: 20px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--amber-glow);
            color: var(--amber-glow);
            padding: 12px 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .btn-action:hover {
            background: rgba(255, 184, 77, 0.1);
            box-shadow: 0 0 20px rgba(255, 184, 77, 0.2);
        }

        /* Animations */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinRev {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }


        @media (max-width: 800px) {
            .altar-grid {
                grid-template-columns: 1fr;
                height: auto;
                gap: 10px;
                max-width: 300px;
            }

            .altar {
                flex-direction: row;
                padding: 15px;
                height: 70px;
            }

            .altar-title {
                writing-mode: horizontal-tb;
                margin-left: 15px;
                font-size: 1rem;
            }

            .altar-icon {
                width: 30px;
                height: 30px;
                margin-bottom: 0;
            }

            .card-grand {
                padding: 25px 20px;
                width: 95vw;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="layer bg-gradient"></div>
    <div class="layer particles-container" id="particles"></div>

    <!-- Scene 1: Gate -->
    <section id="scene-gate" class="scene active">
        <div class="grand-title-block">
            <h1 class="grand-title">南方 · 金穗</h1>
            <div class="grand-subtitle">Mature • Awake • Abundance</div>
        </div>

        <div class="sun-core-wrapper" onclick="switchScene('scene-altars')">
            <div class="ring r3"></div>
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="core-orb"></div>
        </div>
        <div class="enter-trigger">CLICK TO ENTER</div>
    </section>

    <!-- Scene 2: 5 Pillars -->
    <section id="scene-altars" class="scene">
        <div class="grand-subtitle" style="margin-bottom:2rem;">選擇屬於你的豐盛果實</div>
        <div class="altar-grid" id="altarGrid">
            <!-- Injected -->
        </div>
    </section>

    <!-- Scene 3: Oracle -->
    <section id="scene-oracle" class="scene">
        <div class="oracle-stage">
            <div id="cardStage"></div>

            <div class="card-actions">
                <button class="btn-action" onclick="switchScene('scene-altars')">再次收穫</button>
                <button class="btn-action" style="border-color:#555; color:#777;" onclick="clearHistory()">重置</button>
            </div>

            <!-- Minimal History -->
            <div id="historyList" style="margin-top:20px; font-size:0.8rem; color:var(--amber-glow); opacity:0.7;">
            </div>
        </div>
    </section>

    <script>
        // --- Data ---
        const THEMES = [
            { id: 'financial', name: '財務', path: 'M12,2L2,22h20L12,2z M12,6l6,12H6L12,6z' },
            { id: 'career', name: '事業', path: 'M20,6h-4V4c0-1.1-0.9-2-2-2h-4C8.9,2,8,2.9,8,4v2H4C2.9,6,2,6.9,2,8v11c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8C22,6.9,21.1,6,20,6z' },
            { id: 'relationship', name: '感情', path: 'M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z' },
            { id: 'health', name: '健康', path: 'M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V5C21,3.9,20.1,3,19,3z' },
            { id: 'growth', name: '成長', path: 'M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z' }
        ];

        const kinData = {
            "1": { "alignment": "做一件最簡單的滋養：好好吃一餐／補水／提早睡。", "grounding": "準備一份簡單但你真正想吃的食物，專心進食。" },
            "2": { "alignment": "開口前先深呼吸三次；說重點，不急著解釋。", "grounding": "與植物或大地接觸 5 分鐘。" },
            "3": { "alignment": "把大願景拆解成今天能做的 10 分鐘小事。", "grounding": "午睡或閉眼休息 10 分鐘。" },
            // Demo fallback for unseen IDs to avoid crash
            "default": { "alignment": "回到內在，感受呼吸。", "grounding": "喝一杯溫水，感受水流經身體。" }
        };

        const wisdomQuotes = {
            financial: ["金錢是能量的流動。", "豐盛始於感謝。"],
            career: ["天賦是你的通行證。", "細節決定使命。"],
            relationship: ["愛是看見本來的樣子。", "清晰帶來連結。"],
            health: ["身體是靈魂的殿堂。", "善待自己。"],
            growth: ["成長伴隨著拓展。", "抗拒是為了保護舊的你。"]
        };

        // --- Core Logic ---
        let currentTheme = null;
        let history = JSON.parse(localStorage.getItem('yellowHistoryV4')) || [];

        function init() {
            // Particles
            const pContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 1;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 10 + 10) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                pContainer.appendChild(p);
            }

            // Altars
            const grid = document.getElementById('altarGrid');
            grid.innerHTML = THEMES.map(t => `
        <div class="altar" onclick="selectTheme('${t.id}')">
          <svg class="altar-icon" viewBox="0 0 24 24"><path d="${t.path}"/></svg>
          <span class="altar-title">${t.name}</span>
        </div>
      `).join('');
            renderHistory();
        }

        function switchScene(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectTheme(tid) {
            currentTheme = THEMES.find(t => t.id === tid);
            // Skip breathe scene for faster flow (Grand Flow) OR add if needed.
            // Based on request, "Interact: Define -> Breathe -> Get".
            // Let's do a direct reveal with a fade to keep it 'Atmospheric' without extra clicks
            revealOracle();
        }

        function revealOracle() {
            const randKin = Math.floor(Math.random() * 260) + 1;
            const data = kinData[String(randKin)] || kinData["default"];
            const quotes = wisdomQuotes[currentTheme.id] || wisdomQuotes.financial;
            const quote = quotes[Math.floor(Math.random() * quotes.length)];

            // Tone/Seal Calc
            const tone = ((randKin - 1) % 13) + 1;
            const seal = ((randKin - 1) % 20) + 1;
            const sealPad = String(seal).padStart(2, '0');

            // Visuals
            const bars = Math.floor(tone / 5);
            const dots = tone % 5;
            const dotsHTML = dots > 0 ? `<div class="viz-dots">${Array(dots).fill('<div class="v-dot"></div>').join('')}</div>` : '';
            const barsHTML = bars > 0 ? `<div class="viz-bars">${Array(bars).fill('<div class="v-bar"></div>').join('')}</div>` : '';

            const stage = document.getElementById('cardStage');
            stage.innerHTML = `
        <div class="card-grand">
          <div class="viz-header">
            ${dotsHTML} ${barsHTML}
            <img class="viz-seal" src="../images/${sealPad}.png" onerror="this.src='https://via.placeholder.com/150'">
          </div>
          
          <div class="card-kin-num">KIN ${randKin}</div>
          <div class="card-kin-text">${currentTheme.name}之豐盛成果</div>
          
          <div class="card-focus-box">
            <div class="cf-label">Alignment 調頻</div>
            <div class="cf-text">${data.alignment}</div>
          </div>
          
          <div class="card-focus-box">
            <div class="cf-label">Grounding 落地</div>
            <div class="cf-text">${data.grounding}</div>
          </div>
          
          <div style="font-style:italic; margin-top:20px; font-size:0.9rem;">"${quote}"</div>
        </div>
      `;

            // History
            history.unshift({ k: randKin, t: currentTheme.name });
            if (history.length > 5) history.pop();
            localStorage.setItem('yellowHistoryV4', JSON.stringify(history));
            renderHistory();

            switchScene('scene-oracle');
        }

        function renderHistory() {
            const el = document.getElementById('historyList');
            if (history.length === 0) { el.innerHTML = ''; return; }
            el.innerHTML = history.map(h => `<span>KIN ${h.k} ${h.t}</span>`).join(' • ');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('yellowHistoryV4');
            renderHistory();
        }

        window.onload = init;
    </script>
</body>

</html>
