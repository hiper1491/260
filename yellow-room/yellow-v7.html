<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南方 · 金穗</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@600;900&display=swap"
        rel="stylesheet">
    <script src="kinData.js"></script>
    <style>
        :root {
            /* Theme: Deep Earth & Gold */
            --void: #100a05;
            --stone-dark: #1c140d;
            --stone-light: #2a1f16;
            --gold-shadow: #8a6600;
            --gold-main: #DDAA00;
            --gold-bright: #FFD700;
            --gold-pale: #FFEebb;
            --parchment: #F2E8D5;
            --ink: #100800;

            --ease-fluid: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--void);
            color: var(--parchment);
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === Global Texture === */
        .bg-texture {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -2;
            background:
                radial-gradient(circle at 50% 30%, rgba(221, 170, 0, 0.08) 0%, transparent 70%),
                linear-gradient(to bottom, #140a05 0%, #080503 100%);
        }

        .dust-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.6;
        }

        .particle {
            position: absolute;
            background: var(--gold-bright);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatGold {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            80% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* === Scenes === */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s var(--ease-fluid);
            transform: scale(0.95) translateY(20px);
            padding: 20px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1) translateY(0);
            z-index: 10;
        }

        /* === Scene 1: Cover (Mandala) === */
        .title-block {
            text-align: center;
            margin-bottom: 2vh;
            z-index: 5;
            position: relative;
        }

        .t-main {
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(to bottom, #FFD700 30%, #DDAA00 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(221, 170, 0, 0.5));
            margin-bottom: 0.5rem;
        }

        .t-sub {
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            color: var(--gold-main);
            opacity: 0.9;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        .desc {
            margin-bottom: 5vh;
            opacity: 0.7;
            font-size: 1rem;
            letter-spacing: 0.08em;
            max-width: 500px;
            line-height: 1.8;
            text-align: center;
            color: #dcb;
        }

        /* Improved Mandala */
        .mandala-wrapper {
            width: clamp(260px, 35vw, 360px);
            height: clamp(260px, 35vw, 360px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4vh;
            cursor: pointer;
            transition: transform 0.6s var(--ease-elastic);
        }

        .mandala-wrapper:hover {
            transform: scale(1.05);
        }

        .m-layer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transition: 0.5s;
        }

        .m-outer {
            border: 1px solid rgba(221, 170, 0, 0.2);
            animation: rotSlow 80s linear infinite;
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(221, 170, 0, 0.05) 45deg,
                    transparent 90deg,
                    rgba(221, 170, 0, 0.05) 135deg,
                    transparent 180deg,
                    rgba(221, 170, 0, 0.05) 225deg,
                    transparent 270deg,
                    rgba(221, 170, 0, 0.05) 315deg);
        }

        .m-mid {
            inset: 15%;
            border: 1px dashed rgba(221, 170, 0, 0.4);
            animation: rotRev 60s linear infinite;
        }

        .m-core-btn {
            width: 35%;
            height: 35%;
            background: radial-gradient(circle at 30% 30%, var(--gold-bright), var(--gold-main));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 30px rgba(221, 170, 0, 0.4),
                inset 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 10;
            transition: all 0.4s var(--ease-elastic);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: #2a1f16;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .mandala-wrapper:hover .m-core-btn {
            width: 40%;
            height: 40%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.8);
            letter-spacing: 0.2em;
        }

        /* === Scene 2: Monoliths (The Selection Doors) === */
        .scene-title {
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: var(--gold-main);
            margin-bottom: 3rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            font-weight: 700;
        }

        .monolith-grid {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
            padding-bottom: 80px;
            /* Space for Runestones */
        }

        /* 3D Stone Block Styling */
        .monolith {
            flex: 1;
            min-width: 160px;
            max-width: 200px;
            height: 400px;
            position: relative;
            background: #1a1208;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s var(--ease-fluid);
            /* Creating the 3D block effect */
            box-shadow:
                /* Top Highlight */
                inset 0 2px 0 rgba(255, 255, 255, 0.05),
                /* Front Face Bevel */
                inset 0 0 0 1px rgba(221, 170, 0, 0.1),
                /* Deep Shadow */
                0 20px 40px rgba(0, 0, 0, 0.6),
                /* Bottom gold rim */
                0 4px 0 var(--gold-shadow);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .monolith::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(221, 170, 0, 0.3);
            opacity: 0.3;
            transition: 0.4s;
        }

        .monolith:hover {
            transform: translateY(-15px);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(221, 170, 0, 0.15),
                0 4px 0 var(--gold-bright);
            background: #231911;
        }

        .monolith:hover::before {
            opacity: 1;
            inset: 10px;
            border-color: var(--gold-main);
        }

        .mono-icon {
            width: 60px;
            height: 60px;
            fill: #554433;
            margin-bottom: 50px;
            transition: 0.5s var(--ease-elastic);
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
        }

        .monolith:hover .mono-icon {
            fill: var(--gold-bright);
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--gold-main));
        }

        .mono-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            color: #886644;
            transition: 0.4s;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .monolith:hover .mono-text {
            color: var(--parchment);
            text-shadow: 0 0 8px var(--gold-shadow);
        }

        /* === Scene 3: Oracle (Spin -> Anchor) === */

        .oracle-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Spin Stage */
        .spin-stage {
            width: 320px;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(221, 170, 0, 0.2);
            background: rgba(20, 15, 11, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            animation: pulseBorder 3s infinite;
        }

        .spin-val {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            color: var(--gold-main);
            filter: blur(2px);
            text-shadow: 0 0 30px rgba(221, 170, 0, 0.6);
        }

        .spin-label {
            margin-top: 1.5rem;
            color: #886644;
            letter-spacing: 0.2em;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .stop-btn {
            margin-top: 40px;
            padding: 16px 48px;
            font-size: 1.1rem;
            letter-spacing: 0.25em;
            background: linear-gradient(135deg, var(--gold-main), #b8860b);
            color: #100800;
            border: none;
            font-weight: 900;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-family: 'Noto Serif TC', serif;
        }

        .stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(221, 170, 0, 0.3);
            filter: brightness(1.1);
        }

        /* Revealed Card */
        .card-parchment {
            background: #F1E9D8;
            width: min(440px, 90vw);
            padding: 50px 40px;
            border-radius: 8px;
            box-shadow:
                0 0 0 12px #1A1208 inset,
                0 0 0 14px #554433 inset,
                0 40px 100px rgba(0, 0, 0, 0.9);
            color: #1A1208;
            text-align: center;
            position: relative;
            display: none;
            margin-bottom: 60px;
            /* Space for history */
        }

        .card-parchment.show {
            display: block;
            animation: cardAppear 1s var(--ease-elastic);
        }

        /* Top Visuals: Balanced Tone & Glyph */
        .card-visuals {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 2rem;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
        }

        /* Unified Tone Styles (Black) */
        .tone-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
            /* consistent height */
        }

        .t-dots {
            display: flex;
            gap: 12px;
        }

        .t-dot {
            width: 18px;
            height: 18px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .t-bars {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .t-bar {
            width: 120px;
            height: 12px;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Original Color Glyph */
        .glyph-block img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            /* No Sepia! */
        }

        .cp-kin {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #886644;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .cp-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: #100800;
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
        }

        .guide-box {
            text-align: left;
            background: rgba(221, 170, 0, 0.08);
            padding: 20px;
            border-left: 4px solid #DDAA00;
            margin-bottom: 15px;
        }

        .g-label {
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #886644;
            margin-bottom: 8px;
            display: block;
        }

        .g-content {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.6;
            color: #2a1f16;
        }

        .actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .act-btn {
            background: transparent;
            border: 1px solid #886644;
            color: #554433;
            padding: 10px 25px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Noto Serif TC', serif;
        }

        .act-btn:hover {
            color: #100800;
            border-color: #100800;
            background: rgba(0, 0, 0, 0.05);
        }

        /* === History Runestones (Fixed) === */
        /* Move to right side vertical stack or bottom but clear of content */
        .rune-rack {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 50;
            pointer-events: none;
            /* Let clicks pass through if empty */
        }

        .rune {
            width: 44px;
            height: 52px;
            background: linear-gradient(135deg, #1c140d, #0d0805);
            border: 1px solid #443322;
            border-radius: 8px;
            color: #665544;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            pointer-events: auto;
            cursor: pointer;
            opacity: 0.6;
        }

        .rune:hover {
            transform: scale(1.1) translateX(-5px);
            opacity: 1;
            border-color: var(--gold-main);
            color: var(--gold-main);
            box-shadow: 0 0 15px rgba(221, 170, 0, 0.3);
        }

        .rune.active-rune {
            border-color: var(--gold-bright);
            color: var(--gold-bright);
            opacity: 1;
            transform: scale(1.1);
        }

        /* Animations */
        @keyframes rotSlow {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotRev {
            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulseBorder {
            0% {
                border-color: rgba(221, 170, 0, 0.2);
            }

            50% {
                border-color: rgba(221, 170, 0, 0.6);
            }

            100% {
                border-color: rgba(221, 170, 0, 0.2);
            }
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media(max-width: 768px) {
            .monolith {
                height: 90px;
                flex-direction: row;
                padding: 0 25px;
                justify-content: flex-start;
                gap: 20px;
                max-width: 100%;
                width: 100%;
            }

            .monolith-grid {
                flex-direction: column;
                align-items: center;
            }

            .mono-text {
                writing-mode: horizontal-tb;
                font-size: 1.2rem;
            }

            .mono-icon {
                margin-bottom: 0;
                width: 40px;
                height: 40px;
            }

            .rune-rack {
                right: auto;
                top: auto;
                left: 50%;
                bottom: 20px;
                transform: translateX(-50%);
                flex-direction: row;
                width: max-content;
            }

            .card-parchment {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-texture"></div>
    <div class="dust-overlay"></div>
    <div id="particles"></div>

    <!-- Scene 1: Cover -->
    <section id="s_cover" class="scene active">
        <div class="title-block">
            <div class="t-main">南方 · 金穗</div>
            <div class="t-sub">THE GOLDEN HARVEST</div>
        </div>

        <div class="mandala-wrapper" onclick="goAltars()">
            <div class="m-layer m-outer"></div>
            <div class="m-layer m-mid"></div>
            <div class="m-core-btn">ENTER</div>
        </div>

        <div class="desc">
            成熟、覺醒與豐盛的果實<br>
            整合你的歷程，收穫智慧。
        </div>
    </section>

    <!-- Scene 2: Altars (Monoliths) -->
    <section id="s_altars" class="scene">
        <div class="scene-title">選擇一座豐盛祭壇</div>
        <div class="monolith-grid" id="grid">
            <!-- Injected -->
        </div>
    </section>

    <!-- Scene 3: Oracle -->
    <section id="s_oracle" class="scene">
        <div class="oracle-layout">

            <!-- Spin Stage -->
            <div id="spinStage" class="spin-stage">
                <div class="spin-val" id="spinNum">1</div>
                <div class="spin-label">連結頻率...</div>
                <button class="stop-btn" onclick="stopAndReveal()">ANCHOR | 定頻</button>
            </div>

            <!-- Result Card -->
            <div id="resultCard" class="card-parchment">
                <!-- Injected -->
            </div>

            <div class="actions" id="endActions" style="display:none;">
                <button class="act-btn" onclick="goAltars()">再次收穫</button>
                <button class="act-btn" onclick="resetAll()">重置旅程</button>
            </div>

        </div>
    </section>

    <!-- Runestone History (Side) -->
    <div class="rune-rack" id="runeRack"></div>

    <script>
        /* --- Data --- */
        const THEMES = [
            { id: 'financial', name: '財務', path: 'M12,2L2,22h20L12,2z M12,6l6,12H6L12,6z' },
            { id: 'career', name: '事業', path: 'M20,6h-4V4c0-1.1-0.9-2-2-2h-4C8.9,2,8,2.9,8,4v2H4C2.9,6,2,6.9,2,8v11c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8C22,6.9,21.1,6,20,6z' },
            { id: 'relationship', name: '感情', path: 'M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z' },
            { id: 'health', name: '健康', path: 'M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V5C21,3.9,20.1,3,19,3z' },
            { id: 'growth', name: '成長', path: 'M12,2c-5.52,0-10,4.48-10,10s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z' }
        ];

        const TONE_NAMES = ['磁性', '月亮', '電力', '自我存在', '超頻', '韻律', '共鳴', '銀河', '太陽', '行星', '光譜', '水晶', '宇宙'];
        const GLYPH_NAMES = ['紅龍', '白風', '藍夜', '黃種子', '紅蛇', '白世界橋', '藍手', '黃星星', '紅月', '白狗', '藍猴', '黃人', '紅天行者', '白巫師', '藍鷹', '黃戰士', '紅地球', '白鏡', '藍風暴', '黃太陽'];

        /* --- Logic --- */
        let spinInterval = null;
        let currentTheme = null;
        let history = JSON.parse(localStorage.getItem('yRunes')) || [];

        function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                let size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animation = `floatGold ${10 + Math.random() * 20}s infinite linear`;
                p.style.animationDelay = -Math.random() * 20 + 's';
                container.appendChild(p);
            }
        }

        function init() {
            initParticles();

            // Grid
            const grid = document.getElementById('grid');
            grid.innerHTML = THEMES.map(t => `
                <div class="monolith" onclick="startSpin('${t.id}', '${t.name}')">
                    <svg class="mono-icon" viewBox="0 0 24 24"><path d="${t.path}"/></svg>
                    <div class="mono-text">${t.name}</div>
                </div>
            `).join('');

            renderRunes();
        }

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(id).classList.add('active');
            }, 100);
        }

        function goAltars() { switchS('s_altars'); }

        function startSpin(tid, tname) {
            currentTheme = { id: tid, name: tname };
            switchS('s_oracle');

            // Reset UI
            document.getElementById('spinStage').style.display = 'flex';
            document.getElementById('resultCard').classList.remove('show');
            document.getElementById('endActions').style.display = 'none';

            if (spinInterval) clearInterval(spinInterval);
            spinInterval = setInterval(() => {
                document.getElementById('spinNum').innerText = Math.floor(Math.random() * 260) + 1;
            }, 50);
        }

        function stopAndReveal() {
            clearInterval(spinInterval);
            const kin = Math.floor(Math.random() * 260) + 1;
            showResult(kin);

            // Save History
            history.unshift({ kin: kin, theme: currentTheme.name });
            if (history.length > 5) history.pop(); // Max 5 runestones visually
            localStorage.setItem('yRunes', JSON.stringify(history));
            renderRunes();
        }

        function showResult(kin) {
            // Calculate Tone/Seal
            const toneId = (kin - 1) % 13 + 1;
            const glyphId = (kin - 1) % 20 + 1;
            const sealPad = String(glyphId).padStart(2, '0');

            // Render Tone Dots/Bars
            const bars = Math.floor(toneId / 5);
            const dots = toneId % 5;

            let toneHtml = '';
            if (dots > 0) toneHtml += `<div class="t-dots">${Array(dots).fill('<div class="t-dot"></div>').join('')}</div>`;
            if (bars > 0) toneHtml += `<div class="t-bars">${Array(bars).fill('<div class="t-bar"></div>').join('')}</div>`;

            // Data
            const data = (typeof kinData !== 'undefined' && kinData[kin]) ? kinData[kin] : {
                alignment: "靜心感受當下。",
                grounding: "喝一杯水，回到中心。"
            };

            const tName = TONE_NAMES[toneId - 1];
            const gName = GLYPH_NAMES[glyphId - 1];

            const card = document.getElementById('resultCard');
            card.innerHTML = `
                <div class="card-visuals">
                    <div class="tone-block">
                        ${toneHtml}
                    </div>
                    <div class="glyph-block">
                        <img src="../images/${sealPad}.png" onerror="this.src='https://via.placeholder.com/140'">
                    </div>
                </div>

                <div class="cp-kin">KIN ${kin}</div>
                <div class="cp-name">${tName}的${gName}</div>

                <div class="guide-box">
                    <span class="g-label">Alignment · 調頻</span>
                    <div class="g-content">${data.alignment}</div>
                </div>

                <div class="guide-box">
                    <span class="g-label">Grounding · 落地</span>
                    <div class="g-content">${data.grounding}</div>
                </div>

                <div style="margin-top:20px; font-size:0.85rem; color:#665544; font-style:italic;">
                    ${currentTheme.name}之鑰 · 豐盛顯化
                </div>
            `;

            // Transition
            document.getElementById('spinStage').style.display = 'none';
            card.classList.add('show');
            document.getElementById('endActions').style.display = 'flex';
        }

        function renderRunes() {
            const rack = document.getElementById('runeRack');
            if (history.length === 0) { rack.style.display = 'none'; return; }
            rack.style.display = 'flex';
            rack.innerHTML = history.map(h => `
                <div class="rune" onclick="simpleRecall(${h.kin})">
                    ${h.kin}
                </div>
            `).join('');
        }

        function simpleRecall(kin) {
            // Quick recall without theme context if clicked from history
            // For now, just show result if in Oracle scene, or go to Oracle layout
            currentTheme = currentTheme || { name: '歷史回顧' };
            switchS('s_oracle');
            document.getElementById('spinStage').style.display = 'none';
            document.getElementById('resultCard').classList.remove('show');

            // Tiny delay to allow reflow for animation
            setTimeout(() => {
                showResult(kin);
            }, 50);
        }

        function resetAll() {
            history = [];
            localStorage.removeItem('yRunes');
            renderRunes();
            goAltars();
        }

        window.onload = init;
    </script>
</body>

</html>
