<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南方 · 金穗聖域 v15</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@600;900&display=swap"
        rel="stylesheet">
    <script src="kinData.js"></script>
    <script src="../core/tone-scale.js"></script>
    <style>
        :root {
            --bg-inner: #F3E5AB;
            --bg-mid: #D2B48C;
            --bg-outer: #5D4037;

            --bronze-dark: #3E2723;
            --bronze-mid: #5D4037;
            --bronze-light: #8D6E63;
            --bronze-highlight: #D7CCC8;
            --gold-glow: #FFD54F;

            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #2D241E 0%, #1A120B 100%);
            color: #F5F5F5;
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Layers */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E"),
                radial-gradient(circle at 50% 30%, #4E342E 0%, #2D241E 50%, #140E0A 100%);
            background-blend-mode: soft-light;
        }

        .gold-dust {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1px 1px at 10% 10%, rgba(255, 215, 0, 0.8), transparent),
                radial-gradient(2px 2px at 20% 30%, rgba(255, 215, 0, 0.6), transparent);
            background-size: 200px 200px;
            animation: dustFloat 20s linear infinite;
        }

        /* Scenes */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s var(--ease-out), transform 1s var(--ease-out);
            transform: scale(0.95);
            z-index: 10;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* Scene 1: Harvest Cover */
        .cover-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2vh;
            justify-content: center;
            padding: 20px;
        }

        .title-area {
            margin-bottom: 20px;
        }

        .t-main {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: #FFECB3;
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
            margin-bottom: 15px;
        }

        .t-sub {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #D7CCC8;
            letter-spacing: 0.2em;
            font-weight: 600;
            opacity: 0.9;
        }

        .t-desc {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #A1887F;
            margin-top: 10px;
            letter-spacing: 0.1em;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Emblem */
        .harvest-emblem-wrap {
            position: relative;
            width: clamp(220px, 45vw, 320px);
            height: clamp(220px, 45vw, 320px);
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .emblem-glow {
            position: absolute;
            inset: -10%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.2) 0%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .emblem-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: rotateRing 60s linear infinite;
        }

        .wheat-svg {
            width: 80%;
            height: 80%;
            filter: drop-shadow(0 0 15px rgba(255, 160, 0, 0.8));
            transition: transform 0.5s var(--ease-elastic);
            fill: url(#goldGradient);
        }

        .harvest-emblem-wrap:hover .wheat-svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1));
        }

        .start-btn-frame {
            margin-top: 20px;
            padding: 15px 40px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.1) 50%, transparent 100%);
            color: #FFECB3;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.5s;
            font-family: 'Noto Serif TC', serif;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .start-btn-frame:hover {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.25) 50%, transparent 100%);
            letter-spacing: 0.3em;
            text-shadow: 0 0 10px #FFC107;
            border-color: #FFD700;
        }

        /* === Scene 2: 5 Bronze Medallions === */
        /*
           Reference Style:
           - Material: Heavy Bronze/Gold
           - Shape: Circle with thick ridged border
           - Lighting: Strong top-down highlight, deep bottom shadow (Embossed)
           - Glow: Backlit aura
           - Symbols: Simple, geometric, recessed/embossed
        */

        .sel-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .sel-header {
            text-align: center;
            z-index: 2;
        }

        .sel-main {
            font-size: 2rem;
            color: #FFECB3;
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 193, 7, 0.4);
        }

        .sel-sub {
            font-size: 1.1rem;
            color: #BCAAA4;
            letter-spacing: 0.3em;
            opacity: 0.9;
        }

        .medallion-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 32px;
            width: 100%;
            max-width: 1100px;
        }

        .medallion-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            position: relative;
        }

        /* The Bronze Medallion */
        .medallion {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            position: relative;
            z-index: 1;
            /* Bronze Metallic Gradient */
            background: radial-gradient(circle at 30% 30%,
                    #A1887F 0%,
                    #6D4C41 30%,
                    #3E2723 80%,
                    #1B120F 100%);
            /* Complex Embossed Shadow Structure */
            box-shadow:
                /* Outer Glow (Backlight) */
                0 0 30px rgba(255, 179, 0, 0.15),
                /* Deep Drop Shadow */
                0 20px 40px rgba(0, 0, 0, 0.7),
                /* Rim Highlight (Top Left) */
                inset 2px 2px 5px rgba(255, 255, 255, 0.4),
                /* Rim Shadow (Bottom Right) */
                inset -2px -2px 5px rgba(0, 0, 0, 0.8);

            border: 1px solid rgba(255, 255, 255, 0.1);

            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Thick Border Ring (The "Ridge") */
        .medallion::before {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 4px solid #5D4037;
            box-shadow:
                /* Inner Ridge Highlight */
                inset 1px 1px 2px rgba(255, 255, 255, 0.2),
                inset -1px -1px 2px rgba(0, 0, 0, 0.6),
                /* Outer Ridge Shadow */
                1px 1px 2px rgba(255, 255, 255, 0.1),
                -1px -1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Inner Recess (Where the icon sits) */
        .medallion-inner {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.8));
        }

        /* Icon Styling - Embossed Gold */
        .medallion-svg {
            width: 100%;
            height: 100%;
            fill: #FFCA28;
            /* Gold */
            /* Creating the "Pressed/Stamped" look via Gradient/Filter */
            /* Since we can't do complex gradients on fill easily, we use filters */
            filter:
                drop-shadow(1px 1px 0px rgba(62, 39, 35, 0.8)) drop-shadow(-1px -1px 0px rgba(255, 255, 255, 0.2));
            transition: all 0.4s ease;
        }

        /* Hover Effects */
        .medallion-item:hover .medallion {
            transform: translateY(-10px);
            box-shadow:
                0 0 50px rgba(255, 179, 0, 0.3),
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 2px 2px 8px rgba(255, 255, 255, 0.5),
                inset -2px -2px 8px rgba(0, 0, 0, 0.9);
            background: radial-gradient(circle at 30% 30%,
                    #BCAAA4 0%,
                    #8D6E63 30%,
                    #4E342E 80%,
                    #291E1A 100%);
        }

        .medallion-item:hover .medallion-svg {
            fill: #FFD54F;
            /* Brighter Gold */
            transform: scale(1.05);
            filter:
                drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .medallion-label {
            font-size: 1.2rem;
            color: #BCAAA4;
            letter-spacing: 0.2em;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            transition: 0.3s;
            margin-top: 5px;
        }

        .medallion-item:hover .medallion-label {
            color: #FFD54F;
            text-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
            transform: translateY(2px);
        }

        /* Mobile Adjustment */
        @media(max-width: 600px) {
            .medallion-row {
                gap: 20px;
            }

            .medallion {
                width: 100px;
                height: 100px;
            }

            .medallion::before {
                inset: 6px;
                border-width: 3px;
            }

            .medallion-inner {
                width: 55px;
                height: 55px;
            }

            .medallion-label {
                font-size: 1rem;
            }
        }

        /* === Scene 3: Oracle === */
        .oracle-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
            max-height: 100vh;
            overflow-y: auto;
        }

        .spin-count {
            font-size: 4rem;
            font-family: 'Cinzel';
            color: #FFB300;
            margin-bottom: 30px;
        }

        .connect-btn {
            background: #FFB300;
            color: #3E2723;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.2rem;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.4);
        }

        .connect-btn:hover {
            background: #FFCA28;
            box-shadow: 0 0 40px rgba(255, 179, 0, 0.6);
        }

        /* ===== 牌卡容器 ===== */
        .card-final {
            --glyph: 100px;
            background: #F4EBD9;
            color: #3E2723;
            padding: 30px;
            border-radius: 12px;
            width: min(400px, 92vw);
            text-align: center;
            display: none;
            animation: popUp 0.8s var(--ease-elastic);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .card-final.show {
            display: block;
        }

        /* ===== 神廟調性比例語法覆寫 ===== */
        .card-final .tone-dots {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
            gap: var(--tone-gap-dotdot, 8px);
        }

        .card-final .tone-bars {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--tone-gap-barbar, 6px);
        }

        .card-final .tone-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--tone-gap-rowrow, 6px);
            margin-bottom: 12px;
        }

        .card-final .tone-area.no-dots .tone-dots {
            display: none;
        }

        .card-final .t-dot {
            width: var(--tone-dot-size, 12px);
            height: var(--tone-dot-size, 12px);
            background: #3E2723;
            border-radius: 50%;
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-final .t-bar {
            width: var(--tone-bar-w, 106px);
            height: var(--tone-bar-h, 9px);
            background: #3E2723;
            border-radius: calc(var(--tone-bar-h, 9px) / 2);
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .card-final .glyph-img {
            width: var(--glyph);
            height: var(--glyph);
            object-fit: contain;
        }

        /* 牌卡內容區塊 */
        .card-block {
            text-align: left;
            background: rgba(0, 0, 0, 0.05);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .card-block-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #8D6E63;
            margin-bottom: 5px;
            letter-spacing: 0.1em;
        }

        .card-block-text {
            color: #4E342E;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .card-block-border {
            text-align: left;
            border-left: 3px solid #8D6E63;
            padding-left: 15px;
            margin-bottom: 12px;
        }

        .nav-row {
            margin-top: 30px;
            display: none;
            gap: 20px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #FFCA28;
            color: #FFCA28;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #FFCA28;
            color: #3E2723;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        @keyframes dustFloat {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 200px 200px;
            }
        }

        @keyframes popUp {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes rotateRing {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer"></div>
    <div class="gold-dust"></div>

    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#FFECB3;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#FFC107;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
            </linearGradient>

            <symbol id="icon-wheat" viewBox="0 0 100 100">
                <path d="M50,90 C50,90 50,20 50,20" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"
                    fill="none" />
                <path d="M50,70 C30,60 30,40 50,30" fill="url(#goldGradient)" />
                <path d="M50,55 C35,45 35,35 50,25" fill="url(#goldGradient)" />
                <path d="M50,40 C40,35 40,30 50,22" fill="url(#goldGradient)" />
                <path d="M50,70 C70,60 70,40 50,30" fill="url(#goldGradient)" />
                <path d="M50,55 C65,45 65,35 50,25" fill="url(#goldGradient)" />
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
            </symbol>

            <!-- 
               Five Life Keys Symbols - Temple Style
               Simplified, Geometric, Thick Lines for Iconography
            -->

            <!-- 1. Financial: Interlocking Coins / Endless Knot -->
            <symbol id="icon-financial" viewBox="0 0 100 100">
                <!-- A stylized infinity knot or coin stack -->
                <circle cx="35" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="8" />
                <circle cx="65" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="8" />
                <path d="M35,50 L65,50" stroke="currentColor" stroke-width="8" />
                <circle cx="50" cy="50" r="12" fill="currentColor" />
            </symbol>

            <!-- 2. Career: Obelisk / Beacon -->
            <symbol id="icon-career" viewBox="0 0 100 100">
                <!-- A strong central pillar -->
                <path d="M35,85 L65,85 L60,25 L50,10 L40,25 Z" fill="currentColor" stroke="none" />
                <rect x="30" y="85" width="40" height="8" fill="currentColor" />
                <!-- Radiating lines -->
                <path d="M20,40 L10,30" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
                <path d="M80,40 L90,30" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
            </symbol>

            <!-- 3. Relationship: Interlocking Rings -->
            <symbol id="icon-relationship" viewBox="0 0 100 100">
                <!-- Two clear interlocking rings -->
                <circle cx="40" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="8" />
                <circle cx="60" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="8" />
            </symbol>

            <!-- 4. Health: Tree of Lift / Roots -->
            <symbol id="icon-health" viewBox="0 0 100 100">
                <path d="M50,90 L50,60" stroke="currentColor" stroke-width="8" stroke-linecap="round" />
                <path d="M50,60 Q30,50 20,30" fill="none" stroke="currentColor" stroke-width="6"
                    stroke-linecap="round" />
                <path d="M50,60 Q70,50 80,30" fill="none" stroke="currentColor" stroke-width="6"
                    stroke-linecap="round" />
                <path d="M50,60 Q50,40 50,20" fill="none" stroke="currentColor" stroke-width="6"
                    stroke-linecap="round" />
                <circle cx="20" cy="30" r="6" fill="currentColor" />
                <circle cx="80" cy="30" r="6" fill="currentColor" />
                <circle cx="50" cy="20" r="6" fill="currentColor" />
            </symbol>

            <!-- 5. Growth: Fibonacci / Nautilus -->
            <symbol id="icon-growth" viewBox="0 0 100 100">
                <!-- Golden spiral -->
                <path d="M50,50 m-30,0 a30,30 0 1,1 60,0 a30,30 0 1,1 -60,0" fill="none" stroke="currentColor"
                    stroke-width="2" opacity="0.3" />
                <path d="M50,50 L50,20 A30,30 0 0,1 80,50 A30,30 0 0,1 50,80 A30,30 0 0,1 20,50" fill="none"
                    stroke="currentColor" stroke-width="8" stroke-linecap="round" />
                <path d="M20,50 A15,15 0 0,0 50,50" fill="none" stroke="currentColor" stroke-width="8"
                    stroke-linecap="round" />
            </symbol>

        </defs>
    </svg>

    <!-- Scene 1: Harvest Cover -->
    <section id="s_gate" class="scene active" onclick="goSelection()">
        <div class="cover-content">
            <div class="title-area">
                <div class="t-main">南方 · 金穗</div>
                <div class="t-sub">成熟、覺醒與鞏固的果實</div>
            </div>

            <div class="harvest-emblem-wrap">
                <div class="emblem-glow"></div>
                <div class="emblem-ring"></div>
                <svg class="wheat-svg">
                    <use href="#icon-wheat"></use>
                </svg>
            </div>

            <div class="t-desc">
                整合走過的旅程，<br>收穫屬於你的智慧與成果
            </div>
            <div class="start-btn-frame">
                開啟豐盛之門
            </div>
        </div>
    </section>

    <!-- Scene 2: Selection (Updated Bronze Medallions) -->
    <section id="s_selection" class="scene">
        <div class="sel-container">
            <div class="sel-header">
                <div class="sel-main">五大生命金鑰</div>
                <div class="sel-sub">點擊門章 · 領取指引</div>
            </div>

            <div class="medallion-row">
                <!-- Financial -->
                <div class="medallion-item" onclick="start('financial', '財務')">
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg">
                                <use href="#icon-financial"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="medallion-label">財務</div>
                </div>

                <!-- Career -->
                <div class="medallion-item" onclick="start('career', '事業')">
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg">
                                <use href="#icon-career"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="medallion-label">事業</div>
                </div>

                <!-- Relationship -->
                <div class="medallion-item" onclick="start('relationship', '感情')">
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg">
                                <use href="#icon-relationship"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="medallion-label">感情</div>
                </div>

                <!-- Health -->
                <div class="medallion-item" onclick="start('health', '健康')">
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg">
                                <use href="#icon-health"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="medallion-label">健康</div>
                </div>

                <!-- Growth -->
                <div class="medallion-item" onclick="start('growth', '成長')">
                    <div class="medallion">
                        <div class="medallion-inner">
                            <svg class="medallion-svg">
                                <use href="#icon-growth"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="medallion-label">成長</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scene 3: Oracle -->
    <section id="s_oracle" class="scene">
        <div class="oracle-layout">
            <div id="minigame" style="text-align:center;">
                <div id="spinNum" class="spin-count">1</div>
                <button class="connect-btn" onclick="reveal()">接引指引...</button>
            </div>

            <div id="card" class="card-final">
                <!-- Content injected by reveal() -->
            </div>

            <div id="nav" class="nav-row">
                <button class="nav-btn" onclick="goHome()">回首頁</button>
                <button class="nav-btn" onclick="goSel()">再選一次</button>
            </div>
        </div>
    </section>

    <script>
        let interval = null;
        let theme = '';

        function switchS(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goSelection() { switchS('s_selection'); }
        function goHome() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_gate');
        }
        function goSel() {
            document.getElementById('card').classList.remove('show');
            document.getElementById('nav').style.display = 'none';
            switchS('s_selection');
        }

        function start(tid, tname) {
            theme = tname;
            switchS('s_oracle');
            document.getElementById('minigame').style.display = 'block';
            document.getElementById('card').style.display = 'none';
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                document.getElementById('spinNum').innerText = Math.floor(Math.random() * 260) + 1;
            }, 50);
        }

        function reveal() {
            clearInterval(interval);
            const kin = Math.floor(Math.random() * 260) + 1;

            const toneId = (kin - 1) % 13 + 1;
            const glyphId = (kin - 1) % 20 + 1;
            const sealPad = String(glyphId).padStart(2, '0');
            const toneNames = ['磁性', '月亮', '電力', '自我存在', '超頻', '韻律', '共鳴', '銀河', '太陽', '行星', '光譜', '水晶', '宇宙'];
            const glyphNames = ['紅龍', '白風', '藍夜', '黃種子', '紅蛇', '白世界橋', '藍手', '黃星星', '紅月', '白狗', '藍猴', '黃人', '紅天行者', '白巫師', '藍鷹', '黃戰士', '紅地球', '白鏡', '藍風暴', '黃太陽'];

            /* 調性渲染 — 神廟調性比例語法
             * dots/bars 數量計算與紅屋一致
             * 尺寸與間距由 tone-scale.js 注入的 CSS 變數控制 */
            const dots = toneId % 5;
            const bars = Math.floor(toneId / 5);
            const noDots = dots === 0 ? ' no-dots' : '';

            let tHtml = '<div class="tone-dots">';
            for (let i = 0; i < dots; i++) tHtml += '<div class="t-dot"></div>';
            tHtml += '</div><div class="tone-bars">';
            for (let i = 0; i < bars; i++) tHtml += '<div class="t-bar"></div>';
            tHtml += '</div>';

            const data = (typeof kinData !== 'undefined' && kinData[kin])
                ? kinData[kin]
                : { synchronicMessage: '', alignment: '', grounding: '' };

            const c = document.getElementById('card');
            c.innerHTML = `
                <div class="tone-area${noDots}">
                    ${tHtml}
                </div>
                <img class="glyph-img" src="../images/${sealPad}.png" alt="${glyphNames[glyphId - 1]}" onerror="this.style.display='none'">
                <div style="font-family:'Cinzel'; color:#8D6E63; font-weight:700; margin-top:10px;">KIN ${kin}</div>
                <div style="font-size:1.4rem; font-weight:900; color:#3E2723; margin-bottom:16px;">${toneNames[toneId - 1]}的${glyphNames[glyphId - 1]}</div>

                <div class="card-block">
                    <div class="card-block-label">⚡ 能量感應</div>
                    <div class="card-block-text">${data.synchronicMessage || ''}</div>
                </div>
                <div class="card-block">
                    <div class="card-block-label">🌱 調頻指引</div>
                    <div class="card-block-text">${data.alignment || ''}</div>
                </div>
                <div class="card-block-border">
                    <div class="card-block-label">🪨 落地行動</div>
                    <div class="card-block-text">${data.grounding || ''}</div>
                </div>
                <div style="margin-top:16px; font-size:0.8rem; color:#aaa; letter-spacing:0.2em;">✦ ${theme}指引 ✦</div>
            `;

            // 注入神廟調性比例語法：從 .card-final 的 --glyph 推導所有 tone 變數
            if (window.TONE_SCALE) {
                TONE_SCALE.apply(c);
            }

            document.getElementById('minigame').style.display = 'none';
            c.style.display = 'block';
            c.classList.add('show');
            document.getElementById('nav').style.display = 'flex';
        }
    </script>
</body>

</html>
